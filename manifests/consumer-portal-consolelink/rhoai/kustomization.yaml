apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# MaaS Consumer Portal ConsoleLink. Deployed conditionally by the
# dashboard-operator when spec.consumerPortal.managementState is Managed and
# Gateway.Domain is set. The operator writes consumer-portal-url and
# section-title into params.env before rendering.
#
# No commonLabels here: the portal is a separate product from rhods-dashboard,
# and the operator's deployer stamps platform.opendatahub.io/part-of=consumer-portal.
resources:
  - consolelink.yaml
configMapGenerator:
  - name: consumer-portal-params
    env: params.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: consumer-portal-params
      fieldPath: data.section-title
    targets:
      - select:
          kind: ConsoleLink
          name: consumer-portal-link
        fieldPaths:
          - spec.applicationMenu.section
  - source:
      kind: ConfigMap
      name: consumer-portal-params
      fieldPath: data.consumer-portal-url
    targets:
      - select:
          kind: ConsoleLink
          name: consumer-portal-link
        fieldPaths:
          - spec.href
