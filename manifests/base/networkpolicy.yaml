# Operand NetworkPolicy for the main Dashboard pod (odh-dashboard / rhods-dashboard).
# Least-privilege ingress/egress for the 3-container pod (frontend, kube-rbac-proxy,
# core-bff). Intra-pod traffic (frontend <-> proxy <-> bff) is loopback and not subject
# to NetworkPolicy. Satisfies HPSTRAT-104 / operand contract RHOAIENG-90747 (R3-R5).
# rhoai overlay renames the podSelector to rhods-dashboard (see rhoai/networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-allow-ports
spec:
  podSelector:
    matchLabels:
      deployment: odh-dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Gateway / OpenShift router -> dashboard UI (kube-rbac-proxy) and core-bff.
    - ports:
        - port: 8443
          protocol: TCP
        - port: 8943
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
    # Module BFF operands call core-bff (:8943) for platform-level APIs
    # (connection testing, cluster settings, serving runtimes; see
    # docs/inter-bff-communication.md). A podSelector cannot be used here: the odh/rhoai
    # overlays inject the dashboard's identity labels into every podSelector via kustomize
    # commonLabels (includeSelectors), so a podSelector would only ever match the dashboard
    # pod, never the module BFFs. We therefore port-scope to 8943 (the modules run in this
    # same namespace). Documented reduced-posture limitation per operand contract R5.
    - ports:
        - port: 8943
          protocol: TCP
      from:
        - namespaceSelector: {}
  egress:
    # Cluster DNS resolution.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    # Kubernetes API server. NetworkPolicy cannot select the API server endpoints
    # (host-networked, dynamic IP/port), so this allows egress to 6443 cluster-wide.
    # Documented reduced-posture limitation per operand contract R5.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
          protocol: TCP
    # Dashboard backend (localhost:8080, behind kube-rbac-proxy:8443) proxies /api/*
    # to the module BFF operands, which have no gateway HTTPRoute of their own.
    # A podSelector cannot be used here: the odh/rhoai overlays apply the dashboard's
    # own identity labels to every podSelector via kustomize commonLabels
    # (includeSelectors), so a podSelector would only ever match the dashboard pod,
    # never the modules. We therefore port-scope to the module BFF ports (the modules
    # run in this same namespace). Documented reduced-posture limitation per contract R5.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 8043
          protocol: TCP
        - port: 8143
          protocol: TCP
        - port: 8243
          protocol: TCP
        - port: 8343
          protocol: TCP
        - port: 8543
          protocol: TCP
        - port: 8643
          protocol: TCP
        - port: 8743
          protocol: TCP
        - port: 8843
          protocol: TCP
        - port: 9043
          protocol: TCP
        - port: 9143
          protocol: TCP
        - port: 9243
          protocol: TCP
    # Cross-namespace to user-project workloads: the Data Science Pipelines application
    # server (ds-pipeline-dspa, 8443). The dashboard backend proxies /api/service/pipelines/*
    # to ds-pipeline-dspa.<ns>.svc:8443, where <ns> is the user-selected project namespace,
    # so it is port-scoped rather than allow-all; documented R5 limitation.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 8443
          protocol: TCP
    # Cross-namespace to user-project workloads: the Feast Feature Store registry REST server
    # (feast-<name>-registry-rest). The Feast operator exposes this Service on port 443 (TLS) /
    # 80 (non-TLS) but maps them to pod targetPort 6573 (TLS) / 6572 (non-TLS). NetworkPolicy
    # egress is evaluated against the post-DNAT destination pod port, so the external 443/80
    # ipBlock rule does not cover it. Scoped to namespaces opted into Feast via the
    # opendatahub.io/feast=true label (the same label the dashboard backend uses to discover
    # Feast projects; see backend/src/routes/api/featurestores/featureStoreUtils.ts). See RHAI-13640.
    # A podSelector would scope this tighter (to registry pods only), but the odh/rhoai overlays
    # inject the dashboard's identity labels into every podSelector via kustomize commonLabels,
    # so a podSelector here would match zero Feast pods. We therefore namespace-scope + port-scope,
    # consistent with the module-BFF and DSPA rules above. Documented R5 limitation per contract.
    - to:
        - namespaceSelector:
            matchLabels:
              opendatahub.io/feast: "true"
      ports:
        - port: 6573
          protocol: TCP
        - port: 6572
          protocol: TCP
    # Cluster monitoring: the dashboard backend proxies storage/PVC metrics queries to
    # Thanos querier (thanos-querier.openshift-monitoring.svc) on the tenancy (9092) and
    # web (9091) ports. Scoped to the openshift-monitoring namespace.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
      ports:
        - port: 9091
          protocol: TCP
        - port: 9092
          protocol: TCP
    # External / off-cluster HTTP(S). The dashboard reaches user-configurable and
    # hostname-based endpoints that cannot be expressed as NetworkPolicy peers
    # (no DNS-name selection). Documented reduced-posture limitation per contract R5.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
