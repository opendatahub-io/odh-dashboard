apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dashboard-perses-access
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/managed-by: perses-operator
  policyTypes:
    - Ingress
  ingress:
    # Dashboard pods (in-cluster BFF or direct service calls).
    # applicationsNamespace is rewritten by the dashboard-operator at apply time.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opendatahub
          podSelector:
            matchLabels:
              app.kubernetes.io/part-of: odh-dashboard
      ports:
        - protocol: TCP
          port: 8080
    # Observe UI → Perses via data-science-gateway (Gateway API name only).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: data-science-gateway
      ports:
        - protocol: TCP
          port: 8080
