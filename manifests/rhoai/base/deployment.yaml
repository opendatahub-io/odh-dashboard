- op: replace
  path: /metadata/name
  value: rhods-dashboard
- op: replace
  path: /spec/selector/matchLabels/deployment
  value: rhods-dashboard
- op: replace
  path: /spec/template/metadata/labels/deployment
  value: rhods-dashboard
- op: replace
  path: /spec/template/spec/affinity/podAntiAffinity/preferredDuringSchedulingIgnoredDuringExecution/0/podAffinityTerm/labelSelector/matchExpressions/0/values/0
  value: rhods-dashboard
- op: replace
  path: /spec/template/spec/containers/0/name
  value: rhods-dashboard
  # The image value is already an env
- op: replace
  path: /spec/template/spec/serviceAccount
  value: rhods-dashboard
# core-bff is now container index 2; gen-ai-ui is index 4 (was 3), eval-hub-ui is index 7 (was 6)
# model-registry-ui (index 3) calls the MLflow BFF via BFF_MLFLOW_SERVICE_NAME, which
# defaults to the shared "odh-dashboard" Service name in sidecar mode -- override to match
# the renamed "rhods-dashboard" Service, same as the other inter-BFF overrides below.
- op: replace
  path: /spec/template/spec/containers/3/env/1/value
  value: "rhods-dashboard"
- op: replace
  path: /spec/template/spec/containers/4/env/3/value
  value: "rhods-dashboard"
- op: replace
  path: /spec/template/spec/containers/4/env/9/value
  value: "rhods-dashboard"
- op: replace
  path: /spec/template/spec/containers/7/env/1/value
  value: "rhods-dashboard"
