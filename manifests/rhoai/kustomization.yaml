apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonLabels:
  app: rhods-dashboard
  app.kubernetes.io/part-of: rhods-dashboard
  # Legacy label from the old opendatahub-operator's CreateAddLabelsPlugin.
  # Required for upgrade compatibility: spec.selector.matchLabels is immutable,
  # so the selector must match what the old operator wrote to existing Deployments.
  app.opendatahub.io/rhods-dashboard: "true"
resources:
  - ./apps
  - ./base
  - ./consolelink
  - ./odhdashboardconfig
configMapGenerator:
  - name: rhoai-dashboard-params
    env: params.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.odh-dashboard-image
    targets:
      - select:
          kind: Deployment
          name: rhods-dashboard
        fieldPaths:
          - spec.template.spec.containers.[name=rhods-dashboard].image
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.kube-rbac-proxy
    targets:
      - select:
          kind: Deployment
          name: rhods-dashboard
        fieldPaths:
          - spec.template.spec.containers.[name=kube-rbac-proxy].image
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.core-bff-image
    targets:
      - select:
          kind: Deployment
          name: rhods-dashboard
        fieldPaths:
          - spec.template.spec.containers.[name=core-bff].image
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.section-title
    targets:
      - select:
          kind: ConsoleLink
          name: rhodslink
        fieldPaths:
          - spec.applicationMenu.section
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.dashboard-url
    targets:
      - select:
          kind: ConsoleLink
          name: rhodslink
        fieldPaths:
          - spec.href
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.gateway-name
    targets:
      - select:
          kind: HTTPRoute
          name: rhods-dashboard
        fieldPaths:
          - spec.parentRefs.0.name
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.images-jobs-async-upload
    targets:
      - select:
          kind: ConfigMap
          name: model-registry-ui-config
        fieldPaths:
          - data.images-jobs-async-upload
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.gateway-domain
    targets:
      - select:
          kind: Deployment
          name: rhods-dashboard
        fieldPaths:
          - spec.template.spec.containers.[name=rhods-dashboard].env.[name=GATEWAY_DOMAIN].value
          - spec.template.spec.containers.[name=gen-ai-ui].env.[name=GATEWAY_DOMAIN].value
          - spec.template.spec.containers.[name=model-registry-ui].env.[name=GATEWAY_DOMAIN].value
          - spec.template.spec.containers.[name=maas-ui].env.[name=GATEWAY_DOMAIN].value
