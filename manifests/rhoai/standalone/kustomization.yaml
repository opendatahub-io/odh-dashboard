apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Standalone mode: 3-container pod (rhods-dashboard, kube-rbac-proxy, core-bff).
# BFF modules are deployed as separate pods by the operator.
# Core RHOAI renames applied; sidecar container-index patches are NOT included.
commonLabels:
  app: rhods-dashboard
  app.kubernetes.io/part-of: rhods-dashboard
  # Legacy label from the old opendatahub-operator's CreateAddLabelsPlugin.
  # Required for upgrade compatibility: spec.selector.matchLabels is immutable,
  # so the selector must match what the old operator wrote to existing Deployments.
  app.opendatahub.io/rhods-dashboard: "true"
resources:
  - ../../base
  - ../consolelink
  - ../odhdashboardconfig
  - ../apps
configMapGenerator:
  - name: rhoai-dashboard-params
    env: params.env
generatorOptions:
  disableNameSuffixHash: true
patchesJson6902:
  # Core RHOAI renames only — NO sidecar container-index patches
  - path: deployment.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: odh-dashboard
  - path: service-account.yaml
    target:
      version: v1
      kind: ServiceAccount
      name: odh-dashboard
  - path: role.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: Role
      name: odh-dashboard
  - path: cluster-role.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRole
      name: odh-dashboard
  - path: role-binding.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: RoleBinding
      name: odh-dashboard
  - path: cluster-role-binding.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: odh-dashboard
  - path: auth-delegator.clusterrolebinding.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: odh-dashboard-auth-delegator
  - path: cluster-monitoring-role-binding.yaml
    target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: odh-dashboard-monitoring
  - path: service.yaml
    target:
      version: v1
      kind: Service
      name: odh-dashboard
  - path: httproute.yaml
    target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: odh-dashboard
  # NetworkPolicy only exists in manifests/sidecar/ — not present in ../../base.
  # No NetworkPolicy patch needed in standalone mode.
  - path: pdb.yaml
    target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: odh-dashboard
replacements:
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.odh-dashboard-image
    targets:
      - select:
          kind: Deployment
          name: rhods-dashboard
        fieldPaths:
          - spec.template.spec.containers.[name=rhods-dashboard].image
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.kube-rbac-proxy
    targets:
      - select:
          kind: Deployment
          name: rhods-dashboard
        fieldPaths:
          - spec.template.spec.containers.[name=kube-rbac-proxy].image
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.core-bff-image
    targets:
      - select:
          kind: Deployment
          name: rhods-dashboard
        fieldPaths:
          - spec.template.spec.containers.[name=core-bff].image
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.section-title
    targets:
      - select:
          kind: ConsoleLink
          name: rhodslink
        fieldPaths:
          - spec.applicationMenu.section
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.dashboard-url
    targets:
      - select:
          kind: ConsoleLink
          name: rhodslink
        fieldPaths:
          - spec.href
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.gateway-name
    targets:
      - select:
          kind: HTTPRoute
          name: rhods-dashboard
        fieldPaths:
          - spec.parentRefs.0.name
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.images-jobs-async-upload
    targets:
      - select:
          kind: ConfigMap
          name: model-registry-ui-config
        fieldPaths:
          - data.images-jobs-async-upload
  - source:
      kind: ConfigMap
      name: rhoai-dashboard-params
      fieldPath: data.gateway-domain
    targets:
      - select:
          kind: Deployment
          name: rhods-dashboard
        fieldPaths:
          - spec.template.spec.containers.[name=rhods-dashboard].env.[name=GATEWAY_DOMAIN].value
