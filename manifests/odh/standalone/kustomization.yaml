apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Standalone mode: 3-container pod (odh-dashboard, kube-rbac-proxy, core-bff).
# BFF modules are deployed as separate pods by the operator.
commonLabels:
  app: odh-dashboard
  app.kubernetes.io/part-of: odh-dashboard
  # Legacy label from the old opendatahub-operator's CreateAddLabelsPlugin.
  # Required for upgrade compatibility: spec.selector.matchLabels is immutable,
  # so the selector must match what the old operator wrote to existing Deployments.
  app.opendatahub.io/odh-dashboard: "true"
resources:
  - ../../base
  - ../../base/consolelink
  - ../apps
configMapGenerator:
  - name: odh-dashboard-params
    env: params.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: odh-dashboard-params
      fieldPath: data.odh-dashboard-image
    targets:
      - select:
          kind: Deployment
          name: odh-dashboard
        fieldPaths:
          - spec.template.spec.containers.[name=odh-dashboard].image
  - source:
      kind: ConfigMap
      name: odh-dashboard-params
      fieldPath: data.kube-rbac-proxy
    targets:
      - select:
          kind: Deployment
          name: odh-dashboard
        fieldPaths:
          - spec.template.spec.containers.[name=kube-rbac-proxy].image
  - source:
      kind: ConfigMap
      name: odh-dashboard-params
      fieldPath: data.core-bff-image
    targets:
      - select:
          kind: Deployment
          name: odh-dashboard
        fieldPaths:
          - spec.template.spec.containers.[name=core-bff].image
  - source:
      kind: ConfigMap
      name: odh-dashboard-params
      fieldPath: data.section-title
    targets:
      - select:
          kind: ConsoleLink
          name: odhlink
        fieldPaths:
          - spec.applicationMenu.section
  - source:
      kind: ConfigMap
      name: odh-dashboard-params
      fieldPath: data.dashboard-url
    targets:
      - select:
          kind: ConsoleLink
          name: odhlink
        fieldPaths:
          - spec.href
  - source:
      kind: ConfigMap
      name: odh-dashboard-params
      fieldPath: data.gateway-name
    targets:
      - select:
          kind: HTTPRoute
          name: odh-dashboard
        fieldPaths:
          - spec.parentRefs.0.name
  - source:
      kind: ConfigMap
      name: odh-dashboard-params
      fieldPath: data.images-jobs-async-upload
    targets:
      - select:
          kind: ConfigMap
          name: model-registry-ui-config
        fieldPaths:
          - data.images-jobs-async-upload
  - source:
      kind: ConfigMap
      name: odh-dashboard-params
      fieldPath: data.gateway-domain
    targets:
      - select:
          kind: Deployment
          name: odh-dashboard
        fieldPaths:
          - spec.template.spec.containers.[name=odh-dashboard].env.[name=GATEWAY_DOMAIN].value
