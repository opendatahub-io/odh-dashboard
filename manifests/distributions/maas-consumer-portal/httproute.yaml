apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maas-consumer-portal
spec:
  parentRefs:
    - name: gateway-name
      kind: Gateway
      namespace: openshift-ingress
  hostnames:
    - maas-consumer-portal-hostname
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: maas-consumer-portal
          port: 8443
