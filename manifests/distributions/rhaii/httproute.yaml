apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rhaii-dashboard
spec:
  # The Dashboard operator supplies this parent reference through Kustomize.
  # The XKS auth Gateway is provisioned independently and owns the external
  # hostname.
  parentRefs:
    - name: gateway-name
      kind: Gateway
      namespace: gateway-namespace
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: rhaii-dashboard
          port: 8443
