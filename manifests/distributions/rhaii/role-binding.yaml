apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhaii-dashboard
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhaii-dashboard
subjects:
  - kind: ServiceAccount
    name: rhaii-dashboard
    # Kustomize replaces this placeholder with the namespace that contains the
    # ServiceAccount when the bundle is rendered for installation.
    namespace: rhaii-dashboard-namespace
