apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rhaii-dashboard-tls
spec:
  secretName: rhaii-dashboard-tls
  dnsNames:
    - rhaii-dashboard.$(NAMESPACE).svc
    - rhaii-dashboard.$(NAMESPACE).svc.cluster.local
  duration: 8760h
  renewBefore: 720h
  issuerRef:
    # The xKS lifecycle resolves these parameters from the platform-managed
    # Dashboard ConfigMap before rendering this bundle.
    group: certificate-issuer-group
    kind: certificate-issuer-kind
    name: certificate-issuer-name
