apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhaii-dashboard
rules:
  # Connection types and dashboard settings are stored as ConfigMaps in the
  # dashboard namespace. The XKS Core BFF reads and administers them with its
  # ServiceAccount client.
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
  # /api/components lists OdhApplications with the ServiceAccount client. This
  # is an unconditional install requirement, also on clusters without the
  # OdhApplication API: the API server authorizes the request before it
  # resolves the resource, so without this rule an absent API is a 403, not
  # the empty list the bootstrap contract promises.
  # See distributions/core-bff/docs/bootstrap-contract.md.
  - apiGroups:
      - dashboard.opendatahub.io
    resources:
      - odhapplications
    verbs:
      - list
  # Admins can create custom KServe ServingRuntime resources through the BFF.
  - apiGroups:
      - serving.kserve.io
    resources:
      - servingruntimes
    verbs:
      - create
