apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhaii-dashboard
# These are the only operations the RHAII dashboard performs with its own
# ServiceAccount, and each is a read in the dashboard namespace. Everything a
# user initiates (writes included) runs with the caller's credentials. The list
# is the "Service-account permissions" table in
# distributions/core-bff/docs/bootstrap-contract.md, verb for verb, and
# distributions/core-bff/bff/internal/api/rhaii_bundle_rbac_test.go fails if
# this bundle grants anything else. Change the contract first.
rules:
  # Connection-type templates for GET /api/connection-types[/:name]. Every
  # authenticated user needs them and is not granted ConfigMap access here.
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - get
      - list
  # GET /api/config. Optional on xKS: an absent or forbidden read serves
  # defaults. Never created or patched by the service account.
  - apiGroups:
      - opendatahub.io
    resources:
      - odhdashboardconfigs
    verbs:
      - get
  # GET /api/components. An unconditional install requirement, also on clusters
  # without the OdhApplication API: the API server authorizes the request before
  # it resolves the resource, so without this rule an absent API is a 403, not
  # the empty list the bootstrap contract promises.
  - apiGroups:
      - dashboard.opendatahub.io
    resources:
      - odhapplications
    verbs:
      - list
