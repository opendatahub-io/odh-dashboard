apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhaii-dashboard
rules:
  # Connection types and dashboard settings are stored as ConfigMaps in the
  # dashboard namespace. The XKS Core BFF reads and administers them with its
  # ServiceAccount client.
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
  # Admins can create custom KServe ServingRuntime resources through the BFF.
  - apiGroups:
      - serving.kserve.io
    resources:
      - servingruntimes
    verbs:
      - create
