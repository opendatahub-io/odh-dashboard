apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhaii-dashboard
rules:
  # Model-serving promotion changes labels and annotations on the selected
  # namespace, which is a cluster-scoped Kubernetes resource.
  - apiGroups:
      - ''
    resources:
      - namespaces
    verbs:
      - patch
  # kube-rbac-proxy authenticates and authorizes forwarded user tokens.
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
