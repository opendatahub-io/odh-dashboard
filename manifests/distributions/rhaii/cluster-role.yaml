apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhaii-dashboard
rules:
  # Model-serving promotion changes labels and annotations on the selected
  # namespace, which is a cluster-scoped Kubernetes resource.
  - apiGroups:
      - ''
    resources:
      - namespaces
    verbs:
      - patch
  # Namespace discovery lists namespaces matching its label selector so it can
  # propose them to callers who cannot list namespaces themselves. Names only
  # reach a caller after that caller's own access reviews authorize them, and
  # namespace metadata is shown only when the caller may get the namespace.
  - apiGroups:
      - ''
    resources:
      - namespaces
    verbs:
      - list
