apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: rhaii-dashboard
spec:
  podSelector:
    matchLabels:
      deployment: rhaii-dashboard
  policyTypes:
    - Ingress
    - Egress
  # Kubelet probes (dashboard :8080, kube-rbac-proxy health :8444) need no
  # rule: NetworkPolicy always admits traffic from the Pod's own node. Those
  # ports stay closed to every other peer; :8080 is the plaintext upstream
  # behind kube-rbac-proxy and must only be reached over loopback.
  ingress:
    # Only the configured Gateway's data-plane Pods can reach the dashboard.
    # Match the standard Gateway API label as well as its namespace so that
    # other workloads in the Gateway namespace cannot access the Service.
    # This assumes the Gateway implementation runs its data plane in the
    # Gateway's namespace with that label, as Istio does for the xKS platform
    # Gateway. Implementations that run proxies elsewhere (Envoy Gateway's
    # default envoy-gateway-system) are not admitted; see
    # docs/dashboard-operator-xks.md.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gateway-namespace
          podSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: gateway-name
      ports:
        - protocol: TCP
          port: 8443
  egress:
    # Allow only the standard Kubernetes DNS ports in kube-system. Do not
    # depend on a provider-specific CoreDNS pod label.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # The Kubernetes API address is platform-managed and has no stable pod
    # selector. Kubernetes exposes it through kubernetes.default.svc on 443;
    # CNIs that evaluate policy after Service DNAT see the API endpoint's
    # standard 6443 port instead.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 6443
