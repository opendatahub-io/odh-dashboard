apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maas-portal
spec:
  parentRefs:
    - name: gateway-name
      kind: Gateway
      namespace: openshift-ingress
  rules:
    - matches:
        - path:
            type: Exact
            value: /maas-portal
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /maas-portal/
            statusCode: 302
    - matches:
        - path:
            type: PathPrefix
            value: /maas-portal
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: maas-portal
          port: 8443
