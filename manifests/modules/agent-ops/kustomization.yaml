apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service-account.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: agent-ops-params
    env: params.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: agent-ops-params
      fieldPath: data.agent-ops-ui-image
    targets:
      - select:
          kind: Deployment
          name: agent-ops-ui
        fieldPaths:
          - spec.template.spec.containers.[name=agent-ops-ui].image
