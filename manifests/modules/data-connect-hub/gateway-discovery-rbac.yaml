apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odh-dashboard-data-connect-hub-gateway-discovery
  namespace: openshift-ingress
rules:
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
    resourceNames:
      - data-science-gateway
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - get
    resourceNames:
      - data-science-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odh-dashboard-data-connect-hub-gateway-discovery
  namespace: openshift-ingress
subjects:
  - kind: ServiceAccount
    name: odh-dashboard-data-connect-hub-ui
    namespace: dashboard-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odh-dashboard-data-connect-hub-gateway-discovery
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odh-dashboard-data-connect-hub-gateway-discovery
  namespace: opendatahub
rules:
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
    resourceNames:
      - odh-gateway
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - get
    resourceNames:
      - odh-gateway
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odh-dashboard-data-connect-hub-gateway-discovery
  namespace: opendatahub
subjects:
  - kind: ServiceAccount
    name: odh-dashboard-data-connect-hub-ui
    namespace: dashboard-namespace
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odh-dashboard-data-connect-hub-gateway-discovery
