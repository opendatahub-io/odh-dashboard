# Operand ingress NetworkPolicy for the Data Connect Hub BFF/UI per HPSTRAT-104 and the
# operand contract RHOAIENG-90747 (R3-R5). Egress is intentionally unmanaged because the
# BFF discovers a hostname-based API endpoint that cannot be selected by NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-connect-hub-allow-ports
spec:
  podSelector:
    matchLabels:
      deployment: data-connect-hub-ui
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9243
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
