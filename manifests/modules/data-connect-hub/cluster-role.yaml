kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: odh-dashboard-data-connect-hub-ui
rules:
  - apiGroups:
      - ''
    verbs:
      - get
      - list
      - watch
    resources:
      - configmaps
  # Read the cluster-wide TLS security profile (apiservers.config.openshift.io/cluster)
  # so the BFF can enforce it on its HTTPS listener and reload on change. list/watch
  # must omit resourceNames to be granted; apiservers is a cluster singleton.
  - apiGroups:
      - config.openshift.io
    resources:
      - apiservers
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authorization.k8s.io
    verbs:
      - create
    resources:
      - subjectaccessreviews
