apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service-account.yaml
  - cluster-role.yaml
  - cluster-role-binding.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: data-connect-hub-params
    env: params.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: data-connect-hub-params
      fieldPath: data.data-connect-hub-ui-image
    targets:
      - select:
          kind: Deployment
          name: data-connect-hub-ui
        fieldPaths:
          - spec.template.spec.containers.[name=data-connect-hub-ui].image
