apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service-account.yaml
  - cluster-role.yaml
  - cluster-role-binding.yaml
  - gateway-discovery-rbac.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: data-connect-hub-params
    env: params.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: data-connect-hub-params
      fieldPath: data.data-connect-hub-ui-image
    targets:
      - select:
          kind: Deployment
          name: data-connect-hub-ui
        fieldPaths:
          - spec.template.spec.containers.[name=data-connect-hub-ui].image
  - source:
      kind: Deployment
      name: data-connect-hub-ui
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: RoleBinding
          name: odh-dashboard-data-connect-hub-gateway-discovery
        fieldPaths:
          - subjects.[name=odh-dashboard-data-connect-hub-ui].namespace
