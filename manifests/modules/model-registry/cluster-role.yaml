kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: odh-dashboard-model-registry
rules:
  - apiGroups:
      - config.openshift.io
    resources:
      - apiservers
    resourceNames:
      - cluster
    verbs:
      - get
  - apiGroups:
      - authorization.k8s.io
    verbs:
      - create
    resources:
      - subjectaccessreviews
  # MCP catalog deploy readiness: read the gateways published by the MCP Lifecycle
  # module operator. The CR is a cluster-scoped singleton named "default".
  - apiGroups:
      - components.platform.opendatahub.io
    resources:
      - mcplifecycleoperators
    resourceNames:
      - default
    verbs:
      - get
  # Current MCP Lifecycle releases expose readiness through the Gateway API and
  # MCPGatewayExtension resources instead of availableMCPGateways status.
  - apiGroups:
      - mcp.kuadrant.io
    resources:
      - mcpgatewayextensions
    verbs:
      - get
      - list
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - get
      - list
  # Guided MCP installs publish the selected server through the live gateway.
  # The BFF only manages resources labeled for the server it created.
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
    verbs:
      - get
      - list
      - create
      - delete
  # Cross-namespace MCP routes require a ReferenceGrant in the backend
  # namespace. The BFF creates and cleans up only its labeled grants.
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - referencegrants
    verbs:
      - get
      - list
      - create
      - delete
  - apiGroups:
      - mcp.kuadrant.io
    resources:
      - mcpserverregistrations
    verbs:
      - get
      - list
      - create
      - delete
