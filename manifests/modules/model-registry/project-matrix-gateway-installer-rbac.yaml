apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: project-matrix-gateway-installer
  labels:
    ai.redhat.com/managed-by: project-matrix
    ai.redhat.com/layer: gateway
rules:
  # Read-only Gateway readiness sources used by the MCP prerequisite check.
  - apiGroups:
      - components.platform.opendatahub.io
    resources:
      - mcplifecycleoperators
    resourceNames:
      - default
    verbs:
      - get
  - apiGroups:
      - mcp.kuadrant.io
    resources:
      - mcpgatewayextensions
    verbs:
      - list
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - gateways
    verbs:
      - get
  # The BFF creates and removes only MCPServer objects generated by the
  # Project Matrix Gateway installer. Ownership labels are enforced in code.
  - apiGroups:
      - mcp.x-k8s.io
    resources:
      - mcpservers
    verbs:
      - get
      - list
      - watch
      - create
      - patch
      - delete
  # Per-install prerequisites and their cleanup inventory.
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
      - configmaps
    verbs:
      - get
      - list
      - create
      - update
      - patch
      - delete
  # Read-only inventory used to prove that operator-created dependents are
  # gone before a rollback or uninstall is reported complete.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
    verbs:
      - get
      - list
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - get
      - list
  - apiGroups:
      - route.openshift.io
    resources:
      - routes
    verbs:
      - get
      - list
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - rolebindings
    verbs:
      - get
      - list
      - create
      - delete
  # Kubernetes privilege-escalation prevention requires an explicit bind
  # grant before this installer may attach the built-in read-only view role
  # to its per-install MCP service account. This is intentionally limited to
  # that single ClusterRole; the dashboard never receives view permissions.
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - view
    verbs:
      - bind
  # Gateway registration resources created by the Gateway layer adapter.
  - apiGroups:
      - gateway.networking.k8s.io
    resources:
      - httproutes
      - referencegrants
    verbs:
      - get
      - list
      - create
      - delete
  - apiGroups:
      - mcp.kuadrant.io
    resources:
      - mcpserverregistrations
    verbs:
      - get
      - list
      - create
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: project-matrix-gateway-installer
  labels:
    ai.redhat.com/managed-by: project-matrix
    ai.redhat.com/layer: gateway
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: project-matrix-gateway-installer
subjects:
  - kind: ServiceAccount
    name: odh-dashboard-model-registry
    namespace: redhat-ods-applications
