apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: model-registry-allow-ports
spec:
  podSelector:
    matchLabels:
      deployment: model-registry-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8043
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
        - podSelector:
            matchLabels:
              deployment: eval-hub-ui
        - podSelector:
            matchLabels:
              deployment: mlflow-ui
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    # Inter-BFF communication with the MLflow BFF (see docs/inter-bff-communication.md),
    # used to resolve MCP Registry server details for the deployments table.
    - to:
        - podSelector:
            matchLabels:
              deployment: mlflow-ui
      ports:
        - port: 8343
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
