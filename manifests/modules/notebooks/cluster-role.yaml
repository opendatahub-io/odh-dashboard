kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: odh-dashboard-notebooks
rules:
  - apiGroups:
      - ""
    verbs:
      - get
      - list
      - watch
    resources:
      - namespaces
      - configmaps
      - pods
      - persistentvolumes
  - apiGroups:
      - ""
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    resources:
      - secrets
  - apiGroups:
      - ""
    verbs:
      - get
      - list
      - watch
      - create
      - delete
    resources:
      - persistentvolumeclaims
  - apiGroups:
      - storage.k8s.io
    verbs:
      - get
      - list
      - watch
    resources:
      - storageclasses
  - apiGroups:
      - kubeflow.org
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    resources:
      - workspaces
      - workspacekinds
  - apiGroups:
      - authorization.k8s.io
    verbs:
      - create
    resources:
      - subjectaccessreviews
  - apiGroups:
      - authentication.k8s.io
    verbs:
      - create
    resources:
      - tokenreviews
  # Read the cluster-wide TLS security profile (apiservers.config.openshift.io/cluster)
  # so the notebooks BFF can enforce it on its HTTPS listener and reload on change.
  # Keep get scoped to the singleton: the dashboard-operator applies this role and can
  # only grant what it holds (config/rbac/role.yaml), so an unscoped get is rejected as
  # privilege escalation. Unlike the polling BFFs, the notebooks backend watches the
  # profile through an informer, which needs list/watch; those must omit resourceNames.
  - apiGroups:
      - config.openshift.io
    resources:
      - apiservers
    resourceNames:
      - cluster
    verbs:
      - get
  - apiGroups:
      - config.openshift.io
    resources:
      - apiservers
    verbs:
      - list
      - watch
