kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: odh-dashboard-notebooks
rules:
  - apiGroups:
      - ""
    verbs:
      - get
      - list
      - watch
    resources:
      - namespaces
      - configmaps
      - pods
      - persistentvolumes
  - apiGroups:
      - ""
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    resources:
      - secrets
  - apiGroups:
      - ""
    verbs:
      - get
      - list
      - watch
      - create
      - delete
    resources:
      - persistentvolumeclaims
  - apiGroups:
      - storage.k8s.io
    verbs:
      - get
      - list
      - watch
    resources:
      - storageclasses
  - apiGroups:
      - kubeflow.org
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
    resources:
      - workspaces
      - workspacekinds
  - apiGroups:
      - authorization.k8s.io
    verbs:
      - create
    resources:
      - subjectaccessreviews
  - apiGroups:
      - authentication.k8s.io
    verbs:
      - create
    resources:
      - tokenreviews
  # Read the cluster-wide TLS security profile (apiservers.config.openshift.io/cluster)
  # so the notebooks BFF can enforce it on its HTTPS listener and reload on change.
  # list/watch must omit resourceNames to be granted; apiservers is a cluster singleton.
  - apiGroups:
      - config.openshift.io
    verbs:
      - get
      - list
      - watch
    resources:
      - apiservers
