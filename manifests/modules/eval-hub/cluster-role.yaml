kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: odh-dashboard-eval-hub
rules:
  - apiGroups:
      - config.openshift.io
    resources:
      - apiservers
    resourceNames:
      - cluster
    verbs:
      - get
  - apiGroups:
      - authorization.k8s.io
    verbs:
      - create
    resources:
      - subjectaccessreviews
  # The BFF reads no Kueue resources. Queue and HardwareProfile discovery is
  # served by the EvalHub service info API (user token) and by HardwareProfile
  # reads in the dashboard namespace, which are already granted to all
  # authenticated users by manifests/base/rbac/all-users/fetch-hardwares.rbac.yaml.
