kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: odh-dashboard-autorag
rules:
  - apiGroups:
      - config.openshift.io
    resources:
      - apiservers
    resourceNames:
      - cluster
    verbs:
      - get
  - apiGroups:
      - authorization.k8s.io
    verbs:
      - create
    resources:
      - subjectaccessreviews
  # The router CA Secret is granted by the module's namespaced Secret Role,
  # so this ClusterRole intentionally contains no Secret access.
  - apiGroups:
      - ""
    verbs:
      - get
      - update
    resources:
      - configmaps
    resourceNames:
      - autorag-router-ca-bundle
