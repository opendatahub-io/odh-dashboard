apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autorag-allow-ports
spec:
  podSelector:
    matchLabels:
      deployment: autorag-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8743
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
  # autorag needs DNS, K8s API, namespace-scoped DSPA (8443) + OGX (8321) + MinIO (9000),
  # and external HTTP(S) for S3-compatible storage endpoints.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 8443
          protocol: TCP
        - port: 8321
          protocol: TCP
        - port: 9000
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
