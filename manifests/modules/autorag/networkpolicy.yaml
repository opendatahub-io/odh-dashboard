# Operand NetworkPolicy for the AutoRAG BFF/UI. Least-privilege ingress/egress per
# HPSTRAT-104 / operand contract RHOAIENG-90747 (R3-R5).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: autorag-allow-ports
spec:
  podSelector:
    matchLabels:
      deployment: autorag-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8743
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
  # autorag needs DNS, K8s API, namespace-scoped DSPA (8443) + MinIO (9000),
  # and external HTTP(S) for S3-compatible storage endpoints.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    # Kubernetes API server. NetworkPolicy cannot select the API server endpoints
    # (host-networked, dynamic IP/port); documented R5 limitation.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
          protocol: TCP
    # Cross-namespace to user-project workloads: DSPA (8443) + OGX (8321) + MinIO (9000).
    # The target namespace is user-selected at runtime, so it is port-scoped rather than
    # allow-all; documented R5 limitation.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 8443
          protocol: TCP
        - port: 9000
          protocol: TCP
    # External / off-cluster HTTP(S) to user-configurable, hostname-based endpoints
    # (S3-compatible storage) that cannot be expressed as NetworkPolicy peers; documented R5 limitation.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
