apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odh-dashboard-autorag-secrets
rules:
  - apiGroups:
      - ""
    verbs:
      - get
    resources:
      - secrets
    resourceNames:
      - router-ca
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odh-dashboard-autorag-secrets
subjects:
  - kind: ServiceAccount
    name: odh-dashboard-autorag
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odh-dashboard-autorag-secrets
