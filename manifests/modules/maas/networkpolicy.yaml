# Operand NetworkPolicy for the MaaS BFF/UI. Least-privilege ingress/egress per
# HPSTRAT-104 / operand contract RHOAIENG-90747 (R3-R5).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: maas-allow-ports
spec:
  podSelector:
    matchLabels:
      deployment: maas-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8243
          protocol: TCP
      from:
        # Core-bff front-door proxy runs in the main dashboard pod (ODH: odh-dashboard,
        # RHOAI: rhods-dashboard) and proxies /<module>/api/* to this BFF pod-to-pod.
        # See docs/inter-bff-communication.md. matchExpressions covers both variants in
        # one rule (module netpols don't receive the base rename patch).
        - podSelector:
            matchExpressions:
              - key: deployment
                operator: In
                values:
                  - odh-dashboard
                  - rhods-dashboard
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
        - podSelector:
            matchLabels:
              deployment: gen-ai-ui
        - podSelector:
            matchLabels:
              deployment: maas-consumer-portal
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    # Kubernetes API server. NetworkPolicy cannot select the API server endpoints
    # (host-networked, dynamic IP/port); documented R5 limitation.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
          protocol: TCP
    # Internal maas-api Service (odh-ai-gateway-infra / redhat-ai-gateway-infra) for
    # /v1/tenants gateway discovery before passthrough uses the external URL on 443.
    # Cross-namespace to a gateway-infra namespace whose name varies by variant, so it
    # is port-scoped (8443) rather than allow-all; documented R5 limitation.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 8443
          protocol: TCP
    # External / off-cluster HTTP(S) to user-configurable, hostname-based endpoints
    # that cannot be expressed as NetworkPolicy peers; documented R5 limitation.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
