apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service-account.yaml
  - cluster-role.yaml
  - cluster-role-binding.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
  - httproute.yaml
configMapGenerator:
  - name: gen-ai-params
    env: params.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: gen-ai-params
      fieldPath: data.gen-ai-ui-image
    targets:
      - select:
          kind: Deployment
          name: gen-ai-ui
        fieldPaths:
          - spec.template.spec.containers.[name=gen-ai-ui].image
  - source:
      kind: ConfigMap
      name: gen-ai-params
      fieldPath: data.pgvector-image
    targets:
      - select:
          kind: Deployment
          name: gen-ai-ui
        fieldPaths:
          - spec.template.spec.containers.[name=gen-ai-ui].env.[name=RELATED_IMAGE_POSTGRESQL_16_IMAGE].value
  - source:
      kind: ConfigMap
      name: gen-ai-params
      fieldPath: data.gateway-domain
    targets:
      - select:
          kind: Deployment
          name: gen-ai-ui
        fieldPaths:
          - spec.template.spec.containers.[name=gen-ai-ui].env.[name=GATEWAY_DOMAIN].value
  - source:
      kind: ConfigMap
      name: gen-ai-params
      fieldPath: data.gateway-name
    targets:
      - select:
          kind: HTTPRoute
          name: odh-dashboard-gen-ai-proxy
        fieldPaths:
          - spec.parentRefs.0.name
