apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: odh-dashboard-gen-ai-secrets
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - router-ca
    verbs:
      - get
  - apiGroups:
      - ""
    verbs:
      - create
    resources:
      - secrets
  - apiGroups:
      - ""
    verbs:
      - get
      - update
      - delete
    resources:
      - secrets
    resourceNames:
      - genai-pgvector-credentials
      - genai-pgvector-init
      - genai-pgvector-storage
      - genai-pgvector
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: odh-dashboard-gen-ai-secrets
subjects:
  - kind: ServiceAccount
    name: odh-dashboard-gen-ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: odh-dashboard-gen-ai-secrets
