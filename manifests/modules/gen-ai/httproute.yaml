apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: odh-dashboard-gen-ai-proxy
spec:
  parentRefs:
    - name: gateway-name
      kind: Gateway
      namespace: openshift-ingress
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/api/v1/genai-proxy"
      backendRefs:
        - name: odh-dashboard-gen-ai-ui
          port: 8143
