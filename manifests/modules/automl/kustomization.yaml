apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - service-account.yaml
  - cluster-role.yaml
  - cluster-role-binding.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: automl-params
    env: params.env
generatorOptions:
  disableNameSuffixHash: true
replacements:
  - source:
      kind: ConfigMap
      name: automl-params
      fieldPath: data.automl-ui-image
    targets:
      - select:
          kind: Deployment
          name: automl-ui
        fieldPaths:
          - spec.template.spec.containers.[name=automl-ui].image
  - source:
      kind: ConfigMap
      name: automl-params
      fieldPath: data.automl-pipeline-runtime-image
    targets:
      - select:
          kind: Deployment
          name: automl-ui
        fieldPaths:
          - spec.template.spec.containers.[name=automl-ui].env.[name=RELATED_IMAGE_ODH_AUTOML_IMAGE].value
