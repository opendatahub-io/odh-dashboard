# Operand NetworkPolicy for the AutoML BFF/UI. Least-privilege ingress/egress per
# HPSTRAT-104 / operand contract RHOAIENG-90747 (R3-R5).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: automl-allow-ports
spec:
  podSelector:
    matchLabels:
      deployment: automl-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8643
          protocol: TCP
      from:
        # Core-bff front-door proxy runs in the main dashboard pod (ODH: odh-dashboard,
        # RHOAI: rhods-dashboard) and proxies /<module>/api/* to this BFF pod-to-pod.
        # See docs/inter-bff-communication.md. matchExpressions covers both variants in
        # one rule (module netpols don't receive the base rename patch).
        - podSelector:
            matchExpressions:
              - key: deployment
                operator: In
                values:
                  - odh-dashboard
                  - rhods-dashboard
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
  # AutoML needs DNS, K8s API, broad in-cluster egress for user-provided DSPA and
  # S3-compatible services on arbitrary ports, and external HTTP(S) for S3-compatible storage.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    # Kubernetes API server. NetworkPolicy cannot select the API server endpoints
    # (host-networked, dynamic IP/port); documented R5 limitation.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
          protocol: TCP
    # User-provided in-cluster DSPA and S3-compatible services may expose arbitrary ports in
    # any namespace. Keep this documented reduced-posture exception (RHAI-17051) unscoped by
    # port so supported endpoints remain reachable.
    - to:
        - namespaceSelector: {}
    # External / off-cluster HTTP(S) to user-configurable, hostname-based endpoints
    # (S3-compatible storage) that cannot be expressed as NetworkPolicy peers; documented R5 limitation.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
