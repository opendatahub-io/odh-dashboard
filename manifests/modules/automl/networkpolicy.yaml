apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: automl-allow-ports
spec:
  podSelector:
    matchLabels:
      deployment: automl-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8643
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
  # automl is an API-only BFF — it only needs DNS, K8s API, and
  # namespace-scoped DSPA (8443). No external HTTP(S) required.
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
          protocol: TCP
    - to:
        - namespaceSelector: {}
      ports:
        - port: 8443
          protocol: TCP
