# Operand NetworkPolicy for the Data Registry BFF/UI. Least-privilege ingress/egress per
# HPSTRAT-104 / operand contract RHOAIENG-90747 (R3-R5).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-registry-allow-ports
spec:
  podSelector:
    matchLabels:
      deployment: data-registry-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 9143
          protocol: TCP
      from:
        # Core-bff front-door proxy runs in the main dashboard pod (ODH: odh-dashboard,
        # RHOAI: rhods-dashboard) and proxies /<module>/api/* to this BFF pod-to-pod.
        # See docs/inter-bff-communication.md. matchExpressions covers both variants in
        # one rule (module netpols don't receive the base rename patch).
        - podSelector:
            matchExpressions:
              - key: deployment
                operator: In
                values:
                  - odh-dashboard
                  - rhods-dashboard
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
        # Workbench pods call the BFF directly from RHOAI project namespaces.
        # The namespace and pod selectors are ANDed, so only workbench pods in
        # dashboard-managed project namespaces are admitted.
        - namespaceSelector:
            matchLabels:
              opendatahub.io/dashboard: "true"
          podSelector:
            matchLabels:
              opendatahub.io/workbenches: "true"
  egress:
    # The Data Registry Service exposes HTTPS on 443 and forwards to the
    # kube-rbac-proxy sidecar on pod port 8443.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rhoai-data-registry
          podSelector:
            matchLabels:
              feast.dev/name: data-registry
              feast.dev/service-type: data-registry
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 8443
    - to:
        - podSelector:
            matchLabels:
              deployment: data-connect-hub-ui
      ports:
        - port: 9243
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    # Kubernetes API server. NetworkPolicy cannot select the API server endpoints
    # (host-networked, dynamic IP/port); documented R5 limitation.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
          protocol: TCP
    # External / off-cluster HTTP(S) to user-configurable, hostname-based endpoints
    # that cannot be expressed as NetworkPolicy peers; documented R5 limitation.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
