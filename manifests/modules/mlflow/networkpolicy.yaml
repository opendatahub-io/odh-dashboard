# Operand NetworkPolicy for the MLflow BFF/UI. Least-privilege ingress/egress per
# HPSTRAT-104 / operand contract RHOAIENG-90747 (R3-R5).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mlflow-allow-ports
spec:
  podSelector:
    matchLabels:
      deployment: mlflow-ui
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 8343
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              network.openshift.io/policy-group: ingress
        - podSelector:
            matchLabels:
              deployment: gen-ai-ui
        # Inter-BFF communication from the model-registry BFF (see docs/inter-bff-communication.md),
        # used to resolve MCP Registry server details for the deployments table. No namespaceSelector
        # needed: both BFFs run in the same ODH namespace, so this is intentionally same-namespace-only.
        - podSelector:
            matchLabels:
              deployment: model-registry-ui
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - port: 5353
          protocol: UDP
        - port: 5353
          protocol: TCP
    # Kubernetes API server. NetworkPolicy cannot select the API server endpoints
    # (host-networked, dynamic IP/port); documented R5 limitation.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 6443
          protocol: TCP
    # Model catalog served by the model-registry BFF (same namespace).
    - to:
        - podSelector:
            matchLabels:
              deployment: model-registry-ui
      ports:
        - port: 8043
          protocol: TCP
    # Upstream MLflow tracking server pods (same namespace).
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: mlflow
      ports:
        - port: 8443
          protocol: TCP
    # External / off-cluster HTTP(S) to user-configurable, hostname-based endpoints
    # that cannot be expressed as NetworkPolicy peers; documented R5 limitation.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 80
          protocol: TCP
