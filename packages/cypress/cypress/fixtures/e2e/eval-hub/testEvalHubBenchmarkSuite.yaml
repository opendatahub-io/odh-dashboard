# Eval Hub E2E — benchmark suite (collection) flow.
# Uses the same cluster infrastructure as testEvalHubSingleBenchmark.yaml (EvalHub CR, MLflow CR, vLLM model).
projectNamePrefix: eval-hub-suite-e2e
evalHubCrName: evalhub
evalHubInstanceResourceYamlPath: resources/eval-hub/evalhub-instance.yaml
mlflowInstanceResourceYamlPath: resources/mlflow/mlflow-instance-minimal.yaml
# vLLM model deployment
modelOciUri: oci://quay.io/redhat-ai-services/modelcar-catalog:llama-3.2-1b-instruct
inferenceServiceName: evalhub-suite-llm
servingRuntimeYamlPath: resources/modelServing/singleModel/vllm_cpu_amd64_runtime.yaml
hardwareProfileResourceYamlPath: resources/hardwareProfile/gen_ai_hardware_profile.yaml
# Benchmark suite config — "Toxicity and Ethical Principles"
collectionId: toxicity-and-ethical-principles
collectionName: Toxicity and Ethical Principles
expectedBenchmarkIds:
  - toxigen
  - truthfulqa_mc1
  - bigbench_hhh_alignment_multiple_choice
inferenceModelName: evalhub-suite-llm
mlflowExperimentName: Cy-Evalhub
additionalBenchmarkParams: |
  {
    "num_examples": 2,
    "limit": 2,
    "tokenizer": "google/flan-t5-small"
  }
