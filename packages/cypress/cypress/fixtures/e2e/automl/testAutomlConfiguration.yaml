projectNamePrefix: cy-e2e-automl-config
dspaSecretName: dashboard-dspa-secret
awsBucket: BUCKET_2
defaultPreset: speed
recommendedBadgeLabel: Recommended
defaultMetricKeys:
  binary: accuracy
  multiclass: accuracy
  regression: r2
  timeseries: MASE
topModels:
  min: 1
singleSeriesTrainingDataFile: automl-timeseries-single-series-test-data.csv
autoGeneratedIdLabel: Auto-generated ID column
columnPlaceholder: Select a column
reconfigure:
  runNameSuffix: ' - 1'
  preset: balanced
  topN: 2
replacementDataset:
  trainingDataFile: automl-timeseries-replacement-test-data.csv
  targetColumn: demand
  timestampColumn: observed_at
  idColumn: item_id
invalidDatasets:
  noDataRows:
    trainingDataFile: automl-header-only-test-data.csv
    errorMessage: 'file must contain at least 100 data rows (excluding header), found 0'
  insufficientRows:
    trainingDataFile: automl-insufficient-rows-test-data.csv
    errorMessage: 'file must contain at least 100 data rows (excluding header), found 99'
predictionLength:
  default: 1
  changed: 5
