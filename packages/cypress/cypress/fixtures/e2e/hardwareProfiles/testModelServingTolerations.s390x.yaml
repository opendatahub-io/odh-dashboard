# testModelServingTolerations.cy.ts Test Data - s390x #
# On s390x the deployed dashboard renders Request/Limit values in the hardware profile
# option description instead of Default/Max (cluster version difference).
# isS390x=true causes the test to:
#   - select the hardware profile by data-testid (stable across cluster versions)
#   - use the IBM Z Triton runtime with a python model instead of OpenVINO
modelServingTolerationsTestNamespace: "hw-model-deployment"
resourceYamlPath: "resources/hardwareProfile/model_tolerations.yaml"
hardwareProfileName: "cypress-hardware-profile-model"
tolerationValue: "PreferNoSchedule"
hardwareProfileDeploymentSize: "cypress-hardware-profile-model Compatible CPU: Default = 2 Cores, Max = 4 Cores; Memory: Default = 4 GiB, Max = 8 GiB"
modelName: "hw-model"
dataConnectionName: "ods-ci-wisdom"
modelFilePath: "triton/model_repository/python"
modelFormat: "python - 1"
servingRuntime: "IBM Z Triton Inference Server"
servingRuntimeName: "ibmz-triton-rest"
servingRuntimeYamlPath: "resources/modelServing/ibmz-triton-rest.yaml"
isS390x: true
