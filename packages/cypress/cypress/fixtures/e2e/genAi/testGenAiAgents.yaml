modelId: 'gemini-2.5-flash'
displayName: 'E2E Agent Deployment Gemini Endpoint'
endpointUrl: 'https://generativelanguage.googleapis.com/v1beta/openai'
testMessage: 'Hello, this is a test message from the deployed agent Responses API.'
lsdServiceName: 'lsd-genai-playground-service'
lsdPodPrefix: 'lsd-genai-playground'
lsdPodReadyTimeout: '120s'
prompt:
  name: 'e2e-agent-deployment-prompt'
  template: 'You are a helpful assistant. Respond concisely to: {{ input }}'
  commitMessage: 'E2E prompt for agent deployment'
agent:
  name: 'e2e-agent-deployment-test'
  description: 'E2E test agent for deployment configuration validation'
mcp:
  configMapName: 'gen-ai-aa-mcp-servers'
  namespace: 'mcp-servers'
  serverKey: 'kubernetes-mcp-server'
  serverName: 'kubernetes-mcp-server'
  image: 'quay.io/containers/kubernetes_mcp_server:v0.0.60'
  serverDescription: 'Kubernetes cluster management (read-only) - list namespaces, pods, events, resources, logs, and more'
