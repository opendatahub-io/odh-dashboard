# Test data for multimodal inferencing E2E tests
# This file contains configuration for testing image/audio uploads and vision model inference

image:
  fileName: 'test-image.png'
  # Base64 encoded 1x1 transparent PNG (smallest valid PNG)
  base64Content: 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M9QDwADhgGAWjR9awAAAABJRU5ErkJggg=='
  mimeType: 'image/png'

audio:
  fileName: 'test-audio.mp3'
  # Placeholder audio content for testing
  sampleContent: 'fake-audio-content-for-testing'
  mimeType: 'audio/mpeg'

validation:
  # Maximum file size in bytes (10MB, matches VISION_UPLOAD_CONFIG.MAX_FILE_SIZE)
  maxFileSizeBytes: 10485760

inference:
  visionTestMessage: 'What do you see in this image?'

model:
  modelId: 'gpt-4o'
  displayName: 'E2E Multimodal Vision Model'
  endpointUrl: 'https://api.openai.com/v1'
  lsdServiceName: 'lsd-genai-playground-service'
  lsdPodPrefix: 'lsd-genai-playground'
  lsdPodReadyTimeout: '120s'
