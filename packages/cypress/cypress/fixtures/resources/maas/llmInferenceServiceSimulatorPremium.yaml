apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: "{{MODEL_NAME}}"
  namespace: "{{PROJECT_NAME}}"
  annotations:
    openshift.io/display-name: "{{MODEL_NAME}}"
    opendatahub.io/model-type: generative
  labels:
    opendatahub.io/dashboard: "true"
spec:
  model:
    # uri is required by the LLMIS schema but not used by llm-d-inference-sim.
    uri: hf://placeholder/no-model
    # Match metadata.name so MaaS completions use the same model id as the LLMIS resource.
    name: "{{MODEL_NAME}}"
  # Skip storage-initializer; simulator generates responses without model weights.
  storageInitializer:
    enabled: false
  replicas: 1
  router:
    route: {}
    # Connect to MaaS-enabled gateway
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: "ghcr.io/llm-d/llm-d-inference-sim:v0.8.2"
        imagePullPolicy: Always
        command: ["/app/llm-d-inference-sim"]
        args:
          - --port
          - "8000"
          - --model
          - "{{MODEL_NAME}}"
          - --mode
          - random
          - --no-mm-encoder-only
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
        env:
          - name: POD_NAME
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.name
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: metadata.namespace
          - name: POD_IP
            valueFrom:
              fieldRef:
                apiVersion: v1
                fieldPath: status.podIP
        ports:
          - name: https
            containerPort: 8000
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
        readinessProbe:
          httpGet:
            path: /ready
            port: https
            scheme: HTTPS
