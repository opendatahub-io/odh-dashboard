apiVersion: serving.kserve.io/v1alpha1
kind: LLMInferenceService
metadata:
  name: '{{MODEL_NAME}}'
  namespace: '{{PROJECT_NAME}}'
  annotations:
    openshift.io/display-name: '{{MODEL_NAME}}'
    opendatahub.io/model-type: generative
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  model:
    # The simulator does not load model weights, but the LLMIS schema requires a URI.
    uri: hf://placeholder/no-model
    name: '{{MODEL_NAME}}'
  storageInitializer:
    enabled: false
  replicas: 1
  router:
    route: {}
    gateway:
      refs:
        - name: maas-default-gateway
          namespace: openshift-ingress
  template:
    containers:
      - name: main
        image: 'ghcr.io/llm-d/llm-d-inference-sim:v0.8.2'
        imagePullPolicy: Always
        command: ['/app/llm-d-inference-sim']
        args:
          - --port
          - '8000'
          - --model
          - '{{MODEL_NAME}}'
          - --mode
          - random
          - --no-mm-encoder-only
          - --ssl-certfile
          - /var/run/kserve/tls/tls.crt
          - --ssl-keyfile
          - /var/run/kserve/tls/tls.key
        ports:
          - name: https
            containerPort: 8000
            protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: https
            scheme: HTTPS
        readinessProbe:
          httpGet:
            path: /ready
            port: https
            scheme: HTTPS
