apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: '{{POLICY_NAME}}'
  namespace: '{{MAAS_NAMESPACE}}'
  annotations:
    openshift.io/display-name: '{{POLICY_NAME}}'
    openshift.io/description: 'Lifecycle-only AutoRAG MaaS simulator policy'
spec:
  modelRefs:
    - name: '{{GENERATION_MODEL_NAME}}'
      namespace: '{{MODEL_NAMESPACE}}'
    - name: '{{EMBEDDING_MODEL_NAME}}'
      namespace: '{{MODEL_NAMESPACE}}'
  subjects:
    users:
      - name: '{{SERVICE_ACCOUNT_IDENTITY}}'
