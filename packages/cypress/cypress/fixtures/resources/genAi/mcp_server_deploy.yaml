apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-mcp-server
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: kubernetes-mcp-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubernetes-mcp-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubernetes-mcp-server
    spec:
      serviceAccountName: kubernetes-mcp-server
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubernetes-mcp-server
          image: {{IMAGE}}
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/kubernetes-mcp-server/config.toml
            - --read-only
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp-server
      volumes:
        - name: config
          configMap:
            name: kubernetes-mcp-server
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-mcp-server
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: kubernetes-mcp-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: kubernetes-mcp-server
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kubernetes-mcp-server
  namespace: {{NAMESPACE}}
  labels:
    app.kubernetes.io/name: kubernetes-mcp-server
spec:
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: kubernetes-mcp-server
    weight: 100
