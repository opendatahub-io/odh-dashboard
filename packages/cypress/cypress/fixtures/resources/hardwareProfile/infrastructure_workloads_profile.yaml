apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: ${hardwareProfileName}
  annotations:
    opendatahub.io/dashboard-feature-visibility: '["workbench"]'
spec:
  displayName: ${hardwareProfileName}
  enabled: true
  identifiers:
    - defaultCount: 1
      displayName: CPU
      identifier: cpu
      maxCount: 2
      minCount: 1
      resourceType: CPU
    - defaultCount: 2Gi
      displayName: Memory
      identifier: memory
      maxCount: 4Gi
      minCount: 1Gi
      resourceType: Memory
