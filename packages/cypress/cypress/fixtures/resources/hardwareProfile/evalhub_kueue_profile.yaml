apiVersion: infrastructure.opendatahub.io/v1
kind: HardwareProfile
metadata:
  name: evalhub-e2e-kueue-profile
spec:
  displayName: evalhub-e2e-kueue-profile
  enabled: true
  identifiers:
    - defaultCount: 2
      displayName: CPU
      identifier: cpu
      maxCount: 8
      minCount: 1
      resourceType: CPU
    - defaultCount: 8Gi
      displayName: Memory
      identifier: memory
      maxCount: 32Gi
      minCount: 2Gi
      resourceType: Memory
  scheduling:
    type: Queue
    kueue:
      localQueueName: ${localQueueName}
