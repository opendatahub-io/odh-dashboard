# EvalHub instance for E2E tests. Applied in a per-test UUID namespace.
# Operator requires spec.database (sqlite or postgresql).
# Some RHOAI CRD builds require spec.database.secret even when type is sqlite; the placeholder Secret
# below satisfies admission; the operator only mounts this Secret for postgresql (see TrustyAI operator).
# Secret name must stay aligned with EVALHUB_E2E_DB_SECRET_NAME in cypress/utils/oc_commands/evalHubInstance.ts.
---
apiVersion: v1
kind: Secret
metadata:
  name: evalhub-e2e-database-credentials
  labels:
    opendatahub.io/dashboard-e2e-evalhub-database: 'true'
stringData:
  placeholder: e2e-sqlite
type: Opaque
---
# Set MLFLOW_TRACKING_URI explicitly: the operator may not inject this if the MLflow CR is created
# after EvalHub starts. Without it, jobs fail with message_code mlflow_required_for_experiment.
apiVersion: trustyai.opendatahub.io/v1alpha1
kind: EvalHub
metadata:
  name: evalhub
spec:
  replicas: 1
  # tenancy: single — the EvalHub service only serves its own namespace (no cross-namespace propagation).
  # Each test run gets a fully isolated EvalHub instance alongside its vLLM model and evaluation jobs
  # in the same UUID namespace. The namespace is deleted after the test, cleaning up all resources
  # automatically without touching any shared cluster state.
  tenancy: single
  database:
    type: sqlite
    secret: evalhub-e2e-database-credentials
  env:
    - name: MLFLOW_TRACKING_URI
      value: 'https://mlflow.redhat-ods-applications.svc.cluster.local:8443/mlflow'
