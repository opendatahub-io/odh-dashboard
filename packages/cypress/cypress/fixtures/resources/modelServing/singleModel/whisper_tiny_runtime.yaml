apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: whisper-tiny-runtime
  annotations:
    opendatahub.io/apiProtocol: REST
    opendatahub.io/runtime-version: v0.18.0
    openshift.io/display-name: Whisper Tiny vLLM CPU Runtime
  labels:
    opendatahub.io/dashboard: 'true'
spec:
  annotations:
    opendatahub.io/kserve-runtime: vllm
    prometheus.io/path: /metrics
    prometheus.io/port: '8080'
  containers:
    - args:
        - --port=8080
        - --model=/mnt/models
        - --served-model-name={{.Name}}
        - --gpu-memory-utilization=0.5
      command:
        - python
        - -m
        - vllm.entrypoints.openai.api_server
      env:
        - name: HF_HOME
          value: /tmp/hf_home
        - name: VLLM_CACHE_ROOT
          value: /tmp/vllm_cache
        - name: VLLM_CPU_KVCACHE_SPACE
          value: '1'
        - name: TRITON_CACHE_DIR
          value: /tmp/triton_cache
      image: registry.redhat.io/rhaii/vllm-cpu-rhel9:3.4.1
      name: kserve-container
      ports:
        - containerPort: 8080
          protocol: TCP
      volumeMounts:
        - mountPath: /dev/shm
          name: shm
  multiModel: false
  supportedModelFormats:
    - autoSelect: true
      name: vLLM
  volumes:
    - emptyDir:
        medium: Memory
        sizeLimit: 1Gi
      name: shm
