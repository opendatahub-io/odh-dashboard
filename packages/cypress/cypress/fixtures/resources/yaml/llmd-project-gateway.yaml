# Namespaced Gateway discoverable for project-scoped llm-d wizard selection.
# gatewayClassName is patched at apply time from openshift-ai-inference on the cluster.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cypress-llmd-multi-gw
spec:
  gatewayClassName: PLACEHOLDER_GATEWAY_CLASS
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
