apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: metrics
  name: workspaces-controller-metrics-service
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: workspaces-controller-metrics-tls
spec:
  ports:
  - name: https
    port: 8443
    protocol: TCP
    targetPort: metrics
  selector:
    app.kubernetes.io/component: controller-manager
