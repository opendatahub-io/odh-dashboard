openapi: 3.0.3
info:
  title: MLflow REST API
  version: 1.0.0
  description: REST API MLflow BFF
  license:
    name: Apache 2.0
    url: "https://www.apache.org/licenses/LICENSE-2.0"
servers:
  - url: "https://localhost:8080"
  - url: "http://localhost:8080"
paths:
  /healthcheck:
    summary: Path targeted for healthcheck purposes.
    description: >-
      The REST endpoint/path used to allow a healthcheck update.
    get:
      tags:
        - K8SOperation
      responses:
        "200":
          $ref: "#/components/responses/HealthCheckResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: healthcheck
      summary: HealthCheck
      description: HealthCheck endpoint.
  /api/v1/namespaces:
    summary: Path used to get available namespaces.
    description: >-
      The REST endpoint/path used to list available namespaces.
    get:
      tags:
        - K8SOperation
      responses:
        "200":
          $ref: "#/components/responses/NamespacesResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getNamespaces
      summary: Get Available Namespaces
      description: Returns available namespaces in the cluster.
  /api/v1/experiments:
    summary: Path used to list MLflow experiments.
    description: >-
      The REST endpoint/path used to list MLflow experiments from the tracking server.
    get:
      tags:
        - MLflowOperation
      parameters:
        - $ref: "#/components/parameters/workspace"
        - name: pageToken
          in: query
          required: false
          schema:
            type: string
          description: Token for paginated results.
        - name: maxResults
          in: query
          required: false
          schema:
            type: integer
            default: 100
            minimum: 1
          description: Maximum number of experiments to return (must be a positive integer).
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: Filter expression (e.g. "name = 'my-experiment'").
      responses:
        "200":
          $ref: "#/components/responses/ExperimentsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: listMLflowExperiments
      summary: List MLflow Experiments
      description: Returns a paginated list of experiments from the MLflow tracking server.
  /api/v1/status:
    summary: Path used to check MLflow availability status.
    description: >-
      Reports whether the BFF has successfully discovered an MLflow CR in the cluster.
    get:
      tags:
        - MLflowOperation
      responses:
        "200":
          $ref: "#/components/responses/StatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getStatus
      summary: Get MLflow status
      description: Returns whether MLflow is configured and available.
  /api/v1/prompts:
    summary: List or register MLflow prompts.
    description: >-
      List all registered prompts from the MLflow Prompt Registry, or register a new prompt.
    get:
      tags:
        - PromptOperation
      parameters:
        - $ref: "#/components/parameters/workspace"
        - name: filter_name
          in: query
          required: false
          schema:
            type: string
            example: pet
          description: Filter prompts by name prefix.
      responses:
        "200":
          $ref: "#/components/responses/PromptsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: listPrompts
      summary: List All Prompts
      description: >-
        Returns all prompts from the user's workspace and any configured global
        namespaces. Each prompt is annotated with a scope object indicating
        whether it is project-scoped or global. Pagination is not yet supported
        on this endpoint, all prompts are returned in a single response.
    post:
      tags:
        - PromptOperation
      parameters:
        - $ref: "#/components/parameters/workspace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MLflowRegisterPromptRequest"
      responses:
        "201":
          $ref: "#/components/responses/PromptVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: registerPrompt
      summary: Register or Update Prompt
      description: >-
        Creates a new prompt or adds a new version to an existing prompt.
        Either messages (for chat prompts) or template (for text prompts) must be provided, but not both.

  /api/v1/prompts/{name}:
    summary: Load or delete a specific prompt.
    description: >-
      Load the full content of a specific prompt version or delete an entire prompt.
    get:
      tags:
        - PromptOperation
      parameters:
        - name: name
          in: path
          description: Prompt name
          required: true
          schema:
            type: string
            example: vet-appointment-dora
        - $ref: "#/components/parameters/workspace"
        - name: version
          in: query
          description: Specific version number to load (defaults to latest)
          required: false
          schema:
            type: integer
            minimum: 1
            example: 1
      responses:
        "200":
          $ref: "#/components/responses/PromptVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: loadPrompt
      summary: Load Prompt
      description: Loads a specific prompt version with full template or message content.
    delete:
      tags:
        - PromptOperation
      parameters:
        - name: name
          in: path
          description: Prompt name to delete
          required: true
          schema:
            type: string
            example: my-prompt
        - $ref: "#/components/parameters/workspace"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: deletePrompt
      summary: Delete Prompt
      description: Deletes an entire prompt and all its versions.

  /api/v1/prompts/{name}/versions:
    summary: List versions of a prompt.
    description: >-
      Lists all versions of a specific prompt with metadata.
    get:
      tags:
        - PromptOperation
      parameters:
        - name: name
          in: path
          description: Prompt name
          required: true
          schema:
            type: string
            example: vet-appointment-dora
        - $ref: "#/components/parameters/workspace"
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: Token for fetching the next page of results.
        - name: max_results
          in: query
          required: false
          schema:
            type: integer
            example: 10
          description: Maximum number of versions to return per page.
      responses:
        "200":
          $ref: "#/components/responses/PromptVersionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: listPromptVersions
      summary: List Prompt Versions
      description: Gets a list of all versions for a specific prompt.

  /api/v1/prompts/{name}/versions/{version}:
    summary: Delete a specific version of a prompt.
    delete:
      tags:
        - PromptOperation
      parameters:
        - name: name
          in: path
          description: Prompt name
          required: true
          schema:
            type: string
            example: my-prompt
        - name: version
          in: path
          description: Version number to delete
          required: true
          schema:
            type: integer
            minimum: 1
            example: 1
        - $ref: "#/components/parameters/workspace"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: deletePromptVersion
      summary: Delete Prompt Version
      description: Deletes a specific version of a prompt.

  /api/v1/mcp-registry/register:
    summary: Register an MCP server (create version + optional metadata and tags).
    post:
      tags:
        - MCPRegistryOperation
      parameters:
        - $ref: "#/components/parameters/workspace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMCPServerRequest"
      responses:
        "201":
          $ref: "#/components/responses/RegisterMCPServerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: registerMCPServer
      summary: Register MCP Server
      description: >-
        Orchestrates MCP Registry registration in one call: creates a server
        version from server_json (and optional tools/status/source), then
        best-effort updates server display_name/icons and sets tags. Version
        creation failures are hard errors; metadata and tag failures are
        reported on the response without failing the overall request.
  /api/v1/mcp-registry/servers:
    summary: Search or register MCP Registry servers.
    description: >-
      Search registered MCP (Model Context Protocol) servers from the MLflow
      MCP Registry, or register a new server entry.
    get:
      tags:
        - MCPRegistryOperation
      parameters:
        - $ref: "#/components/parameters/workspace"
        - name: tag
          in: query
          required: false
          schema:
            type: string
            example: "category=weather"
          description: >-
            Filter servers by a single tag, formatted as "key=value".
        - name: filter
          in: query
          required: false
          schema:
            type: string
          description: Raw MLflow filter expression, ANDed with the tag filter if both are provided.
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: Token for fetching the next page of results.
        - name: max_results
          in: query
          required: false
          schema:
            type: integer
            example: 100
          description: Maximum number of servers to return per page.
      responses:
        "200":
          $ref: "#/components/responses/MCPServersResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: searchMCPServers
      summary: Search MCP Servers
      description: Returns a paginated list of MCP servers, optionally filtered by tag.
    post:
      tags:
        - MCPRegistryOperation
      parameters:
        - $ref: "#/components/parameters/workspace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPCreateServerRequest"
      responses:
        "201":
          $ref: "#/components/responses/MCPServerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: createMCPServer
      summary: Create MCP Server
      description: Registers a new MCP server entry.

  /api/v1/mcp-registry/servers/{name}:
    summary: Get, update, or delete a specific MCP Registry server.
    get:
      tags:
        - MCPRegistryOperation
      parameters:
        - $ref: "#/components/parameters/mcpServerName"
        - $ref: "#/components/parameters/workspace"
      responses:
        "200":
          $ref: "#/components/responses/MCPServerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: getMCPServer
      summary: Get MCP Server
      description: Retrieves a single MCP server by name.
    patch:
      tags:
        - MCPRegistryOperation
      parameters:
        - $ref: "#/components/parameters/mcpServerName"
        - $ref: "#/components/parameters/workspace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMCPServerRequest"
      responses:
        "200":
          $ref: "#/components/responses/MCPServerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: updateMCPServer
      summary: Update MCP Server
      description: >-
        Partially updates an MCP server's metadata. Only the fields present
        in the request body are changed.
    delete:
      tags:
        - MCPRegistryOperation
      parameters:
        - $ref: "#/components/parameters/mcpServerName"
        - $ref: "#/components/parameters/workspace"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: deleteMCPServer
      summary: Delete MCP Server
      description: Deletes an MCP server and all of its versions, tags, aliases, and access endpoints.

  /api/v1/mcp-registry/servers/{name}/tags:
    summary: Set a tag on an MCP Registry server.
    post:
      tags:
        - MCPRegistryOperation
      parameters:
        - $ref: "#/components/parameters/mcpServerName"
        - $ref: "#/components/parameters/workspace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMCPTagRequest"
      responses:
        "200":
          $ref: "#/components/responses/MCPTagResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: setMCPServerTag
      summary: Set MCP Server Tag
      description: Sets (creates or overwrites) a tag on an MCP server.

  /api/v1/mcp-registry/servers/{name}/tags/{key}:
    summary: Delete a tag from an MCP Registry server.
    delete:
      tags:
        - MCPRegistryOperation
      parameters:
        - $ref: "#/components/parameters/mcpServerName"
        - name: key
          in: path
          description: Tag key to delete.
          required: true
          schema:
            type: string
            example: category
        - $ref: "#/components/parameters/workspace"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: deleteMCPServerTag
      summary: Delete MCP Server Tag
      description: Removes a tag from an MCP server.

  /api/v1/mcp-registry/servers/{name}/aliases:
    summary: Set an alias on an MCP Registry server.
    post:
      tags:
        - MCPRegistryOperation
      parameters:
        - $ref: "#/components/parameters/mcpServerName"
        - $ref: "#/components/parameters/workspace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMCPAliasRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: setMCPServerAlias
      summary: Set MCP Server Alias
      description: Points an alias at a specific version of an MCP server.

  /api/v1/mcp-registry/servers/{name}/aliases/{alias}:
    summary: Resolve or delete an alias on an MCP Registry server.
    get:
      tags:
        - MCPRegistryOperation
      parameters:
        - $ref: "#/components/parameters/mcpServerName"
        - name: alias
          in: path
          description: Alias to resolve to a server version.
          required: true
          schema:
            type: string
            example: latest
        - $ref: "#/components/parameters/workspace"
      responses:
        "200":
          $ref: "#/components/responses/MCPServerVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: getMCPServerVersionByAlias
      summary: Get MCP Server Version By Alias
      description: Resolves an alias to the MCP server version it currently points at.
    delete:
      tags:
        - MCPRegistryOperation
      parameters:
        - $ref: "#/components/parameters/mcpServerName"
        - name: alias
          in: path
          description: Alias to delete.
          required: true
          schema:
            type: string
            example: latest
        - $ref: "#/components/parameters/workspace"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: deleteMCPServerAlias
      summary: Delete MCP Server Alias
      description: Removes an alias from an MCP server.

  /api/v1/mcp-registry/servers/{name}/versions:
    summary: List or create versions of an MCP Registry server.
    get:
      tags:
        - MCPRegistryOperation
      parameters:
        - $ref: "#/components/parameters/mcpServerName"
        - $ref: "#/components/parameters/workspace"
        - name: page_token
          in: query
          required: false
          schema:
            type: string
          description: Token for fetching the next page of results.
        - name: max_results
          in: query
          required: false
          schema:
            type: integer
            example: 100
          description: Maximum number of versions to return per page.
      responses:
        "200":
          $ref: "#/components/responses/MCPServerVersionsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: listMCPServerVersions
      summary: List MCP Server Versions
      description: Returns a paginated list of versions for a named MCP server.
    post:
      tags:
        - MCPRegistryOperation
      parameters:
        - $ref: "#/components/parameters/mcpServerName"
        - $ref: "#/components/parameters/workspace"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MCPCreateServerVersionRequest"
      responses:
        "201":
          $ref: "#/components/responses/MCPServerVersionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: createMCPServerVersion
      summary: Create MCP Server Version
      description: >-
        Creates a new version of an MCP server from its server.json manifest,
        which describes how to run the server (packages, remotes, etc.).

  /api/v1/mcp-registry/servers/{name}/versions/{version}:
