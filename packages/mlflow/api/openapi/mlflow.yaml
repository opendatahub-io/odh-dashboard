  /api/v1/mcp-catalog/servers/{id}/tools:
    summary: List tools for an MCP catalog server.
    description: >-
      Proxies to the model-registry catalog BFF to list tools exposed by an MCP
      catalog server. Used by the register flow so the mlflow frontend does not
      call the model-registry BFF directly.
    get:
      tags:
        - MCPCatalogProxy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: MCP catalog server ID.
        - name: namespace
          in: query
          required: true
          schema:
            type: string
          description: Catalog namespace that owns the MCP server.
        - name: filterQuery
          in: query
          required: false
          schema:
            type: string
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
        - name: orderBy
          in: query
          required: false
          schema:
            type: string
        - name: sortOrder
          in: query
          required: false
          schema:
            type: string
        - name: nextPageToken
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Paginated list of MCP catalog tools.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/McpToolList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: getMcpServerTools
      summary: List MCP catalog server tools
      description: Returns tools for an MCP catalog server via model-registry inter-BFF proxy.

  /api/v1/mcp-catalog/servers/{id}/mcpserver:
    summary: Convert an MCP catalog server to an MCPServer CR.
    description: >-
      Proxies to the model-registry BFF converter endpoint
      (GET /mcp_catalog/mcp_servers/:id/mcpserver). Used by the register flow
      so the mlflow frontend does not call the model-registry BFF directly.
    get:
      tags:
        - MCPCatalogProxy
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: MCP catalog server ID.
        - name: namespace
          in: query
          required: true
          schema:
            type: string
          description: Catalog namespace that owns the MCP server.
      responses:
        "200":
          description: Converted MCPServer custom resource.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: "#/components/schemas/McpServerCR"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
        "502":
          $ref: "#/components/responses/BadGateway"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
      operationId: getMcpServerConverter
      summary: Convert MCP catalog server to MCPServer CR
      description: Returns an MCPServer CR via model-registry inter-BFF proxy.

  /api/v1/user:
    summary: Path used to Retrieve a user based on the header.
    description: >-
      The REST endpoint/path used pass all the config information needed for the UI.
    get:
      tags:
        - K8SOperation
      responses:
        "200":
          $ref: "#/components/responses/ConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
      operationId: getConfig
      summary: Get configuration info
      description: Gets the configuration information needed for the UI [TBD]
components:
  schemas:
    HealthCheck:
      required:
        - status
        - system_info
      type: object
      properties:
        status:
          type: string
          example: healthy
        system_info:
          type: object
          required:
            - version
          properties:
            version:
              type: string
              example: 1.0.0
    Namespace:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: default
        displayName:
          type: string
          example: default
    Config:
      required:
        - userId
        - clusterAdmin
      type: object
      properties:
        userId:
          type: string
          example: user@example.com
        clusterAdmin:
          type: boolean
          example: true
    MLflowExperiment:
      description: An MLflow experiment.
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: Unique experiment identifier.
          example: "1"
        name:
          type: string
          description: Human-readable experiment name.
          example: my-training-experiment
        artifactLocation:
          type: string
          description: Location where artifacts for the experiment are stored.
          example: s3://my-bucket/experiments/1
        lifecycleStage:
          type: string
          description: Current lifecycle stage of the experiment (active or deleted).
          example: active
        tags:
          type: object
          additionalProperties:
            type: string
          description: Key-value tags associated with the experiment.
          example:
            team: ml-platform
        creationTime:
          type: string
          format: date-time
          description: Timestamp when the experiment was created.
        lastUpdateTime:
          type: string
          format: date-time
          description: Timestamp of the last update to the experiment.
    MLflowExperimentsResponse:
      description: Paginated list of MLflow experiments.
      type: object
      required:
        - experiments
      properties:
        experiments:
          type: array
          items:
            $ref: "#/components/schemas/MLflowExperiment"
        nextPageToken:
          type: string
          description: Token for retrieving the next page of results.
    PromptScopeType:
      description: Classifies a prompt's scope within the platform.
      type: string
      enum:
        - project
        - global
      example: project
    PromptScope:
      description: Identifies where a prompt lives and how it is scoped.
      type: object
      required:
        - type
        - namespace
      properties:
        type:
          $ref: "#/components/schemas/PromptScopeType"
        namespace:
          type: string
          description: The Kubernetes namespace where the prompt resides.
          example: my-project
    MLflowPrompt:
      description: A prompt from the MLflow Prompt Registry.
      type: object
      required:
        - name
        - latest_version
        - creation_timestamp
        - scope
      properties:
        name:
          type: string
          description: Unique name identifying the prompt.
          example: vet-appointment-dora
        description:
          type: string
          description: Human-readable description of the prompt.
          example: Schedule a veterinary appointment for Dora
        latest_version:
          type: integer
          description: Latest version number of the prompt.
          example: 2
        tags:
          type: object
          additionalProperties:
            type: string
          description: User-defined metadata tags.
          example:
            pet: dora
            category: health
        creation_timestamp:
          type: string
          format: date-time
          description: When the prompt was first created.
        scope:
          $ref: "#/components/schemas/PromptScope"
    MLflowPromptsResponse:
      description: List of MLflow prompts from project and global namespaces.
      type: object
      required:
        - prompts
      properties:
        prompts:
          type: array
          items:
            $ref: "#/components/schemas/MLflowPrompt"
        failed_namespaces:
          type: array
          items:
            type: string
          description: Global namespace names that could not be queried (e.g., RBAC denied, timeout). Empty when all sources succeeded.
    MLflowMessage:
      description: A single message in a chat prompt.
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          description: "Message role (system, user, assistant)."
          example: user
        content:
          type: string
          description: "Message content, may contain {{variable}} placeholders."
          example: "Hello {{name}}"
    MLflowRegisterPromptRequest:
      description: Request body for creating or updating a prompt.
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: "Prompt name (creates new or adds version to existing)."
          example: my-prompt
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MLflowMessage"
          description: "Chat messages (for chat prompts, mutually exclusive with template)."
        template:
          type: string
          description: "Text template (for text prompts, mutually exclusive with messages)."
          example: "Hello {{name}}, welcome to {{place}}!"
        commit_message:
          type: string
          description: Version commit message.
          example: initial version
        tags:
          type: object
          additionalProperties:
            type: string
          description: Metadata tags.
        create_only:
          type: boolean
          description: "If true, fails with 409 if a prompt with this name already exists."
    MLflowPromptVersion:
      description: A full prompt version with content.
      type: object
      required:
        - name
        - version
        - created_at
        - updated_at
      properties:
        name:
          type: string
          description: Prompt name.
          example: vet-appointment-dora
        version:
          type: integer
          description: Version number.
          example: 2
        template:
          type: string
          description: Text template content (for text prompts).
        messages:
          type: array
          items:
            $ref: "#/components/schemas/MLflowMessage"
          description: Chat messages (for chat prompts).
        commit_message:
          type: string
          description: Version commit message.
        aliases:
          type: array
          items:
            type: string
          description: Aliases pointing to this version.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Metadata tags.
        created_at:
          type: string
          format: date-time
          description: When this version was created.
        updated_at:
          type: string
          format: date-time
          description: When this version was last updated.
    MLflowPromptVersionMeta:
      description: Version metadata without full content.
      type: object
      required:
        - version
        - created_at
        - updated_at
      properties:
        version:
          type: integer
          description: Version number.
          example: 1
        commit_message:
          type: string
          description: Version commit message.
        aliases:
          type: array
          items:
            type: string
          description: Aliases pointing to this version.
        tags:
          type: object
          additionalProperties:
            type: string
          description: Metadata tags.
        created_at:
          type: string
          format: date-time
          description: When this version was created.
        updated_at:
          type: string
          format: date-time
          description: When this version was last updated.
    MLflowPromptVersionsResponse:
      description: Paginated list of prompt versions.
      type: object
      required:
        - versions
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/MLflowPromptVersionMeta"
        next_page_token:
          type: string
          description: Token for fetching the next page of results.
    MCPServerJSON:
      description: >-
        MCP server.json document. name and version are required by the BFF when
        creating or registering a version; additionalProperties preserves open
        manifest fields (packages, remotes, title, etc.).
      type: object
      required:
        - name
        - version
      properties:
        name:
          type: string
          description: Server identity; must match the registry server name.
          example: io.github.example/weather-server
        version:
          type: string
          description: Version string from the server.json manifest.
          example: "1.0.0"
        description:
          type: string
        _meta:
          type: object
          additionalProperties: true
          description: Extension metadata bag (reverse-DNS keys).
      additionalProperties: true
    MCPTool:
      description: A single tool exposed by an MCP server version.
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: get_forecast
        title:
          type: string
          example: Get Forecast
        description:
          type: string
          example: Returns the weather forecast for a given location.
        input_schema:
          type: object
          description: JSON Schema describing the tool's input.
        output_schema:
          type: object
          description: JSON Schema describing the tool's output.
        annotations:
          type: object
          description: Free-form tool annotations.
        icons:
          type: array
          items:
            type: object
        execution:
          type: object
          description: Free-form execution metadata (e.g. timeout hints).
    MCPConnectOptionSettings:
      description: Settings controlling how a connection mode is presented to clients.
      type: object
      required:
        - hidden
      properties:
        hidden:
          type: boolean
          example: false
    MCPAccessEndpointSummary:
      description: Lightweight view of an access endpoint, embedded within an MCPServer.
      type: object
      required:
        - id
        - server_name
        - endpoint_url
        - transport_type
        - creation_timestamp
        - last_updated_timestamp
      properties:
        id:
          type: string
          example: static-endpoint-1
        server_name:
          type: string
          example: io.github.example/weather-server
        endpoint_url:
          type: string
          example: https://mcp.example.com/weather-server
        transport_type:
          type: string
          enum:
            - streamable-http
            - sse
          example: streamable-http
        workspace:
          type: string
        server_version:
          type: string
        server_alias:
          type: string
        resolved_version:
          allOf:
            - $ref: "#/components/schemas/MCPServerVersion"
          description: >-
            The version currently resolved by server_version/server_alias,
            if the MLflow server included it in the response.
        created_by:
          type: string
        last_updated_by:
          type: string
        creation_timestamp:
          type: string
          format: date-time
        last_updated_timestamp:
          type: string
          format: date-time
    McpToolList:
      type: object
      description: Paginated list of MCP catalog tools (proxied from model-registry).
      properties:
        nextPageToken:
          type: string
        pageSize:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        items:
          type: array
          items:
            type: object
            properties:
              serverId:
                type: string
              tool:
                $ref: "#/components/schemas/MCPCatalogTool"
    MCPCatalogTool:
      type: object
      description: MCP catalog tool shape used when registering from the catalog.
      required:
        - name
        - accessType
      properties:
        name:
          type: string
        description:
          type: string
        accessType:
          type: string
          enum:
            - read_only
            - read_write
            - execute
        revoked:
          type: boolean
        revokedReason:
          type: string
        parameters:
          type: array
          items:
            type: object
            required:
              - name
              - type
              - required
            properties:
              name:
                type: string
              type:
                type: string
              description:
                type: string
              required:
                type: boolean
    McpServerCR:
      type: object
      description: >-
        MCPServer custom resource returned by the model-registry converter
        (deploy prefill). Full CR tree is opaque/pass-through; required fields
        used by deploy UI are documented here.
      required:
        - apiVersion
        - kind
        - metadata
        - spec
      properties:
        apiVersion:
          type: string
          example: mcp.x-k8s.io/v1alpha1
        kind:
          type: string
          example: MCPServer
        metadata:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            namespace:
              type: string
            annotations:
              type: object
              additionalProperties:
                type: string
          additionalProperties: true
        spec:
          type: object
          required:
            - source
            - config
          properties:
            source:
              type: object
              properties:
                type:
                  type: string
                containerImage:
                  type: object
                  properties:
                    ref:
                      type: string
              additionalProperties: true
            config:
              type: object
              properties:
                port:
                  type: integer
                path:
                  type: string
              additionalProperties: true
            runtime:
              type: object
              additionalProperties: true
          additionalProperties: true
      additionalProperties: true
    MCPServer:
      description: An MLflow MCP Registry server entry.
      type: object
      required:
        - name
        - creation_timestamp
        - last_updated_timestamp
      properties:
        name:
          type: string
          description: Unique server identifier (e.g. reverse-DNS style name).
          example: io.github.example/weather-server
        display_name:
          type: string
          example: Weather Server
        description:
          type: string
          example: Provides current weather and forecast tools.
        icons:
          type: array
          items:
            type: object
        status:
          type: string
          example: active
        workspace:
          type: string
        access_endpoints:
          type: array
          items:
            $ref: "#/components/schemas/MCPAccessEndpointSummary"
        latest_version:
          type: string
          example: "1.0.0"
        aliases:
          type: object
          additionalProperties:
            type: string
        tags:
          type: object
          additionalProperties:
            type: string
          example:
            category: weather
        created_by:
          type: string
        last_updated_by:
          type: string
        creation_timestamp:
          type: string
          format: date-time
        last_updated_timestamp:
          type: string
          format: date-time
    MCPServersResponse:
      description: Paginated list of MCP Registry servers.
      type: object
      required:
        - servers
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/MCPServer"
        next_page_token:
          type: string
          description: Token for retrieving the next page of results.
    MCPCreateServerRequest:
      description: >-
        Request body for registering a new MCP server. Does not include the
        server.json manifest — that is supplied when creating a server
        version (see MCPCreateServerVersionRequest).
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: io.github.example/weather-server
        description:
          type: string
          example: Provides current weather and forecast tools.
        icons:
          type: array
          items:
            type: object
    MCPServerVersion:
      description: A specific version of an MCP server.
      type: object
      required:
        - name
        - version
        - server_json
        - creation_timestamp
        - last_updated_timestamp
      properties:
        name:
          type: string
          example: io.github.example/weather-server
        version:
          type: string
          example: "1.0.0"
        server_json:
          $ref: "#/components/schemas/MCPServerJSON"
        status:
          type: string
          enum:
            - draft
            - active
            - deprecated
            - deleted
          example: active
        workspace:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/MCPTool"
        aliases:
          type: array
          items:
            type: string
        tags:
          type: object
          additionalProperties:
            type: string
        connect_options:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MCPConnectOptionSettings"
        source:
          type: string
        created_by:
          type: string
        last_updated_by:
          type: string
        creation_timestamp:
          type: string
          format: date-time
        last_updated_timestamp:
          type: string
          format: date-time
    MCPServerVersionsResponse:
      description: Paginated list of MCP server versions.
      type: object
      required:
        - versions
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/MCPServerVersion"
        next_page_token:
          type: string
          description: Token for retrieving the next page of results.
    MCPCreateServerVersionRequest:
      description: >-
        Request body for creating a new MCP server version. server_json is
        the raw MCP server.json manifest and is required.
      type: object
      required:
        - server_json
      properties:
        server_json:
          $ref: "#/components/schemas/MCPServerJSON"
        status:
          type: string
          enum:
            - draft
            - active
            - deprecated
            - deleted
        source:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/MCPTool"
        connect_options:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MCPConnectOptionSettings"
    RegisterMCPServerRequest:
      description: >-
        Request body for the composite Register MCP server operation. name must
        match server_json.name. Metadata (display_name/icons) and tags are
        applied best-effort after the version is created.
      type: object
      required:
        - name
        - server_json
      properties:
        name:
          type: string
          description: MCP Registry server name (namespace/slug). Must match server_json.name.
          example: io.github.example/weather-server
        server_json:
          $ref: "#/components/schemas/MCPServerJSON"
        status:
          type: string
          enum:
            - draft
            - active
            - deprecated
            - deleted
        source:
          type: string
        tools:
          type: array
          description: >-
            Catalog-shaped tools from the MCP catalog. The BFF drops revoked
            tools and converts the rest to the MCP Registry tool schema.
          items:
            $ref: "#/components/schemas/MCPCatalogTool"
        display_name:
          type: string
          description: Optional human-readable label stored on the parent MCP server.
        icons:
          type: array
          description: Optional icons stored on the parent MCP server (http or https URLs).
          items:
            type: object
            required:
              - src
            properties:
              src:
                type: string
              theme:
                type: string
                enum:
                  - light
                  - dark
        tags:
          type: array
          description: Optional tags to set on the parent MCP server after registration.
          items:
            $ref: "#/components/schemas/SetMCPTagRequest"
    RegisterMCPServerResult:
      description: >-
        Result of Register MCP server. Always includes the created version when
        the request succeeds (201). Soft-failure fields are set when follow-up
        metadata or tag writes fail.
      type: object
      required:
        - version
      properties:
        version:
          $ref: "#/components/schemas/MCPServerVersion"
        metadata_error:
          type: string
          description: Present when display_name/icons could not be saved after version creation.
        failed_tag_keys:
          type: array
          description: Tag keys that could not be set after version creation.
          items:
            type: string
    MCPAccessEndpoint:
      description: A concrete, reachable URL bound to an MCP server.
      type: object
      required:
        - id
        - server_name
        - endpoint_url
        - transport_type
        - creation_timestamp
        - last_updated_timestamp
      properties:
        id:
          type: string
          example: static-endpoint-1
        server_name:
          type: string
          example: io.github.example/weather-server
        endpoint_url:
          type: string
          example: https://mcp.example.com/weather-server
        transport_type:
          type: string
          enum:
            - streamable-http
            - sse
          example: streamable-http
        workspace:
          type: string
        tools:
          type: array
          items:
            $ref: "#/components/schemas/MCPTool"
        server_version:
          type: string
        server_alias:
          type: string
        resolved_version:
          allOf:
            - $ref: "#/components/schemas/MCPServerVersion"
          description: >-
            The version currently resolved by server_version/server_alias,
            if the MLflow server included it in the response.
        created_by:
          type: string
        last_updated_by:
          type: string
        creation_timestamp:
          type: string
          format: date-time
        last_updated_timestamp:
          type: string
          format: date-time
    MCPAccessEndpointsResponse:
      description: Paginated list of MCP access endpoints.
      type: object
      required:
        - endpoints
      properties:
        endpoints:
          type: array
          items:
            $ref: "#/components/schemas/MCPAccessEndpoint"
        next_page_token:
          type: string
          description: Token for retrieving the next page of results.
    MCPCreateAccessEndpointRequest:
      description: >-
        Request body for creating a new MCP access endpoint. server_version
        and server_alias are mutually exclusive.
      type: object
      required:
        - endpoint_url
      not:
        required:
          - server_version
          - server_alias
      properties:
        endpoint_url:
          type: string
          example: https://mcp.example.com/weather-server
        transport_type:
          type: string
          enum:
            - streamable-http
            - sse
          example: streamable-http
        server_version:
          type: string
          example: "1.0.0"
        server_alias:
          type: string
          example: latest
    UpdateMCPServerRequest:
      description: >-
        Partial-update request body for an MCP server. Only fields present
        in the request are changed; omitted fields are left untouched.
      type: object
      properties:
        display_name:
          type: string
          example: Weather Server
        description:
          type: string
          example: Provides current weather and forecast tools.
        icons:
          type: array
          items:
            type: object
    UpdateMCPServerVersionRequest:
      description: >-
        Partial-update request body for an MCP server version. Only fields
        present in the request are changed; omitted fields are left
        untouched.
      type: object
      properties:
        status:
          type: string
          enum:
            - draft
            - active
            - deprecated
            - deleted
        tools:
          type: array
          items:
            $ref: "#/components/schemas/MCPTool"
        connect_options:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/MCPConnectOptionSettings"
    UpdateMCPAccessEndpointRequest:
      description: >-
        Partial-update request body for an MCP access endpoint. Only fields
        present in the request are changed; omitted fields are left
        untouched. server_version and server_alias remain mutually
        exclusive.
      type: object
      properties:
        endpoint_url:
          type: string
          example: https://mcp.example.com/weather-server
        transport_type:
          type: string
          enum:
            - streamable-http
            - sse
          example: streamable-http
        server_version:
          type: string
          example: "1.0.0"
        server_alias:
          type: string
          example: latest
    SetMCPTagRequest:
      description: Request body for setting a tag on an MCP server or server version.
      type: object
      required:
        - key
      properties:
        key:
          type: string
          example: category
        value:
          type: string
          example: weather
    MCPTag:
      description: A tag key-value pair echoed in responses after setting a tag.
      type: object
      required:
        - key
      properties:
        key:
          type: string
          example: category
        value:
          type: string
          example: weather
    SetMCPAliasRequest:
      description: Request body for pointing an alias at a specific version of an MCP server.
      type: object
      required:
        - alias
        - version
      properties:
        alias:
          type: string
          example: stable
        version:
          type: string
          example: "1.0.0"
    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: bad_request
          description: Application error code (e.g. bad_request, unauthorized, forbidden, not_found, conflict, service_unavailable, mlflow_error).
        message:
          type: string
          example: "Bad request"
          description: Human-readable error message.

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/Error"
    MLflowStatus:
      description: MLflow availability status.
      type: object
      required:
        - configured
      properties:
        configured:
          type: boolean
          description: Whether the BFF has discovered a running MLflow CR in the cluster.
          example: true
    SortOrder:
      description: Supported sort direction for ordering result entities.
      enum:
        - ASC
        - DESC
      type: string
    OrderByField:
      description: Supported fields for ordering result entities.
      enum:
        - CREATE_TIME
        - LAST_UPDATE_TIME
        - Id
      type: string

  responses:
    HealthCheckResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HealthCheck"
      description: Successful health check response.
    NamespacesResponse:
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: "#/components/schemas/Namespace"
            required:
              - data
      description: A response containing a list of available namespaces.
    NotFound:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: The specified resource was not found
    BadRequest:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: Bad Request parameters
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: Unauthorized
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: Unexpected internal server error
    ConfigResponse:
      content:
        application/json:
          schema:
            type: object
            properties:
              metadata:
                type: object
                description: Metadata about the response
              data:
                $ref: "#/components/schemas/Config"
      description: A response containing a list of Config entities.
    ExperimentsResponse:
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/MLflowExperimentsResponse"
            required:
              - data
      description: A response containing a paginated list of MLflow experiments.
    PromptsResponse:
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/MLflowPromptsResponse"
            required:
              - data
      description: A response containing the list of prompts.
    PromptVersionResponse:
      headers:
        Location:
          schema:
            type: string
          description: URI of the created prompt version (present on 201 responses).
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/MLflowPromptVersion"
            required:
              - data
      description: A response containing a single prompt version.
    PromptVersionsResponse:
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/MLflowPromptVersionsResponse"
            required:
              - data
      description: A response containing a paginated list of prompt versions.
    MCPServersResponse:
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/MCPServersResponse"
            required:
              - data
      description: A response containing a paginated list of MCP servers.
    MCPServerResponse:
      headers:
        Location:
          schema:
            type: string
          description: URI of the created/fetched MCP server (present on 201 responses).
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/MCPServer"
            required:
              - data
      description: A response containing a single MCP server.
    MCPServerVersionsResponse:
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/MCPServerVersionsResponse"
            required:
              - data
      description: A response containing a paginated list of MCP server versions.
    MCPServerVersionResponse:
      headers:
        Location:
          schema:
            type: string
          description: URI of the created MCP server version (present on 201 responses).
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/MCPServerVersion"
            required:
              - data
      description: A response containing a single MCP server version.
    MCPTagResponse:
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/MCPTag"
            required:
              - data
      description: A response echoing the tag that was set on an MCP server or server version.
    RegisterMCPServerResponse:
      headers:
        Location:
          schema:
            type: string
          description: URI of the created MCP server version.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/RegisterMCPServerResult"
            required:
              - data
      description: >-
        Composite register response. HTTP 201 means the version was created;
        metadata_error / failed_tag_keys report best-effort follow-up failures.
    MCPAccessEndpointsResponse:
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/MCPAccessEndpointsResponse"
            required:
              - data
      description: A response containing a paginated list of MCP access endpoints.
    MCPAccessEndpointResponse:
      headers:
        Location:
          schema:
            type: string
          description: URI of the created MCP access endpoint (present on 201 responses).
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "#/components/schemas/MCPAccessEndpoint"
            required:
              - data
      description: A response containing a single MCP access endpoint.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: Forbidden - insufficient permissions
    Conflict:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: Conflict - resource already exists
    BadGateway:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: Bad gateway - unexpected error from the MLflow tracking server
    StatusResponse:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MLflowStatus"
      description: MLflow availability status.
    ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
      description: Service unavailable - MLflow server is not configured or reachable
    NoContent:
      description: Operation completed successfully with no response body.

  parameters:
    id:
      name: id
      description: The ID of resource.
      schema:
        type: string
      in: path
      required: true
    name:
      examples:
        name:
          value: entity-name
      name: name
      description: Name of entity to search.
      schema:
        type: string
      in: query
      required: false
    externalId:
      examples:
        externalId:
          value: "10"
      name: externalId
      description: External ID of entity to search.
      schema:
        type: string
      in: query
      required: false
    parentResourceId:
      examples:
        parentResourceId:
          value: "10"
      name: parentResourceId
      description: ID of the parent resource to use for search.
      schema:
        type: string
      in: query
      required: false
    pageSize:
      examples:
        pageSize:
          value: "100"
      name: pageSize
      description: Number of entities in each page.
      schema:
        type: string
      in: query
      required: false
    nextPageToken:
      name: nextPageToken
      description: Token to use to retrieve next page of results.
      schema:
        type: string
      in: query
      required: false
    orderBy:
      style: form
      explode: true
      examples:
        orderBy:
          value: Id
      name: orderBy
      description: Specifies the order by criteria for listing entities.
      schema:
        $ref: "#/components/schemas/OrderByField"
      in: query
      required: false
    sortOrder:
      style: form
      explode: true
      examples:
        sortOrder:
          value: DESC
      name: sortOrder
      description: "Specifies the sort order for listing entities, defaults to ASC."
      schema:
        $ref: "#/components/schemas/SortOrder"
      in: query
      required: false
    namespace:
      name: namespace
      description: The namespace to filter resources by.
      schema:
        type: string
      in: query
      required: false
    workspace:
      name: workspace
      description: The Kubernetes namespace where the MLflow tracking server is deployed (forwarded as X-MLFLOW-WORKSPACE header).
      schema:
        type: string
      in: query
      required: true
    mcpServerName:
      name: name
      description: >-
        MCP server name, in "<namespace>/<slug>" format (exactly one "/",
        each segment starting and ending with an alphanumeric character).
        Namespace may contain dots and hyphens; slug may also contain
        underscores. The slugs "versions", "endpoints", "tags", and
        "aliases" are reserved and will be rejected.
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9][a-zA-Z0-9.\\-]*[a-zA-Z0-9]/[a-zA-Z0-9][a-zA-Z0-9._\\-]*[a-zA-Z0-9]$"
        example: io.github.example/weather-server

  securitySchemes:
    Bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Bearer JWT scheme
security:
  - Bearer: []
tags:
  - name: K8SOperation
    description: Operation performed in Kubernetes
  - name: MLflowOperation
    description: Operations performed against the MLflow tracking server
  - name: PromptOperation
    description: Operations on the MLflow Prompt Registry
  - name: MCPRegistryOperation
    description: Operations on the MLflow MCP (Model Context Protocol) Server Registry
  - name: MCPCatalogProxy
    description: Inter-BFF proxies to model-registry MCP catalog APIs
