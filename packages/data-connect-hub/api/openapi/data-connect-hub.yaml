openapi: 3.0.3
info:
  title: Data Connect Hub REST API
  version: 1.0.0
  description: REST API Data Connect Hub BFF
  license:
    name: Apache 2.0
    url: 'https://www.apache.org/licenses/LICENSE-2.0'
servers:
  - url: 'https://localhost:8080'
  - url: 'http://localhost:8080'
paths:
  /healthcheck:
    summary: Path targeted for healthcheck purposes.
    description: >-
      The REST endpoint/path used to allow a healthcheck update.
    get:
      tags:
        - K8SOperation
      responses:
        '200':
          $ref: '#/components/responses/HealthCheckResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: healthcheck
      summary: HealthCheck
      description: HealthCheck endpoint.
  /api/v1/namespaces:
    summary: Path used to get available namespaces.
    description: >-
      The REST endpoint/path used to list available namespaces.
    get:
      tags:
        - K8SOperation
      responses:
        '200':
          $ref: '#/components/responses/NamespacesResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getNamespaces
      summary: Get Available Namespaces
      description: Returns available namespaces in the cluster.
  /api/v1/user:
    summary: Path used to Retrieve a user based on the header.
    description: >-
      The REST endpoint/path used pass all the config information needed for the UI.
    get:
      tags:
        - K8SOperation
      responses:
        '200':
          $ref: '#/components/responses/ConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
      operationId: getConfig
      summary: Get configuration info
      description: Gets the configuration information needed for the UI [TBD]
  /api/v1/connections:
    summary: Path used to list data connections for a project.
    get:
      tags:
        - DataOperation
      parameters:
        - $ref: '#/components/parameters/namespace'
      responses:
        '200':
          $ref: '#/components/responses/ConnectionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UpstreamErrorResponse'
      operationId: getConnections
      summary: Get data connections
      description: Returns the data connections belonging to the selected project.
  /api/v1/connection-types:
    summary: Path used to list connection types for a project.
    get:
      tags:
        - DataOperation
      parameters:
        - $ref: '#/components/parameters/namespace'
      responses:
        '200':
          $ref: '#/components/responses/ConnectionTypesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UpstreamErrorResponse'
      operationId: getConnectionTypes
      summary: Get connection types
      description: Returns the connection types available to the selected project.
  /api/v1/connections/{id}/readiness:
    summary: Path used to verify a data connection.
    post:
      tags:
        - DataOperation
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/namespace'
      responses:
        '204':
          description: Connection verification completed.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          $ref: '#/components/responses/BadGateway'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UpstreamErrorResponse'
      operationId: verifyConnection
      summary: Verify a data connection
      description: Checks the connection and updates its readiness status.
  /api/v1/connections/{id}:
    summary: Path used to delete a data connection.
    delete:
      tags:
        - DataOperation
      parameters:
        - $ref: '#/components/parameters/id'
        - $ref: '#/components/parameters/namespace'
      responses:
        '204':
          description: Connection deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        default:
          $ref: '#/components/responses/UpstreamErrorResponse'
      operationId: deleteConnection
      summary: Delete a data connection
      description: Deletes a data connection from the selected project.
components:
  schemas:
    Config:
      required:
        - userId
        - clusterAdmin
      type: object
      properties:
        userId:
          type: string
          example: user@example.com
        clusterAdmin:
          type: boolean
          example: true
    Connection:
      required:
        - metadata
        - resource
        - status
      type: object
      properties:
        metadata:
          type: object
          required:
            - id
          properties:
            id:
              type: string
              minLength: 1
              pattern: '^[^/]+$'
            tenant_id:
              type: string
            created_at:
              type: string
            updated_at:
              type: string
        resource:
          type: object
          required:
            - name
            - data_connection_type_id
            - format
          properties:
            name:
              type: string
              example: warehouse
            data_connection_type_id:
              type: string
              example: postgresql
            format:
              type: string
              enum: [tabular, binary]
        status:
          type: object
          required:
            - state
          properties:
            state:
              type: string
              enum: [ready, ingestion_not_ready, not_ready]
            message:
              type: string
            updated_at:
              type: string
    ConnectionType:
      required:
        - metadata
        - resource
      type: object
      properties:
        metadata:
          type: object
          required:
            - id
          properties:
            id:
              type: string
            tenant_id:
              type: string
        resource:
          type: object
          required:
            - name
            - provider
          properties:
            name:
              type: string
              example: PostgreSQL
            provider:
              type: string
              example: postgresql
            description:
              type: string
        status:
          type: object
          properties:
            capabilities:
              type: object
              properties:
                flight:
                  type: boolean
                rest:
                  type: boolean
    NoContent:
      description: Successful operation with no response body.
    BaseResource:
      allOf:
        - $ref: '#/components/schemas/BaseResourceCreate'
        - type: object
          properties:
            id:
              format: int64
              description: Output only. The unique server generated id of the resource.
              type: string
              readOnly: true
            createTimeSinceEpoch:
              format: int64
              description: Output only. Create time of the resource in millisecond since epoch.
              type: string
              readOnly: true
            lastUpdateTimeSinceEpoch:
              format: int64
              description: |-
                Output only. Last update time of the resource since epoch in millisecond
                since epoch.
              type: string
              readOnly: true
    BaseResourceCreate:
      allOf:
        - $ref: '#/components/schemas/BaseResourceUpdate'
        - type: object
          properties:
            name:
              description: |-
                The client provided name of the artifact. This field is optional. If set,
                it must be unique among all the artifacts of the same artifact type within
                a database instance and cannot be changed once set.
              type: string
    BaseResourceUpdate:
      type: object
      properties:
        customProperties:
          description: User provided custom properties which are not defined by its type.
          type: object
          additionalProperties:
            $ref: '#/components/schemas/MetadataValue'
        description:
          description: |-
            An optional description about the resource.
          type: string
        externalId:
          description: |-
            The external id that come from the clients' system. This field is optional.
            If set, it must be unique among all resources within a database instance.
          type: string

    Error:
      description: Error code and message.
      required:
        - code
        - message
      type: object
      properties:
        code:
          description: Error code
          type: string
        message:
          description: Error message
          type: string
    ErrorResponse:
      required:
        - error
      type: object
      properties:
        error:
          $ref: '#/components/schemas/Error'
    SortOrder:
      description: Supported sort direction for ordering result entities.
      enum:
        - ASC
        - DESC
      type: string
    OrderByField:
      description: Supported fields for ordering result entities.
      enum:
        - CREATE_TIME
        - LAST_UPDATE_TIME
        - Id
      type: string

  responses:
    HealthCheckResponse:
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: string
                example: healthy
      description: Health check response
    NamespacesResponse:
      content:
        application/json:
          schema:
            type: object
            properties:
              metadata:
                type: object
                description: Metadata about the response
              data:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: default-namespace
      description: List of available namespaces
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The specified resource was not found
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Bad Request parameters
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Unauthorized
    Forbidden:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Forbidden
    InternalServerError:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Unexpected internal server error
    UpstreamErrorResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: An error propagated from the upstream Data Connect Hub API.
    ServiceUnavailable:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The upstream Data Connect Hub service is unavailable.
    BadGateway:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: The upstream Data Connect Hub service could not verify the connection.
    ConfigResponse:
      content:
        application/json:
          schema:
            type: object
            properties:
              metadata:
                type: object
                description: Metadata about the response
              data:
                $ref: '#/components/schemas/Config'
      description: A response containing a list of Config entities.
    ConnectionsResponse:
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              metadata:
                type: object
              data:
                type: array
                items:
                  $ref: '#/components/schemas/Connection'
      description: List of data connections for a project.
    ConnectionTypesResponse:
      content:
        application/json:
          schema:
            type: object
            required:
              - data
            properties:
              metadata:
                type: object
              data:
                type: array
                items:
                  $ref: '#/components/schemas/ConnectionType'
      description: List of connection types for a project.
    ConflictResponse:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
      description: Conflict - Role Binding with the same name already exists

  parameters:
    id:
      name: id
      description: The ID of resource.
      schema:
        type: string
        minLength: 1
        pattern: '^[^/]+$'
      in: path
      required: true
    name:
      examples:
        name:
          value: entity-name
      name: name
      description: Name of entity to search.
      schema:
        type: string
      in: query
      required: false
    externalId:
      examples:
        externalId:
          value: '10'
      name: externalId
      description: External ID of entity to search.
      schema:
        type: string
      in: query
      required: false
    parentResourceId:
      examples:
        parentResourceId:
          value: '10'
      name: parentResourceId
      description: ID of the parent resource to use for search.
      schema:
        type: string
      in: query
      required: false
    pageSize:
      examples:
        pageSize:
          value: '100'
      name: pageSize
      description: Number of entities in each page.
      schema:
        type: string
      in: query
      required: false
    nextPageToken:
      name: nextPageToken
      description: Token to use to retrieve next page of results.
      schema:
        type: string
      in: query
      required: false
    orderBy:
      style: form
      explode: true
      examples:
        orderBy:
          value: Id
      name: orderBy
      description: Specifies the order by criteria for listing entities.
      schema:
        $ref: '#/components/schemas/OrderByField'
      in: query
      required: false
    sortOrder:
      style: form
      explode: true
      examples:
        sortOrder:
          value: DESC
      name: sortOrder
      description: 'Specifies the sort order for listing entities, defaults to ASC.'
      schema:
        $ref: '#/components/schemas/SortOrder'
      in: query
      required: false
    namespace:
      name: namespace
      description: The namespace to filter resources by.
      schema:
        type: string
        maxLength: 63
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
      in: query
      required: true

  securitySchemes:
    Bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
      description: Bearer JWT scheme
security:
  - Bearer: []
tags:
  - name: K8SOperation
    description: Operation performed in Kubernetes
