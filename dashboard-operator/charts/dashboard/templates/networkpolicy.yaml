{{- if .Values.networkPolicy.enabled }}
# Least-privilege ingress NetworkPolicy for the Dashboard module/component controller pod.
# Satisfies HPSTRAT-104 / operand contract RHOAIENG-90747 (RHOAIENG-96334). The manager binds
# secure HTTPS metrics on :8443 and health/readiness probes on :8081 (see cmd/manager/main.go).
# Mirrors the sibling RHOAI operator convention (e.g. mlflow-operator-controller-manager).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "dashboard.deploymentName" . }}-metrics
  namespace: {{ include "dashboard.namespace" . }}
  labels:
    {{- include "dashboard.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "dashboard.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    # Health/readiness probes (:8081). Kubelet/node-originated probes are host-sourced and cannot
    # be constrained by a NetworkPolicy peer selector, so this rule is port-scoped with no `from:`.
    # Documented reduced-posture limitation per operand contract R5 (RHOAIENG-90747); this does not
    # claim enforceable kubelet/node isolation.
    - ports:
        - port: 8081
          protocol: TCP
    # Metrics scraping (HTTPS :8443) from the supported OpenShift / RHOAI / ODH monitoring
    # namespaces only. Namespaces are selected by their immutable kubernetes.io/metadata.name label.
    - ports:
        - port: 8443
          protocol: TCP
      from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-user-workload-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: redhat-ods-monitoring
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: opendatahub-monitoring
    {{- if .Values.webhook.enabled }}
    # Validating webhook (:{{ .Values.webhook.port }}). Invoked by the kube-apiserver, which is
    # host-networked and not selectable as a NetworkPolicy peer, so this rule is port-scoped with
    # no `from:`. Documented reduced-posture limitation per operand contract R5.
    - ports:
        - port: {{ .Values.webhook.port }}
          protocol: TCP
    {{- end }}
{{- end }}
