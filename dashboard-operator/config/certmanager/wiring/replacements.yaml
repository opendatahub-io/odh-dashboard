apiVersion: builtin
kind: ReplacementTransformer
metadata:
  name: dashboard-metrics-wiring
replacements:
  # Metrics serving cert SANs: <service name>.<service namespace>.svc[.cluster.local]
  - source:
      kind: Service
      name: dashboard-operator-metrics-service
      fieldPath: metadata.name
    targets:
      - select:
          kind: Certificate
          name: dashboard-operator-metrics-cert
        fieldPaths:
          - spec.dnsNames.0
          - spec.dnsNames.1
        options:
          delimiter: .
          index: 0
  - source:
      kind: Service
      name: dashboard-operator-metrics-service
      fieldPath: metadata.namespace
    targets:
      - select:
          kind: Certificate
          name: dashboard-operator-metrics-cert
        fieldPaths:
          - spec.dnsNames.0
          - spec.dnsNames.1
        options:
          delimiter: .
          index: 1
