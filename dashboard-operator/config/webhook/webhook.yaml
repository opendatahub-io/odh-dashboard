apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: dashboard-validating-webhook
  annotations:
    cert-manager.io/inject-ca-from: CERTIFICATE_NAMESPACE/dashboard-operator-webhook-cert
webhooks:
  - name: validate.dashboards.components.platform.opendatahub.io
    admissionReviewVersions:
      - v1
    clientConfig:
      service:
        name: dashboard-operator-webhook-service
        namespace: system
        path: /validate-dashboard
    rules:
      - apiGroups:
          - components.platform.opendatahub.io
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
          - UPDATE
        resources:
          - dashboards
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - configmaps
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
          - DELETE
        resources:
          - namespaces
          - namespaces/status
          - namespaces/finalize
    matchConditions:
      - name: namespaced-rbac-target-fields-changed
        expression: >-
          request.resource.resource != 'dashboards' ||
          oldObject == null ||
          object.?spec.notebooksNamespace.orValue('') != oldObject.?spec.notebooksNamespace.orValue('') ||
          object.?spec.modelRegistryNamespace.orValue('') != oldObject.?spec.modelRegistryNamespace.orValue('') ||
          object.?metadata.annotations['dashboard.opendatahub.io/namespaced-rbac-grants'].orValue('') !=
          oldObject.?metadata.annotations['dashboard.opendatahub.io/namespaced-rbac-grants'].orValue('') ||
          object.?metadata.annotations['dashboard.opendatahub.io/namespaced-rbac-consent-enforced'].orValue('') !=
          oldObject.?metadata.annotations['dashboard.opendatahub.io/namespaced-rbac-consent-enforced'].orValue('')
      - name: namespaced-rbac-consent-label-changed
        expression: >-
          request.resource.resource != 'namespaces' ||
          (request.operation == 'CREATE'
            ? object.?metadata.labels['dashboard.opendatahub.io/allow-namespaced-rbac'].orValue('') == 'true'
            : object.?metadata.labels['dashboard.opendatahub.io/allow-namespaced-rbac'].orValue('') !=
              oldObject.?metadata.labels['dashboard.opendatahub.io/allow-namespaced-rbac'].orValue(''))
      - name: namespaced-rbac-state-changed
        expression: >-
          request.resource.resource != 'configmaps' ||
          (request.operation == 'DELETE'
            ? request.name == 'dashboard-namespaced-rbac-state'
            : object.?metadata.name.orValue('') == 'dashboard-namespaced-rbac-state')
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dashboard-operator-webhook-service
  namespace: system
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    app.kubernetes.io/name: dashboard-operator
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dashboard-operator-webhook-cert
  namespace: system
spec:
  dnsNames:
    - dashboard-operator-webhook-service.system.svc
    - dashboard-operator-webhook-service.system.svc.cluster.local
  issuerRef:
    kind: Issuer
    name: selfsigned-issuer
  secretName: dashboard-operator-webhook-tls
