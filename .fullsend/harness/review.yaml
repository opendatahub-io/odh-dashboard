base: https://raw.githubusercontent.com/fullsend-ai/agents/91f61f3441baedf3f912c9afd4bd574c98793b96/harness/review.yaml#sha256=c805713f74d2d5c21eeefefaee42962136a6c83954a8d468463f8e13861e8d08

agent: agents/review.md

skills:
  # This local skill replaces Fullsend's inherited pr-review with the
  # registry-driven dimensions orchestrator. ODH-owned reviewer skills are
  # packaged as nested sub-agent definitions inside this skill, rather than
  # imported as peer skills into the agent's global skill namespace.
  - skills/pr-review

host_files:
  - src: dimensions.json
    dest: /sandbox/workspace/.fullsend/dimensions.json
  - src: .run/jira.json
    dest: /sandbox/workspace/.fullsend/.run/jira.json
    optional: true

model: sonnet

# The base harness allows 20 minutes. The multi-dimension smoke run (PR #71,
# 4 files, 11 producers) used 16m6s of it — 80% of budget on a deliberately
# small fixture, and the run that opened this investigation was killed at
# exactly this cap mid-write. Ordinary PRs qualify more dimensions over more
# files, so 20 leaves no room. Step 7 of the orchestrator skill now writes and
# validates the result before any optional work, so a timeout costs enrichment
# rather than the whole review; this raise is the second half of that belt.
timeout_minutes: 40

env:
  runner:
    REVIEW_FINDING_SEVERITY_THRESHOLD: "low"
    REVIEW_PROTECTED_PATHS: ".claude/,.cursor/,.gitattributes,.github/,.pre-commit-config.yaml,AGENTS.md,agents/,api-servers/,CLAUDE.md,CODEOWNERS,Containerfile,Dockerfile,harness/,images/,plugins/,policies/,scripts/,skills/"
  sandbox:
    REVIEW_FINDING_SEVERITY_THRESHOLD: "low"
    REVIEW_PROTECTED_PATHS: ".claude/,.cursor/,.gitattributes,.github/,.pre-commit-config.yaml,AGENTS.md,agents/,api-servers/,CLAUDE.md,CODEOWNERS,Containerfile,Dockerfile,harness/,images/,plugins/,policies/,scripts/,skills/"

validation_loop:
  script: scripts/validate-output-schema.sh
  schema: schemas/review-result.schema.json
  # One retry lets the runtime repair a missing or malformed result instead of
  # turning an otherwise-complete review into a terminal workflow failure.
  max_iterations: 2

post_script: scripts/post-review.sh
pre_script: scripts/pre-review.sh

forge:
  github:
    post_script: scripts/post-review.sh
    pre_script: scripts/pre-review.sh
