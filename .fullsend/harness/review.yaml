base: https://raw.githubusercontent.com/fullsend-ai/agents/2da538b8b62ad6d7b91c43d8cf139f4738cfbf51/harness/review.yaml#sha256=083fb43c4c1c5c75282410c4b8381f391eb760eb37b8bf49112a036b02269f4b

agent: agents/review.md

# Not inherited: `base:` composition does not merge readonly_repo, so the
# base's `true` is lost unless it is repeated here. The runbook loads
# sub-agent definitions and meta-prompts from this checkout by path; nothing
# in the review writes inside it.
readonly_repo: true

# Pin the multi-architecture Fullsend sandbox image (v0.48.1, Pi 1.3.0). It
# moves with the reusable workflow pin in .github/workflows/fullsend.yaml.
image: ghcr.io/fullsend-ai/fullsend-sandbox@sha256:7304e1f635eeebf1a3ebf60bfc9ac20a8db6f01b646d0ebb0ad4d53c2d7c30aa

# The `openai` provider comes from the base, which now declares it.

skills:
  # This local skill replaces Fullsend's inherited pr-review with the
  # registry-driven dimensions orchestrator. ODH-owned reviewer skills are
  # packaged as nested sub-agent definitions inside this skill, rather than
  # imported as peer skills into the agent's global skill namespace.
  - skills/pr-review
  # issue-labels comes from the base (forge.github.skills). Fullsend v0.48
  # keys skills on their declared SKILL.md name, so the base's
  # skills/issue-labels/github and skills/pr-review/github both load.

# The runner owns /sandbox/workspace/.fullsend (output schema, iteration
# state) and refuses host_files under it, so the registry and the host's
# adapter output land in a directory of their own.
host_files:
  - src: dimensions.json
    dest: /sandbox/workspace/odh-review/dimensions.json
  # product-ask-review reads its trusted snapshot by path (registry context_file).
  - src: .run/jira.json
    dest: /sandbox/workspace/odh-review/jira.json
    optional: true
  - src: .run/collected.json
    dest: /sandbox/workspace/odh-review/collected.json
    optional: true

model: sonnet

# timeout_minutes is inherited from the base (45), which mirrors it into the
# sandbox as TIMEOUT_SECONDS for the orchestrator's time-budget checkpoints.
# Overriding one here means overriding both.

env:
  # REVIEW_PROTECTED_PATHS is inherited from the base, so it follows the
  # Fullsend default list. Set it under both `runner` and `sandbox` to change
  # it; the host and the orchestrator must see the same value.
  #
  # REVIEW_RISK_ASSESSMENT_ENABLED is off: the base turns on Fullsend's
  # risk-assessment sub-agent, but here `risk` and `confidence` come from the
  # registry's `signal:*` producer and .fullsend/rating-policy.json.
  #
  # That flag is also what makes pre-review.sh unshallow target-repo, so the
  # depth is requested explicitly: the stock correctness reviewer runs
  # `git log` on modified test files and needs the base branch history.
  #
  # The host-adapter credentials come from FULLSEND_GITHUB_RUNNER_SECRETS,
  # which the shim composes (ADR 0136). env.runner reaches every host-side
  # script; pre-review.sh unsets these names before it starts any child and
  # passes each adapter only the names its registry row declares. They must
  # stay out of env.sandbox, host_files and validation_loop, which the runner
  # enforces.
  runner:
    REVIEW_FINDING_SEVERITY_THRESHOLD: "low"
    REVIEW_RISK_ASSESSMENT_ENABLED: "false"
    REVIEW_GIT_FETCH_DEPTH: "0"
    CODERABBIT_API_KEY: "${CODERABBIT_API_KEY}"
    JIRA_URL: "${JIRA_URL}"
    JIRA_USERNAME: "${JIRA_USERNAME}"
    JIRA_API_TOKEN: "${JIRA_API_TOKEN}"
  sandbox:
    REVIEW_FINDING_SEVERITY_THRESHOLD: "low"
    REVIEW_RISK_ASSESSMENT_ENABLED: "false"

validation_loop:
  script: scripts/validate-output-schema.sh
  schema: schemas/review-result.schema.json
  # One retry lets the runtime repair a missing or malformed result instead of
  # turning an otherwise-complete review into a terminal workflow failure.
  max_iterations: 2

post_script: scripts/post-review.sh
pre_script: scripts/pre-review.sh

forge:
  github:
    post_script: scripts/post-review.sh
    pre_script: scripts/pre-review.sh
