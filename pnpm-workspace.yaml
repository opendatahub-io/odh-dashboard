packages:
  - backend
  - frontend
  - frontend/src
  - packages/*
  - packages/agent-ops/frontend
  - packages/automl/frontend
  - packages/autorag/frontend
  - packages/autox-core/ui
  - packages/data-connect-hub/frontend
  - packages/data-registry/frontend
  - packages/eval-hub/frontend
  - packages/gen-ai/frontend
  - packages/maas/frontend
  - packages/mlflow/frontend
  - packages/model-serving/frontend
  - packages/model-serving/cypress
  - packages/kserve/cypress
  - packages/llmd-serving/cypress
  - distributions/base
  - distributions/core-bff
  - distributions/core-bff/frontend
  - distributions/rhaii
  - distributions/maas-consumer-portal

# Transitional: publicly hoist dependencies for build/test tooling. Remove in RHOAIENG-83228.
shamefullyHoist: true
autoInstallPeers: true

# These Perses plugins import MUI but omit it from their published peer dependencies.
packageExtensions:
  '@perses-dev/loki-plugin@0.6.0-rc.2':
    peerDependencies:
      '@mui/material': '^6.1.10'
  '@perses-dev/prometheus-plugin@0.58.0-beta.3':
    peerDependencies:
      '@mui/material': '^6.1.10'
  '@perses-dev/stat-chart-plugin@0.13.0-rc.1':
    peerDependencies:
      '@mui/material': '^6.1.10'
  '@perses-dev/table-plugin@0.13.0-rc.1':
    peerDependencies:
      '@mui/material': '^6.1.10'

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  core-js: true
  core-js-pure: true
  cypress: true
  esbuild: true
  protobufjs: true
  unrs-resolver: true

overrides:
  '@openshift/dynamic-plugin-sdk-utils': '5.0.1'
  '@openshift/dynamic-plugin-sdk-utils>react-redux': '^8.1.3'
  '@openshift/dynamic-plugin-sdk-utils>react-router': '^7.18.3'
  '@openshift/dynamic-plugin-sdk-utils>react-router-dom': '^7.18.3'
  '@openshift/dynamic-plugin-sdk-utils>react': '^18.3.1'
  '@openshift/dynamic-plugin-sdk-utils>react-dom': '^18.3.1'
  '@openshift/dynamic-plugin-sdk-utils>@patternfly/react-core': '~6.5.1'
  '@openshift/dynamic-plugin-sdk-utils>@patternfly/react-icons': '~6.5.1'
  '@openshift/dynamic-plugin-sdk-utils>@patternfly/react-styles': '~6.5.1'
  '@openshift/dynamic-plugin-sdk-utils>@patternfly/react-table': '~6.5.1'
  '@openshift/dynamic-plugin-sdk-utils>@patternfly/react-virtualized-extension': '6.2.0'
  '@patternfly/react-topology>react': '^18.3.1'
  '@types/react': '^18.3.31'
  csstype: '^3.2.3'
  react-router: '^7.18.3'
  react-router-dom: '^7.18.3'
  ws: '^8.21.0'
  '@types/ws': '^8.18.1'
  dompurify: '^3.4.8'
  '@types/tar': '^6.1.13'
  jsonpath-plus: '^10.4.0'
  tough-cookie: '^4.1.4'
  # @kubernetes/client-node@0.12.3 declares tar@^6, but main requires this patched major.
  '@kubernetes/client-node>tar': '^7.5.22'
  redux: '^4.2.1'
  form-data: '^4.0.5'
  axios: '^1.17.0'
  shell-quote: '>=1.8.4'
  webpack: '5.104.1'
  '@rspack/core': '2.2.4'
  '@rspack/cli': '2.1.10'
  serialize-javascript: '>=7.0.5'
  # Security floors mirrored from main's npm overrides (CVE remediation).
  fast-uri: '>=3.1.7 <4.0.0'
  koa: '>=3.1.2'
  adm-zip: '>=0.6.0'
  svgo: '^4.1.0'
  postcss: '>=8.5.23 <9.0.0'
  'js-yaml@^3': '3.15.2'
  'js-yaml@^4': '4.3.2'
  '@cypress/code-coverage>js-yaml': '>=4.3.2 <5.0.0'
  'xmlbuilder2>js-yaml': '3.15.2'
  '@types/minimatch': '5.1.2'
  '@mui/material@>=7>@mui/utils': '^7.3.11'
  '@mui/material@>=7>@mui/system': '^7.3.11'
  '@tanstack/react-query@>=5>@tanstack/query-core': '5.101.4'
  'brace-expansion@^1': '1.1.18'
  'brace-expansion@^2': '2.1.4'
  'brace-expansion@^5': '5.0.9'
