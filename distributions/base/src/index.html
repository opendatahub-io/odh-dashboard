<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title><%= htmlRspackPlugin.options.title %></title>
    <script>
      // PatternFly Felt theme — applied before the app boots so tokens are correct
      // on first paint. Light/dark composes via .pf-v6-theme-dark (see ThemeContext).
      document.documentElement.classList.add('pf-v6-theme-felt');
      document.documentElement.classList.add('pf-v6-theme-glass');
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
