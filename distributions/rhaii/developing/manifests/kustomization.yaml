apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opendatahub

resources:
- namespace.yaml
- ../../../core-bff/manifests/base
- api-tester.yaml
- dev-rbac.yaml
- hardware-profile.yaml

patches:
- target:
    kind: Deployment
    name: rhaii-dashboard
  patch: |
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: rhaii-dashboard
    spec:
      template:
        spec:
          containers:
            - name: rhaii-dashboard
              # Select xKS explicitly, as the production RHAII bundle does. The
              # Tilt cluster is a Kind xKS testbed, and auto-detection falls
              # back to the conservative OpenShift admission contract when the
              # ClusterVersion probe is forbidden.
              args:
                - --dev-mode
                - --platform-type=XKS
