apiVersion: v1
kind: Namespace
metadata:
  name: model-serving-demo
  labels:
    opendatahub.io/dashboard: 'true'
    modelmesh-enabled: 'false'
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: opt-125m-tilt-demo
  namespace: model-serving-demo
  annotations:
    openshift.io/display-name: Facebook OPT 125M
spec:
  model:
    uri: hf://facebook/opt-125m
    name: facebook/opt-125m
  replicas: 1
  router:
    gateway: {}
    route: {}
    scheduler: {}
  template:
    containers:
      - name: main
        image: docker.io/vllm/vllm-openai-cpu:v0.31.0
        # KServe passes the staged model path to vLLM.
        args: [--dtype, float32, --max-model-len, '1024']
        env:
          - name: HF_HOME
            value: /tmp/hf_home
          - name: VLLM_CPU_KVCACHE_SPACE
            value: '1'
          - name: VLLM_ENABLE_V1_MULTIPROCESSING
            value: '0'
        resources:
          requests:
            cpu: 100m
            memory: 4Gi
          limits:
            cpu: '1'
            memory: 8Gi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhaii-dashboard-model-serving
  namespace: model-serving-demo
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhaii-dashboard-model-serving
  namespace: model-serving-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhaii-dashboard-model-serving
subjects:
  - kind: ServiceAccount
    name: rhaii-dashboard
    namespace: opendatahub
