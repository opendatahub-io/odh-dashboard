apiVersion: v1
kind: Namespace
metadata:
  name: model-serving-demo
  labels:
    opendatahub.io/dashboard: 'true'
    modelmesh-enabled: 'false'
---
apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: sklearn-iris
  namespace: model-serving-demo
spec:
  predictor:
    model:
      modelFormat:
        name: sklearn
      runtime: kserve-sklearnserver
      storageUri: gs://kfserving-examples/models/sklearn/1.0/model
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 512Mi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: rhaii-dashboard-model-serving
  namespace: model-serving-demo
rules:
  - apiGroups:
      - ''
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: rhaii-dashboard-model-serving
  namespace: model-serving-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: rhaii-dashboard-model-serving
subjects:
  - kind: ServiceAccount
    name: rhaii-dashboard
    namespace: opendatahub
---
apiVersion: serving.kserve.io/v1alpha1
kind: ServingRuntime
metadata:
  name: kserve-sklearnserver
  namespace: opendatahub
  labels:
    opendatahub.io/dashboard: 'true'
  annotations:
    opendatahub.io/modelServingSupport: '["single"]'
    opendatahub.io/model-type: '["predictive"]'
spec:
  supportedModelFormats:
    - name: sklearn
      version: '1'
      autoSelect: true
  containers:
    - name: kserve-container
      image: kserve/sklearnserver:v0.19.0
      args:
        - --model_name={{.Name}}
        - --model_dir=/mnt/models
        - --http_port=8080
