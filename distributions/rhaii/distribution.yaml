name: rhaii
productName: "Red Hat AI"

extensionProfiles:
  modelServing: deployments

packages:
  local:
    - name: rhaii
      extensionsPath: ./extensions
  bundled:
    - package: '@odh-dashboard/llmd-serving'
      extensionsPath: ./extensions/deployments
      featureFlags:
        enable-llmd-serving: true

featureFlags:
  vllm-on-maas: false
