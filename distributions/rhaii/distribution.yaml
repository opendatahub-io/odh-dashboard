name: rhaii
productName: "Red Hat AI"

packages:
  local:
    - name: rhaii
      extensionsPath: ./extensions
  bundled:
    - package: '@odh-dashboard/kserve'
      extensionsPath: ./extensions
      featureFlags:
        kserve: true
    - package: '@odh-dashboard/llmd-serving'
      extensionsPath: ./extensions
      featureFlags:
        llmd-serving: true

featureFlags: {}
