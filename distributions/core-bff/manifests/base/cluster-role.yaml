apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rhaii-dashboard
rules:
  # OpenShift only: the cluster-wide TLS security profile. On xKS the BFF serves
  # Mozilla Intermediate defaults directly and never issues this read, so this
  # rule is inert there and may be dropped from an xKS-only overlay.
  # See distributions/core-bff/docs/runtime-contract.md.
  - apiGroups:
      - config.openshift.io
    resources:
      - apiservers
    resourceNames:
      - cluster
    verbs:
      - get
