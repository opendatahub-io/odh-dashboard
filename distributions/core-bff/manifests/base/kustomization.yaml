apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - service-account.yaml
  - role.yaml
  - role-binding.yaml

configMapGenerator:
  - name: core-bff-params
    env: params.env

generatorOptions:
  disableNameSuffixHash: true

replacements:
  - source:
      kind: ConfigMap
      name: core-bff-params
      fieldPath: data.rhaii-dashboard-image
    targets:
      - select:
          kind: Deployment
          name: rhaii-dashboard
        fieldPaths:
          - spec.template.spec.containers.[name=rhaii-dashboard].image
