apiVersion: tekton.dev/v1
# noop - trigger konflux build
# konflux build manual retrigger - 2026-11-19 06:04:17
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/red-hat-data-services/odh-dashboard?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    build.appstudio.openshift.io/build-nudge-files: "build/operator-nudging.yaml"
    pipelinesascode.tekton.dev/on-cel-expression: |
      konflux_cluster == "stone-prod-p02"
      && event == "push"
      && target_branch == "rhoai-3.5"
      && ( "packages/gen-ai/**".pathChanged() 
      || ".tekton/odh-mod-arch-gen-ai-v3-5-push.yaml".pathChanged() 
      || "Dockerfile.konflux.genai".pathChanged() )
  labels:
    appstudio.openshift.io/application: rhoai-v3-5
    appstudio.openshift.io/component: odh-mod-arch-gen-ai-v3-5
    pipelines.appstudio.openshift.io/type: build
  name: odh-mod-arch-gen-ai-v3-5-on-push
  namespace: rhoai-tenant
spec:
  timeouts:
    tasks: 2h
    pipeline: 4h
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: additional-tags
    value:
    - '{{target_branch}}-{{revision}}'
  - name: output-image
    value: quay.io/rhoai/odh-mod-arch-gen-ai-rhel9:{{target_branch}}
  - name: rhoai-version
    value: "3.5.5"
  - name: dockerfile
    value: Dockerfile.konflux.genai
  - name: path-context
    value: .
  - name: hermetic
    value: true
  - name: prefetch-input
    value: |
      [
        {
          "path": ".",
          "type": "npm"
        },
        {
          "path": "packages/gen-ai/frontend",
          "type": "npm"
        },
        {
          "path": "packages/gen-ai/bff",
          "type": "gomod"
        }
      ]
  - name: build-source-image
    value: true
  - name: build-image-index
    value: true
  - name: build-platforms
    value:
    - linux/x86_64
    - linux-m2xlarge/arm64
    - linux/ppc64le
    - linux/s390x
  pipelineRef:
    resolver: git
    params:
    - name: url
      value: https://github.com/red-hat-data-services/konflux-central.git
    - name: revision
      value: '{{ target_branch }}'
    - name: pathInRepo
      value: pipelines/multi-arch-container-build.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-odh-mod-arch-gen-ai-v3-5
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
  taskRunSpecs:
  - pipelineTaskName: rpms-signature-scan
    stepSpecs:
    - name: rpms-signature-scan
      computeResources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "500m"
          memory: "1Gi"
status: {}
#restart
