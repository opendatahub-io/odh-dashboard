name: Cypress Mock Orchestration
permissions:
  contents: read
on:
  pull_request:
    paths:
      - 'package.json'
      - 'frontend/package.json'
      - 'packages/**/package.json'
      - 'distributions/**/package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.jsonc'
      - 'scripts/cypress/**'
      - '.github/workflows/cypress-mock-orchestration.yml'
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'frontend/package.json'
      - 'packages/**/package.json'
      - 'distributions/**/package.json'
      - 'pnpm-workspace.yaml'
      - 'turbo.jsonc'
      - 'scripts/cypress/**'
      - '.github/workflows/cypress-mock-orchestration.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4
        with:
          node-version: '22'
      - name: Validate federation targets and test selection
        run: |
          node scripts/cypress/run-mock-federation-task.js validate
          node --test scripts/cypress/__tests__/*.test.js
