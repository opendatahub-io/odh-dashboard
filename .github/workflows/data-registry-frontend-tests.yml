name: Test / Data Registry Frontend Tests
on:
  push:
    paths:
      - 'packages/data-registry/**'
      - '.github/workflows/data-registry-frontend-tests.yml'
      - '.github/actions/module-caches/**'
      - '!LICENSE*'
      - '!DOCKERFILE*'
      - '!**.gitignore'
      - '!**.md'

  pull_request:
    paths:
      - 'packages/data-registry/**'
      - '.github/workflows/data-registry-frontend-tests.yml'
      - '.github/actions/module-caches/**'
      - '!LICENSE*'
      - '!DOCKERFILE*'
      - '!**.gitignore'
      - '!**.md'

env:
  NODE_VERSION: 22

jobs:
  test:
    name: Data Registry Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Module caches
        uses: ./.github/actions/module-caches
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: data-registry node_modules cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: packages/data-registry/frontend/node_modules
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-modules-data-registry-${{ hashFiles('packages/data-registry/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.NODE_VERSION }}-modules-data-registry-

      - name: Install data-registry dependencies
        working-directory: packages/data-registry/frontend
        run: npm install && npx --no-install cypress install

      - name: Cypress mock tests
        working-directory: packages/data-registry/frontend
        run: npm run test:cypress-ci
