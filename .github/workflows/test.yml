name: Test
on: [push, pull_request]

# Concurrency control: Only run latest tests for each PR/branch
# Cancel in-progress runs when new commits are pushed
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  DO_NOT_TRACK: 1
  # Check if the PR is a draft to disable coverage reporting/upload
  IS_DRAFT: ${{ github.event.pull_request.draft }}
jobs:
  Setup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Package Manager Policy — reject unexpected npm lockfiles
        shell: bash
        run: |
          set -euo pipefail
          allowed_lockfiles=(
            "packages/model-registry/upstream/package-lock.json"
            "packages/model-registry/upstream/frontend/package-lock.json"
            "packages/notebooks/upstream/workspaces/frontend/package-lock.json"
            # Locked npm bootstrap for pnpm in hermetic Konflux builds.
            "prefetch/pnpm/package-lock.json"
          )
          unexpected=()
          while IFS= read -r file; do
            if [[ " ${allowed_lockfiles[*]} " == *" $file "* ]]; then
              continue
            fi
            unexpected+=("$file")
          done < <(
            git ls-files |
              grep -E '(^|/)(package-lock\.json|npm-shrinkwrap\.json)$' || true
          )

          if ((${#unexpected[@]} > 0)); then
            printf '::error::Unexpected npm lockfile(s):\n'
            printf '  %s\n' "${unexpected[@]}"
            echo 'Use the root pnpm-lock.yaml.'
            echo 'Only documented upstream and bootstrap lockfiles are allowed.'
            exit 1
          fi
      - name: Free disk space
        uses: ./.github/actions/free-disk-space
      - name: Setup pnpm and Node.js
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'

      - name: Validate module federation ports
        run: pnpm run validate:ports

      - name: Check for uncommitted changes
        run: git diff --exit-code

  Quality-Gate:
    needs: [Setup]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        check: [lint, type-check]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup pnpm and install dependencies
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: >-
            ${{ runner.os }}-${{ env.NODE_VERSION }}-turbo-${{ matrix.check
            }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.NODE_VERSION }}-turbo-${{ matrix.check }}-
      - name: Run ${{ matrix.check }}
        run: |
          if [ "${{ matrix.check }}" = "lint" ]; then
            NODE_OPTIONS="--max-old-space-size=8192" pnpm run lint
          else
            pnpm run type-check
          fi

  Unit-Tests:
    needs: [Setup]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup pnpm and install dependencies
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: >-
            ${{ runner.os }}-${{ env.NODE_VERSION }}-turbo-unit-tests-${{
            github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ env.NODE_VERSION }}-turbo-unit-tests-
      - name: Abort if quality gate already failed
        # v7.0.1
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            const gates = data.jobs.filter((j) =>
              j.name.startsWith('Quality-Gate'),
            );
            const failed = gates.filter(j =>
              j.conclusion === 'failure' || j.conclusion === 'cancelled'
            );
            if (failed.length > 0) {
              core.setFailed(
                `Quality gate(s) failed: ${failed
                  .map((j) => j.name)
                  .join(', ')}. Skipping tests.`
              );
              return;
            }
            const status = gates.map(j =>
              `${j.name}=${j.conclusion || 'in_progress'}`
            );
            core.info(`Quality gates: ${status.join(', ')}`);
      - name: Unit tests with coverage
        run: |
          pnpm run test-unit-coverage
      - name: Upload unit test coverage
        if: env.IS_DRAFT != 'true'
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-coverage
          path: ./jest-coverage
          if-no-files-found: error

  Get-Test-Groups:
    needs: Setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      test-groups: ${{ steps.set-groups.outputs.test-groups }}
      has-tests: ${{ steps.set-groups.outputs.has-tests }}
      full-matrix: ${{ steps.set-groups.outputs.full-matrix }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # Keep GitHub's merge checkout so the diff and graph match
          # the code under test.
          fetch-depth: 0
      - name: Setup pnpm and install dependencies
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: set-groups
        name: Select Cypress mock test groups
        shell: bash
        env:
          IMPACT_BASE: >-
            ${{ github.event.pull_request.base.sha || github.event.before }}
          IMPACT_HEAD: ${{ github.sha }}
        run: |
          node scripts/cypress/plan-mock-test-impact.js \
            --base "$IMPACT_BASE" \
            --head "$IMPACT_HEAD" \
            --matrix "$RUNNER_TEMP/cypress-mock-matrix.json" \
            --scope "$RUNNER_TEMP/cypress-mock-scope.txt"

          TEST_GROUPS=$(jq -c . "$RUNNER_TEMP/cypress-mock-matrix.json")
          SELECTED_GROUPS=$(jq 'length' "$RUNNER_TEMP/cypress-mock-matrix.json")
          HAS_TESTS=$([[ "$SELECTED_GROUPS" -gt 0 ]] && echo true || echo false)
          FULL_MATRIX=$(
            [[ "$(cat "$RUNNER_TEMP/cypress-mock-scope.txt")" == "full" ]] &&
              echo true || echo false
          )

          # GitHub rejects an empty matrix. A no-op entry keeps the
          # aggregate jobs successful.
          if [[ "$HAS_TESTS" != "true" ]]; then
            TEST_GROUPS='[{"name":"no-cypress-mock-tests","spec":""}]'
          fi

          {
            echo "test-groups=$TEST_GROUPS"
            echo "has-tests=$HAS_TESTS"
            echo "full-matrix=$FULL_MATRIX"
          } >> "$GITHUB_OUTPUT"
          echo "$TEST_GROUPS" | jq .

  Contract-Tests:
    needs: [Setup]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup pnpm and install dependencies
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26'
          cache-dependency-path: |
            packages/model-registry/upstream/bff/go.sum
            packages/gen-ai/bff/go.sum
            packages/mlflow/bff/go.sum
            packages/notebooks/upstream/workspaces/backend/go.sum
            distributions/core-bff/bff/go.sum
      - name: Install uv
        timeout-minutes: 5
        # v10.0.1
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          # Contract tests only need the uv binary on PATH; disable dependency
          # cache scanning (default **/*requirements*.txt glob traverses pnpm
          # node_modules).
          enable-cache: false
      - name: Abort if quality gate already failed
        # v7.0.1
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            const gates = data.jobs.filter((j) =>
              j.name.startsWith('Quality-Gate'),
            );
            const failed = gates.filter(j =>
              j.conclusion === 'failure' || j.conclusion === 'cancelled'
            );
            if (failed.length > 0) {
              core.setFailed(
                `Quality gate(s) failed: ${failed
                  .map((j) => j.name)
                  .join(', ')}. Skipping tests.`
              );
              return;
            }
            const status = gates.map(j =>
              `${j.name}=${j.conclusion || 'in_progress'}`
            );
            core.info(`Quality gates: ${status.join(', ')}`);
      - name: Run contract tests
        run: |
          export GITHUB_RUN_ID="$GITHUB_RUN_ID"
          export CI="true"
          pnpm run test:contract
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          CI: true
      - name: Upload contract test results
        if: always()
        run: |
          # Find and upload the most recent contract test results
          LATEST_DIR=$(find \
            packages/*/contract-tests/contract-test-results \
            distributions/*/contract-tests/contract-test-results \
            -name "ci-*" -type d 2>/dev/null | head -1)
          if [ -n "$LATEST_DIR" ] && [ -d "$LATEST_DIR" ]; then
            echo "Uploading from: $LATEST_DIR"
            echo "results-dir=$LATEST_DIR" >> "$GITHUB_OUTPUT"
          else
            echo "No results found" && echo "results-dir=" >> $GITHUB_OUTPUT
          fi
        id: upload-results
      - name: Upload artifacts
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.upload-results.outputs.results-dir != ''
        with:
          name: contract-test-results
          path: ${{ steps.upload-results.outputs.results-dir }}

  Get-Cypress-Packages:
    needs: [Setup]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      packages: ${{ steps.cypress.outputs.packages }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
          install-dependencies: 'false'
      - name: Discover Cypress packages
        id: cypress
        uses: ./.github/actions/cypress-build-restore
        with:
          mode: discover
          github-token: ${{ github.token }}

  Cypress-Setup:
    needs: [Setup, Get-Cypress-Packages, Get-Test-Groups]
    if: needs.Get-Test-Groups.outputs.has-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.Get-Cypress-Packages.outputs.packages) }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - name: Setup pnpm and install dependencies
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build and upload ${{ matrix.package.name }}
        uses: ./.github/actions/cypress-build-restore
        with:
          mode: build
          package-workspace: ${{ matrix.package.workspace }}
          package-name: ${{ matrix.package.name }}
          github-token: ${{ github.token }}

  Cypress-Mock-Tests:
    needs: [Setup, Cypress-Setup, Get-Test-Groups, Get-Cypress-Packages]
    if: >-
      ${{
        always() &&
        needs.Setup.result == 'success' &&
        needs.Get-Test-Groups.result == 'success' &&
        needs.Get-Cypress-Packages.result == 'success' &&
        (needs.Get-Test-Groups.outputs.has-tests != 'true' ||
        needs.Cypress-Setup.result == 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        test-group: ${{ fromJson(needs.Get-Test-Groups.outputs.test-groups) }}
    steps:
      - name: No Cypress mock tests selected
        if: needs.Get-Test-Groups.outputs.has-tests != 'true'
        run: |
          echo "Documentation-only change; Cypress mock tests are not required."
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        if: needs.Get-Test-Groups.outputs.has-tests == 'true'
        with:
          persist-credentials: false
      - name: Setup pnpm and install dependencies
        if: needs.Get-Test-Groups.outputs.has-tests == 'true'
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Restore Cypress builds
        if: needs.Get-Test-Groups.outputs.has-tests == 'true'
        uses: ./.github/actions/cypress-build-restore
        with:
          mode: restore
          packages: ${{ needs.Get-Cypress-Packages.outputs.packages }}
          github-token: ${{ github.token }}
      - name: Abort if quality gate already failed
        if: needs.Get-Test-Groups.outputs.has-tests == 'true'
        # v7.0.1
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner, repo, run_id: context.runId,
            });
            const gates = data.jobs.filter((j) =>
              j.name.startsWith('Quality-Gate'),
            );
            const failed = gates.filter(j =>
              j.conclusion === 'failure' || j.conclusion === 'cancelled'
            );
            if (failed.length > 0) {
              core.setFailed(
                `Quality gate(s) failed: ${failed
                  .map((j) => j.name)
                  .join(', ')}. Skipping tests.`
              );
              return;
            }
            const status = gates.map(j =>
              `${j.name}=${j.conclusion || 'in_progress'}`
            );
            core.info(`Quality gates: ${status.join(', ')}`);
      - name: Run Cypress Mock tests
        if: needs.Get-Test-Groups.outputs.has-tests == 'true'
        env:
          CYPRESS_SPEC: ${{ matrix.test-group.spec }}
        run: |
          export CYPRESS_SPEC="../packages/${CYPRESS_SPEC}"
          pnpm run test:cypress-ci:coverage:nobuild
        working-directory: ./frontend
      - name: Test group name
        if: ${{ always() && needs.Get-Test-Groups.outputs.has-tests == 'true' }}
        env:
          TEST_GROUP_RAW: ${{ matrix.test-group.name }}
        run: |
          test_group_name=$(echo "$TEST_GROUP_RAW" | tr '/-' '_')
          echo "TEST_GROUP_NAME=$test_group_name" >> "$GITHUB_ENV"
      - name: Upload Cypress Mock results
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && needs.Get-Test-Groups.outputs.has-tests == 'true' }}
        with:
          name: cypress-results-${{ env.TEST_GROUP_NAME }}
          path: ./packages/cypress/results/mocked
      - name: Upload Cypress coverage
        if: >-
          ${{ env.IS_DRAFT != 'true' &&
          needs.Get-Test-Groups.outputs.has-tests == 'true' }}
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cypress-coverage-${{ env.TEST_GROUP_NAME }}
          path: ./packages/cypress/coverage

  Combine-Results-and-Upload:
    needs: [Unit-Tests, Cypress-Mock-Tests, Get-Test-Groups]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Setup pnpm
        uses: ./.github/actions/pnpm-setup
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download all artifacts
        if: env.IS_DRAFT != 'true'
        # v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: all-artifacts
      # nyc is a root devDependency and is installed by the pnpm setup step.
      - name: Prepare unit coverage
        if: env.IS_DRAFT != 'true'
        run: |
          mkdir -p ./unit-coverage
          cp all-artifacts/unit-coverage/coverage-final.json \
            ./unit-coverage/coverage-final.json || true
      - name: Upload unit coverage to Codecov
        if: env.IS_DRAFT != 'true'
        # v4.6.0
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: unit
          name: unit-tests
          file: ./unit-coverage/coverage-final.json
          disable_search: true
          verbose: true

      - name: Merge Cypress coverage reports
        if: >-
          ${{ env.IS_DRAFT != 'true' &&
          needs.Get-Test-Groups.outputs.has-tests == 'true' }}
        run: |
          mkdir -p ./cypress-coverage
          find all-artifacts -name "cypress-coverage-*" -type d | \
            while read dir; do
            group_name=$(basename "$dir")
            if [ -f "$dir/coverage-final.json" ]; then
              cp "$dir/coverage-final.json" \
                "./cypress-coverage/${group_name}-coverage-final.json"
            fi
          done
          echo "Cypress coverage files:"
          ls -la ./cypress-coverage/
          pnpm exec nyc merge ./cypress-coverage \
            ./cypress-coverage/merged-cypress-coverage.json
      - name: Upload Cypress mock coverage to Codecov
        if: >-
          ${{ env.IS_DRAFT != 'true' &&
          needs.Get-Test-Groups.outputs.full-matrix == 'true' }}
        # v4.6.0
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          flags: cypress-mock
          name: cypress-mock-tests
          file: ./cypress-coverage/merged-cypress-coverage.json
          disable_search: true
          verbose: true

      - name: Combine all coverage reports
        if: env.IS_DRAFT != 'true'
        run: |
          mkdir -p ./coverage
          cp ./unit-coverage/coverage-final.json \
            ./coverage/unit-coverage-final.json || true
          cp ./cypress-coverage/merged-cypress-coverage.json \
            ./coverage/cypress-coverage-final.json || true
          pnpm exec nyc merge ./coverage ./coverage/merged-coverage.json
          jq 'del(.[] | select(.statementMap == {}))' \
            ./coverage/merged-coverage.json > ./coverage/cleaned-coverage.json
          mv ./coverage/cleaned-coverage.json ./coverage/merged-coverage.json
      - name: Generate coverage report
        if: env.IS_DRAFT != 'true'
        run: |
          mkdir -p ./coverage/report
          pnpm exec nyc report \
            --reporter=html \
            --reporter=text-summary \
            --temp-directory ./coverage \
            -t ./coverage \
            --report-dir ./coverage/report
      - name: Upload combined results
        if: env.IS_DRAFT != 'true'
        # v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: combined-coverage-results
          path: ./coverage/merged-coverage.json

  Tests:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - Quality-Gate
      - Unit-Tests
      - Contract-Tests
      - Cypress-Mock-Tests
      - Combine-Results-and-Upload
    steps:
      - name: Check for failures
        run: |
          if [[ "${{
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled') ||
            contains(needs.*.result, 'skipped')
          }}" == "true" ]]; then
            echo "Required test jobs failed, were cancelled, or were skipped."
            exit 1
          fi
          echo "Required jobs passed for Node.js ${{ env.NODE_VERSION }}."
