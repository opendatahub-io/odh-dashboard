# Adds Fullsend review detail to MLflow traces after each review finishes.
#
# Fullsend on Pi only exports run / sandbox / agent spans. This workflow reads the
# run's `fullsend-review` artifact and sends extra spans under the same trace ID:
# one per review sub-agent (model, cost, tokens, files read), one per tool call,
# guidance coverage for the PR, and the review result. See
# .fullsend/scripts/trace-bridge.py.
#
# It runs after the review, outside it, so a telemetry failure can never break a
# review. The artifact is untrusted (the sandbox read PR code): it is only parsed
# as JSON by the script and never executed or interpolated into a shell. No PR
# code is checked out; the guidance list is computed from the default branch.
#
# Setup (both are needed, the workflow is a no-op without the variable):
#   repo variable  FULLSEND_TRACE_OTLP_ENDPOINT  e.g. https://<mlflow>/v1/traces
#   repo secret    FULLSEND_TRACE_OTLP_HEADERS   e.g.
#                  Authorization=Basic%20<b64>,x-mlflow-experiment-id=<id>
# RHOAI MLflow (3.17+) serves everything under /mlflow: use
# https://<route>/mlflow/v1/traces, a Bearer token for a service account that can
# `update` experiments.mlflow.kubeflow.org, and add X-MLFLOW-WORKSPACE=<namespace>.
# Leave Fullsend's own OTEL_EXPORTER_OTLP_TRACES_ENDPOINT unset: this workflow
# re-sends the run / agent spans itself. If that variable is set later, add
# --no-base-spans below.
#
# Backfill: run this workflow manually with a past Fullsend run ID (artifacts
# are kept 90 days). If the trace is already in MLflow without the bridge marker
# (an earlier export was partial or lost its marker), the run stops; check the
# trace, then rerun manually with recover=mark-only (spans complete) or
# recover=resend (resend all spans; already accepted ones count twice).
name: fullsend-trace

on:
  workflow_run:
    workflows: [fullsend]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Fullsend workflow run ID to trace
        required: true
      recover:
        description: Recovery for a trace already in MLflow without the bridge marker
        type: choice
        options: [none, mark-only, resend]
        default: none

permissions: {}

concurrency:
  group: fullsend-trace-${{ github.event.workflow_run.id || inputs.run_id }}
  cancel-in-progress: false

jobs:
  trace:
    if: >-
      vars.FULLSEND_TRACE_OTLP_ENDPOINT != ''
      && (github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'success'
          || github.event.workflow_run.conclusion == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            .claude/rules
            .fullsend/scripts
            docs/adr
            packages/*/docs/adr
          sparse-checkout-cone-mode: false

      - name: Download review artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::run_id must be numeric"; exit 1; }
          dest="$RUNNER_TEMP/artifact"
          mkdir -p "$dest"
          # Only a confirmed absence is a no-op; API and download errors fail the job so
          # telemetry is not silently lost.
          count=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --paginate \
            --jq '[.artifacts[] | select(.name == "fullsend-review" and .expired == false)] | length' \
            | awk '{n += $1} END {print n + 0}')
          if [[ "$count" == 0 ]]; then
            echo "::notice::Run $RUN_ID has no fullsend-review artifact (not a review run); nothing to trace."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh run download "$RUN_ID" -R "$REPO" -n fullsend-review -D "$dest"
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "dir=$dest" >> "$GITHUB_OUTPUT"
          echo "run_url=https://github.com/$REPO/actions/runs/$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Resolve PR files, author and applicable guidance
        id: pr
        if: steps.artifact.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ART: ${{ steps.artifact.outputs.dir }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          set -euo pipefail
          result=$(find "$ART" -path '*/output/agent-result.json' | sort | tail -1)
          # The result file is written in the sandbox and may be malformed (e.g. a failed run):
          # read it defensively so the bridge still runs and exports the run without metadata.
          field() { jq -r --arg k "$1" 'if type == "object" then (.[$k] // empty | tostring) else empty end' "$result" 2>/dev/null || true; }
          # Same range build() in trace-bridge.py accepts: a JSON integer from 1 to 10^9 - 1.
          pr=""
          [[ -n "$result" ]] && pr=$(jq -r 'if type == "object" and (.pr_number | type) == "number"
            and .pr_number == (.pr_number | floor) and .pr_number > 0 and .pr_number < 1000000000
            then .pr_number else empty end' "$result" 2>/dev/null || true)
          if [[ ! "$pr" =~ ^[1-9][0-9]{0,8}$ ]]; then
            echo "::warning::No valid PR number in the artifact; tracing without PR metadata."
            exit 0
          fi
          # PR metadata is optional: an API failure loses it, but the spans are still sent.
          if ! meta=$(gh api "repos/$REPO/pulls/$pr" --jq '"\(.user.login) \(.head.sha)"'); then
            echo "::warning::PR lookup failed; tracing without PR metadata."
            exit 0
          fi
          author=${meta% *}
          current_head=${meta#* }
          head_sha=$(field head_sha)
          # Coverage is scored against the files of the reviewed commit. The PR files API
          # only shows the current head, so coverage is omitted once the PR has moved on
          # (a later push, or a backfill of an older review).
          files=""
          if [[ "$head_sha" =~ ^[0-9a-f]{40}$ && "$head_sha" == "$current_head" ]]; then
            files="$RUNNER_TEMP/pr-files.txt"
            if ! gh api --paginate "repos/$REPO/pulls/$pr/files" --jq '.[].filename' > "$files"; then
              echo "::warning::PR files lookup failed; tracing without guidance coverage."
              files=""
            fi
          else
            echo "::notice::PR head moved past the reviewed commit; tracing without guidance coverage."
          fi
          # agent-result.json may lack the verdict: the host post-script decides it after
          # the artifact is captured. Fall back to the Fullsend bot's review of that commit
          # submitted while this run was running (between its start and its last update).
          # Zero or several candidates is ambiguous, so the verdict is then left out. The
          # bridge ignores the fallback when the artifact has an action.
          verdict=""
          window=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '"\(.run_started_at // .created_at) \(.updated_at)"') \
            || { echo "::warning::Run lookup failed; tracing without the review verdict fallback."; window=""; }
          started=${window% *}
          finished=${window#* }
          ts='^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9:]{8}Z$'
          if [[ "$head_sha" =~ ^[0-9a-f]{40}$ && "$started" =~ $ts && "$finished" =~ $ts ]]; then
            states=$(gh api --paginate "repos/$REPO/pulls/$pr/reviews" \
              --jq ".[] | select(.commit_id == \"$head_sha\" and .user.type == \"Bot\" and .user.login == \"fullsend-ai-review[bot]\" and .submitted_at >= \"$started\" and .submitted_at <= \"$finished\") | .state") \
              || { echo "::warning::Review lookup failed; tracing without the review verdict fallback."; states=""; }
            state=""
            [[ $(printf '%s\n' "$states" | grep -c .) -eq 1 ]] && state=$states
            case "$state" in
              APPROVED) verdict=approve ;;
              CHANGES_REQUESTED) verdict=request-changes ;;
              COMMENTED) verdict=comment ;;
            esac
          fi
          # Guidance coverage needs the repo-guidance selector; without it the trace
          # is sent without coverage.
          selector=.fullsend/scripts/fetch-guidance-context.sh
          if [[ -z "$files" ]]; then
            :
          elif [[ -f "$selector" ]]; then
            FULLSEND_ADAPTER_REPO_DIR="$GITHUB_WORKSPACE" FULLSEND_ADAPTER_PR_FILES="$files" \
              bash "$selector" "$RUNNER_TEMP/guidance.json" \
              || echo "::warning::Guidance selection failed; tracing without coverage."
          else
            echo "::notice::$selector not found; tracing without guidance coverage."
          fi
          # Explicit ifs: an `a && b` as the last command would fail the step when a is false.
          echo "author=$author" >> "$GITHUB_OUTPUT"
          if [[ -n "$files" ]]; then echo "files=$files" >> "$GITHUB_OUTPUT"; fi
          if [[ -n "$verdict" ]]; then echo "verdict=$verdict" >> "$GITHUB_OUTPUT"; fi
          if [[ -s "$RUNNER_TEMP/guidance.json" ]]; then
            echo "guidance=$RUNNER_TEMP/guidance.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Send spans
        if: steps.artifact.outputs.found == 'true'
        env:
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${{ vars.FULLSEND_TRACE_OTLP_ENDPOINT }}
          OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.FULLSEND_TRACE_OTLP_HEADERS }}
          ART: ${{ steps.artifact.outputs.dir }}
          RUN_URL: ${{ steps.artifact.outputs.run_url }}
          PR_FILES: ${{ steps.pr.outputs.files }}
          PR_AUTHOR: ${{ steps.pr.outputs.author }}
          GUIDANCE: ${{ steps.pr.outputs.guidance }}
          VERDICT: ${{ steps.pr.outputs.verdict }}
          RECOVER: ${{ inputs.recover }}
        run: |
          set -euo pipefail
          args=(--artifact "$ART" --run-url "$RUN_URL")
          [[ -n "$PR_FILES" ]] && args+=(--pr-files "$PR_FILES")
          [[ -n "$PR_AUTHOR" ]] && args+=(--pr-author "$PR_AUTHOR")
          [[ -n "$GUIDANCE" ]] && args+=(--guidance "$GUIDANCE")
          [[ -n "$VERDICT" ]] && args+=(--verdict "$VERDICT")
          case "$RECOVER" in
            mark-only) args+=(--mark-only) ;;
            resend) args+=(--force) ;;
          esac
          python3 -I .fullsend/scripts/trace-bridge.py "${args[@]}"
