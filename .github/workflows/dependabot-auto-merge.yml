name: Dependabot Auto-merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'opendatahub-io/odh-dashboard'
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3

      - name: Check for upstream changes
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          all_files=$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" \
            --paginate -q '.[].filename')
          upstream_files=$(echo "$all_files" | grep '/upstream/' || true)

          if [ -z "$all_files" ]; then
            echo "::error::Failed to fetch PR files — treating as unsafe"
            echo "touches_upstream=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$upstream_files" ]; then
            echo "PR modifies upstream files:"
            echo "$upstream_files"
            echo "touches_upstream=true" >> "$GITHUB_OUTPUT"
          else
            echo "No upstream files modified"
            echo "touches_upstream=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Close upstream PRs
        if: steps.upstream.outputs.touches_upstream == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Closing PR that modifies upstream-synced files"
          gh pr close "$PR_URL" --comment "$(cat <<'EOF'
          Closing: this PR modifies files under `/upstream/` which are managed by
          [upstream-sync](https://github.com/opendatahub-io/odh-dashboard/tree/main/.claude/skills/upstream-sync).
          Security fixes for these dependencies should be addressed in the upstream
          repository and synced back. The security alert remains visible in the
          Security tab for tracking.
          EOF
          )"
          echo "::notice::Upstream PR closed"

      - name: Checkout base branch for version checks
        if: >
          steps.upstream.outputs.touches_upstream != 'true' &&
          steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
          steps.metadata.outputs.previous-version == ''
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            **/package-lock.json
            **/go.sum
          sparse-checkout-cone-mode: false

      - name: Check for pre-1.0 packages in grouped PRs
        id: pre1
        if: >
          steps.upstream.outputs.touches_upstream != 'true' &&
          steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
          steps.metadata.outputs.previous-version == ''
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          DEP_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          has_pre1=false

          if [ "$ECOSYSTEM" = "npm_and_yarn" ]; then
            for dep in $(echo "$DEP_NAMES" | tr ',' '\n' | sed 's/^ *//;s/ *$//'); do
              for lockfile in $(find . -name package-lock.json -not -path '*/node_modules/*' -not -path '*/upstream/*'); do
                is_pre1=$(jq --arg d "$dep" '
                  [.packages | to_entries[]
                   | select((.key | endswith("node_modules/" + $d)) and (.value.version != null))
                   | .value.version]
                  | any(startswith("0."))
                ' "$lockfile" 2>/dev/null || echo "false")
                if [ "$is_pre1" = "true" ]; then
                  echo "Pre-1.0 package detected in group: $dep in $lockfile"
                  has_pre1=true
                  break 2
                fi
              done
            done
          elif [ "$ECOSYSTEM" = "go_modules" ]; then
            for dep in $(echo "$DEP_NAMES" | tr ',' '\n' | sed 's/^ *//;s/ *$//'); do
              for gosum in $(find . -name go.sum -not -path '*/upstream/*'); do
                ver=$(awk -v dep="$dep" '$1 == dep { print $2; exit }' "$gosum")
                if [ -n "$ver" ] && echo "$ver" | grep -q '^v0\.'; then
                  echo "Pre-1.0 Go module detected in group: $dep ($ver) in $gosum"
                  has_pre1=true
                  break 2
                fi
              done
            done
          fi

          echo "has_pre1=$has_pre1" >> "$GITHUB_OUTPUT"

      - name: Check eligibility
        id: check
        env:
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PREV_VERSION: ${{ steps.metadata.outputs.previous-version }}
          TOUCHES_UPSTREAM: ${{ steps.upstream.outputs.touches_upstream }}
          HAS_PRE1_IN_GROUP: ${{ steps.pre1.outputs.has_pre1 }}
        run: |
          if [ "$TOUCHES_UPSTREAM" = "true" ]; then
            echo "Not eligible: PR modifies upstream files"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          elif [ "$ECOSYSTEM" != "npm_and_yarn" ] && [ "$ECOSYSTEM" != "go_modules" ]; then
            echo "Not eligible: ecosystem=$ECOSYSTEM"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          elif [ "$UPDATE_TYPE" = "version-update:semver-patch" ]; then
            echo "Eligible: patch update"
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          elif [ "$UPDATE_TYPE" = "version-update:semver-minor" ]; then
            if [ -n "$PREV_VERSION" ] && echo "$PREV_VERSION" | grep -q '^0\.'; then
              echo "Not eligible: minor update on pre-1.0 package ($PREV_VERSION)"
              echo "eligible=false" >> "$GITHUB_OUTPUT"
            elif [ "$HAS_PRE1_IN_GROUP" = "true" ]; then
              echo "Not eligible: grouped PR contains pre-1.0 package(s)"
              echo "eligible=false" >> "$GITHUB_OUTPUT"
            else
              echo "Eligible: minor update (stable package)"
              echo "eligible=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Not eligible: update-type=$UPDATE_TYPE"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply merge labels
        if: steps.check.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Adding lgtm and approved labels to $PR_URL"
          gh pr edit "$PR_URL" --add-label "lgtm,approved"
          echo "::notice::Labels applied successfully"

      - name: Summary
        env:
          DEPS: ${{ steps.metadata.outputs.dependency-names }}
          ECOSYSTEM: ${{ steps.metadata.outputs.package-ecosystem }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PREV_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          ELIGIBLE: ${{ steps.check.outputs.eligible }}
          TOUCHES_UPSTREAM: ${{ steps.upstream.outputs.touches_upstream }}
        run: |
          if [ "$ELIGIBLE" = "true" ]; then
            echo "### ✅ Auto-merge labels applied" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$TOUCHES_UPSTREAM" = "true" ]; then
            echo "### 🚫 Closed — PR modifies upstream (subtree) files" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "### ⏭️ Skipped — not eligible for auto-merge" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "- **Ecosystem:** \`$ECOSYSTEM\`" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- **Update type:** \`$UPDATE_TYPE\`" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "- **Dependencies:** \`$DEPS\`" | tee -a "$GITHUB_STEP_SUMMARY"

          if ! echo "$DEPS" | grep -q ","; then
            echo "- **Version:** \`$PREV_VERSION\` → \`$NEW_VERSION\`" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
