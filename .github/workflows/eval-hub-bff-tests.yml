name: Test / EvalHub BFF Tests
on:
  push:
    branches: [main, 'odh-release*', 'rhoai-release*', '*-release', 'v*-fixes', 'v*-hotfix']
    paths:
      - 'packages/eval-hub/**'
      - '!LICENSE*'
      - '!DOCKERFILE*'
      - '!**.gitignore'
      - '!**.md'

  pull_request:
    paths:
      - 'packages/eval-hub/**'
      - '.github/workflows/eval-hub-bff-tests.yml'
      - '!LICENSE*'
      - '!DOCKERFILE*'
      - '!**.gitignore'
      - '!**.md'

jobs:
  test:
    name: EvalHub BFF Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.x'

      - name: Lint
        working-directory: packages/eval-hub/bff
        run: make lint

      - name: Build (BFF)
        working-directory: packages/eval-hub/bff
        run: make build

      - name: Check if there are uncommitted file changes
        working-directory: packages/eval-hub
        run: |
          clean=$(git status --porcelain)
          if [[ -z "$clean" ]]; then
              echo "Empty git status --porcelain: $clean"
          else
              echo "Uncommitted file changes detected: $clean"
              git diff
              exit 1
          fi
