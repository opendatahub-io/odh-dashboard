name: Fullsend scripts test

# Runs the unit tests for the Jira code pilot's dispatch script and workflow
# contracts (.fullsend/scripts/tests/test_jira_dispatch.py). No network calls,
# no secrets.

on:
  pull_request:
    paths:
      - ".fullsend/scripts/**"
      - ".github/workflows/fullsend-poll-jira.yaml"
      - ".github/workflows/fullsend-code-jira.yaml"
      - ".github/workflows/fullsend-scripts-test.yaml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.15"

      - name: Install test dependencies
        run: python -m pip install "PyYAML==6.0.3"

      - name: Run Jira dispatch tests
        run: python .fullsend/scripts/tests/test_jira_dispatch.py -v
