# Based on the Fullsend-managed scaffold. Local changes: the review/fix event
# filter on `dispatch`, the host-adapter credentials composed into
# FULLSEND_GITHUB_RUNNER_SECRETS, and the `stop-fix` job. Keep it in sync with
# the upstream scaffold when Fullsend is upgraded.
# Upstream: https://github.com/fullsend-ai/fullsend/blob/main/internal/scaffold/fullsend-repo/templates/shim-per-repo.yaml
---
# fullsend shim workflow (per-repo installation mode)
# Routes events to agent workflows via reusable-dispatch.yml.
# All agent execution happens in this repo's context — no external
# config repo is needed.
#
# Security: pull_request_target runs the BASE branch version of this workflow,
# preventing PRs from modifying it to exfiltrate credentials.
# The dispatch shim never checks out PR code. The CodeRabbit and Jira host
# adapters run inside the review job's pre-script (.fullsend/scripts/
# pre-review.sh); their credentials reach it through env.runner and never
# enter the sandbox (ADR 0136).
#
# Routing: this shim forwards the raw event context to reusable-dispatch.yml,
# which determines the stage and runs the agent inline (ADR 62).
# Adding a new stage requires only a job in reusable-dispatch.yml — zero changes to this repo.
#
# Concurrency: per-role cancel-in-progress groups live in reusable-dispatch.yml
# stage jobs with -agent- suffix. Roles operate independently (#2452).
# Do not add workflow-level cancel-in-progress here: job `if` runs after the
# concurrency group is assigned, so label/review/comment noise would still
# queue a run, cancel an in-flight review, then skip every job.
name: fullsend

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, ready_for_review, closed, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  dispatch:
    # Admit only the events a stage acts on, so unrelated labels or bot reviews
    # do not burn a Route run. Review: non-draft open/sync/ready, the
    # `ready-for-review` label, or `/fs-review`. Fix: a `changes_requested`
    # review or `/fs-fix`.
    if: >-
      (github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review'
       || github.event.pull_request.head.ref != 'fullsend/scaffold-install')
      && (
        (github.event_name == 'pull_request_target'
         && github.event.pull_request.draft == false
         && (github.event.action == 'opened'
          || github.event.action == 'synchronize'
          || github.event.action == 'ready_for_review'
          || (github.event.action == 'labeled'
           && github.event.label.name == 'ready-for-review')))
        || (github.event_name == 'pull_request_review'
         && github.event.review.state == 'changes_requested')
        || (github.event_name == 'issue_comment'
         && github.event.issue.pull_request
         && github.event.comment.user.type != 'Bot'
         && (github.event.comment.body == '/fs-review'
          || (startsWith(github.event.comment.body, '/fs-fix')
           && !startsWith(github.event.comment.body, '/fs-fix-stop'))))
      )
    permissions:
      actions: write
      id-token: write
      contents: write
      issues: write
      packages: read
      pull-requests: write
    # Keep in step with the sandbox image pinned in .fullsend/harness/review.yaml
    # (same release, Pi 1.3.0).
    # The harness base names built-in providers that only v0.45.0 onward
    # resolves, so this pin and the base pin move together. v0.48.0 is the
    # first release that declares FULLSEND_GITHUB_RUNNER_SECRETS (ADR 0136).
    # Temporary pin past v0.48.1 for fullsend#8544 (cb06ac392): v0.48 escapes
    # the review-findings-v2 marker, so every re-review ran as a first review.
    # Revert to a released tag when v0.48.2+ ships it.
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@af8cd4756172ec105c3aa523515c9c7d51684e90 # fullsend#8544 (post-v0.48.1)
    with:
      event_action: ${{ github.event.action }}
      install_mode: per-repo
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      project_number: ${{ vars.FULLSEND_PROJECT_NUMBER }}
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      FULLSEND_OPENAI_API_KEY: ${{ secrets.FULLSEND_OPENAI_API_KEY }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USERNAME }}
      # Host-adapter credentials for the review pre-script, as the JSON object
      # ADR 0136 defines. .fullsend/harness/review.yaml references each name in
      # env.runner; unreferenced names reach no script. It is composed here from
      # the existing per-integration secrets, so each one still rotates on its
      # own. Rules this expression follows:
      # - An empty value is refused by `fullsend run` and fails the review, so
      #   each entry is added only when its secret is set. The fixed first entry
      #   keeps the object valid when none is.
      # - Each value goes through toJSON(), which quotes and escapes it, so a
      #   secret holding `"`, `\` or a newline still yields a valid object.
      # - JIRA_TOKEN, JIRA_USER_EMAIL and JIRA_BASE_URL are refused names: the
      #   reusable workflow sets them itself on harness-run.
      FULLSEND_GITHUB_RUNNER_SECRETS: >-
        ${{ format('{{"ODH_RUNNER_SECRETS_SOURCE":"odh-dashboard-fullsend-shim"{0}{1}{2}{3}}}',
        secrets.CODERABBIT_API_KEY != '' && format(',"CODERABBIT_API_KEY":{0}', toJSON(secrets.CODERABBIT_API_KEY)) || '',
        secrets.JIRA_URL != '' && format(',"JIRA_URL":{0}', toJSON(secrets.JIRA_URL)) || '',
        secrets.JIRA_USERNAME != '' && format(',"JIRA_USERNAME":{0}', toJSON(secrets.JIRA_USERNAME)) || '',
        secrets.JIRA_API_TOKEN != '' && format(',"JIRA_API_TOKEN":{0}', toJSON(secrets.JIRA_API_TOKEN)) || '') }}

  stop-fix:
    # Job-level if: is intentionally coarse — it only screens for the
    # /fs-fix-stop command on a PR from a non-bot. The authoritative
    # authorization decision (collaborator permission API + PR-author escape
    # hatch) is made in the step below, so a maintainer whose author_association
    # is not MEMBER (e.g. private org membership) is not filtered out (ADR 0054).
    if: >-
      github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && github.event.comment.body == '/fs-fix-stop'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Add fullsend-no-fix label and notify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_USER_LOGIN: ${{ github.event.comment.user.login }}
          ISSUE_USER_LOGIN: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          # ADR 0054: authorize via the collaborator permission API
          # (admin|maintain|write), not author_association — the latter grants
          # contributor status to anyone with a single merged PR (issue #5421).
          # Mirrors has_repo_permission() in reusable-dispatch.yml, including the
          # custom-role --jq resolution; keep the two in sync (fullsend#7834).
          # The PR author may always stop the fix agent on their own PR.
          authorized=false
          if [[ -n "$COMMENT_USER_LOGIN" && "$COMMENT_USER_LOGIN" == "$ISSUE_USER_LOGIN" ]]; then
            authorized=true
          else
            if api_err=$(mktemp); then
              if role=$(gh api "repos/$REPO/collaborators/$COMMENT_USER_LOGIN/permission" \
                --jq '.user.permissions as $p
                  | if (.role_name | type) != "string" or .role_name == "" then "none"
                    elif (.role_name | IN("admin", "maintain", "write", "triage", "read")) then .role_name
                    elif $p == null then
                      if (.permission | IN("admin", "write", "read")) then .permission else "none" end
                    elif ($p | type) == "object" then
                      if $p.admin == true then "admin"
                      elif $p.maintain == true then "maintain"
                      elif $p.push == true then "write"
                      elif $p.triage == true then "triage"
                      elif $p.pull == true then "read"
                      else "none" end
                    else "none" end' 2>"$api_err"); then
                case "$role" in
                  admin|maintain|write) authorized=true ;;
                esac
              else
                echo "::warning::Permission API call failed for $COMMENT_USER_LOGIN: $(cat "$api_err")"
              fi
              rm -f "$api_err"
            else
              echo "::warning::Failed to create temp file for permission check of $COMMENT_USER_LOGIN"
            fi
          fi
          if [[ "$authorized" != "true" ]]; then
            echo "::notice::User $COMMENT_USER_LOGIN is not authorized to stop the fix agent (requires write access or PR authorship)"
            exit 0
          fi
          gh label create "fullsend-no-fix" --repo "$REPO" \
            --description "Skip bot-triggered fix agent runs" --color "FBCA04" \
            --force 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" \
            --add-label "fullsend-no-fix"
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "Fix agent disabled for this PR. Remove the \`fullsend-no-fix\` label or use \`/fs-fix\` to re-engage."
