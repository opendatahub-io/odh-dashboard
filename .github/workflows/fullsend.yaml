# Based on the Fullsend-managed scaffold, with registry-driven host-adapter
# preparation for PR reviews. Keep this extension in sync with the upstream
# scaffold when Fullsend is upgraded.
# Upstream: https://github.com/fullsend-ai/fullsend/blob/main/internal/scaffold/fullsend-repo/.github/workflows/fullsend.yaml
---
# fullsend shim workflow (per-repo installation mode)
# Routes events to agent workflows via reusable-dispatch.yml.
# All agent execution happens in this repo's context — no external
# config repo is needed.
#
# Security: pull_request_target runs the BASE branch version of this workflow,
# preventing PRs from modifying it to exfiltrate credentials.
# The dispatch shim never checks out PR code. Registered host adapters may opt
# into an isolated, credential-scoped PR checkout; only their normalized JSON
# artifacts cross into the review job.
#
# Routing: this shim forwards the raw event context to reusable-dispatch.yml,
# which determines the stage and runs the agent inline (ADR 62).
# Adding a new stage requires only a job in reusable-dispatch.yml — zero changes to this repo.
#
# Concurrency: per-role cancel-in-progress groups live in reusable-dispatch.yml
# stage jobs with -agent- suffix. Roles operate independently (#2452).
name: fullsend

on:
  issues:
    types: [opened, edited, labeled]
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, ready_for_review, closed, labeled, unlabeled]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  adapter-plan:
    name: Plan host adapters
    if: >-
      (github.event_name == 'pull_request_target'
       && contains(github.event.pull_request.labels.*.name, 'fullsend')
       && (github.event.action == 'opened'
        || github.event.action == 'synchronize'
        || github.event.action == 'ready_for_review'
        || github.event.action == 'labeled'))
      || (github.event_name == 'pull_request_review'
       && contains(github.event.pull_request.labels.*.name, 'fullsend'))
      || (github.event_name == 'issue_comment'
       && github.event.issue.pull_request
       && github.event.comment.user.type != 'Bot'
       && github.event.comment.body == '/fs-review')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.adapters.outputs.matrix }}
    steps:
      - name: Checkout trusted review integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Build adapter matrix from registry
        id: adapters
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          bash .fullsend/scripts/pre-review.sh --validate-adapters
          matrix="$(jq -c --arg pr_number "${PR_NUMBER}" '
            {
              include: [
                .dimensions[]
                | select(.kind == "cli-adapter")
                | {
                    id,
                    runner,
                    producer_file,
                    artifact_name: (.host.artifact_name | gsub("\\{pr_number\\}"; $pr_number)),
                    artifact_file: .host.artifact_file,
                    checkout_pr: .host.checkout_pr,
                    setup_runner: .host.setup_runner,
                    url_secret: .host.credentials.url_secret,
                    username_secret: .host.credentials.username_secret,
                    token_secret: .host.credentials.token_secret
                  }
              ]
            }
          ' .fullsend/dimensions.json)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  adapter-context:
    name: Prepare ${{ matrix.id }} context
    needs: adapter-plan
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.adapter-plan.outputs.matrix) }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout trusted review integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          persist-credentials: false

      - name: Resolve pull request context
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_JSON="$(gh pr view "${PR_NUMBER}" --repo "${REPO_FULL_NAME}" --json baseRefOid,headRefOid)"
          BASE_SHA="$(jq -r '.baseRefOid // empty' <<<"${PR_JSON}")"
          HEAD_SHA="$(jq -r '.headRefOid // empty' <<<"${PR_JSON}")"
          if [[ ! "${BASE_SHA}" =~ ^[0-9a-f]{40}$ || ! "${HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not resolve immutable base and head revisions for PR ${PR_NUMBER}"
            exit 1
          fi
          echo "base_sha=${BASE_SHA}" >> "${GITHUB_OUTPUT}"
          echo "head_sha=${HEAD_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Checkout pull request for adapter
        if: ${{ matrix.checkout_pr }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.revisions.outputs.head_sha }}
          path: adapter-target
          fetch-depth: 0
          persist-credentials: false

      - name: Set up adapter
        if: ${{ matrix.setup_runner != '' }}
        env:
          ADAPTER_SETUP_RUNNER: ${{ matrix.setup_runner }}
        run: bash ".fullsend/${ADAPTER_SETUP_RUNNER}"

      - name: Run registered adapter
        env:
          FULLSEND_ADAPTER_URL: ${{ secrets[matrix.url_secret] }}
          FULLSEND_ADAPTER_USERNAME: ${{ secrets[matrix.username_secret] }}
          FULLSEND_ADAPTER_TOKEN: ${{ secrets[matrix.token_secret] }}
          FULLSEND_ADAPTER_TARGET_REPO: ${{ matrix.checkout_pr && format('{0}/adapter-target', github.workspace) || '' }}
          FULLSEND_ADAPTER_BASE_SHA: ${{ steps.revisions.outputs.base_sha }}
          ADAPTER_RUNNER: ${{ matrix.runner }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REPO_FULL_NAME: ${{ github.repository }}
          EVENT_PR_BODY: ${{ github.event.pull_request.body }}
          EVENT_PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          export REVIEW_PR_TITLE="${EVENT_PR_TITLE}"
          export REVIEW_PR_BODY="${EVENT_PR_BODY}"
          if [[ -z "${REVIEW_PR_TITLE}" || -z "${REVIEW_PR_BODY}" ]]; then
            PR_JSON="$(gh pr view "${PR_NUMBER}" --repo "${REPO_FULL_NAME}" --json title,body)"
            export REVIEW_PR_TITLE="$(jq -r '.title // empty' <<<"${PR_JSON}")"
            export REVIEW_PR_BODY="$(jq -r '.body // empty' <<<"${PR_JSON}")"
          fi
          bash ".fullsend/${ADAPTER_RUNNER}"

      - name: Upload sanitized adapter output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: .fullsend/${{ matrix.producer_file }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  dispatch:
    needs: [adapter-plan, adapter-context]
    if: >-
      always()
      && (github.event_name != 'pull_request_target' && github.event_name != 'pull_request_review'
       || github.event.pull_request.head.ref != 'fullsend/scaffold-install')
      && (
        ((github.event_name == 'pull_request_target' || github.event_name == 'pull_request_review')
         && contains(github.event.pull_request.labels.*.name, 'fullsend'))
        || (github.event_name == 'issue_comment'
         && github.event.issue.pull_request
         && github.event.comment.user.type != 'Bot'
         && github.event.comment.body == '/fs-review')
      )
    permissions:
      actions: write
      id-token: write
      contents: write
      issues: write
      packages: read
      pull-requests: write
    uses: fullsend-ai/fullsend/.github/workflows/reusable-dispatch.yml@094191b0151e3261d65ce2b032a4586654eb44ab # v0.41.0
    with:
      event_action: ${{ github.event.action }}
      install_mode: per-repo
      mint_url: ${{ vars.FULLSEND_MINT_URL }}
      gcp_region: ${{ vars.FULLSEND_GCP_REGION }}
      project_number: ${{ vars.FULLSEND_PROJECT_NUMBER }}
      jira_base_url: ${{ vars.JIRA_BASE_URL }}
      runner_image: ubuntu-24.04
    secrets:
      FULLSEND_GCP_WIF_PROVIDER: ${{ secrets.FULLSEND_GCP_WIF_PROVIDER }}
      FULLSEND_GCP_PROJECT_ID: ${{ secrets.FULLSEND_GCP_PROJECT_ID }}
      OTEL_EXPORTER_OTLP_TRACES_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_TRACES_HEADERS }}
      OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}
      JIRA_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      JIRA_USER_EMAIL: ${{ secrets.JIRA_USERNAME }}

  stop-fix:
    # Job-level if: is intentionally coarse — it only screens for the
    # /fs-fix-stop command on a PR from a non-bot. The authoritative
    # authorization decision (collaborator permission API + PR-author escape
    # hatch) is made in the step below, so a maintainer whose author_association
    # is not MEMBER (e.g. private org membership) is not filtered out (ADR 0054).
    if: >-
      github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type != 'Bot'
        && github.event.comment.body == '/fs-fix-stop'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Add fullsend-no-fix label and notify
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
          COMMENT_USER_LOGIN: ${{ github.event.comment.user.login }}
          ISSUE_USER_LOGIN: ${{ github.event.issue.user.login }}
        run: |
          set -euo pipefail
          # ADR 0054: authorize via the collaborator permission API
          # (admin|maintain|write), not author_association — the latter grants
          # contributor status to anyone with a single merged PR (issue #5421).
          # Mirrors has_repo_permission() in dispatch.yml; keep the two in sync.
          # The PR author may always stop the fix agent on their own PR.
          authorized=false
          if [[ -n "$COMMENT_USER_LOGIN" && "$COMMENT_USER_LOGIN" == "$ISSUE_USER_LOGIN" ]]; then
            authorized=true
          else
            if api_err=$(mktemp); then
              if role=$(gh api "repos/$REPO/collaborators/$COMMENT_USER_LOGIN/permission" \
                --jq '.role_name' 2>"$api_err"); then
                case "$role" in
                  admin|maintain|write) authorized=true ;;
                esac
              else
                echo "::warning::Permission API call failed for $COMMENT_USER_LOGIN: $(cat "$api_err")"
              fi
              rm -f "$api_err"
            else
              echo "::warning::Failed to create temp file for permission check of $COMMENT_USER_LOGIN"
            fi
          fi
          if [[ "$authorized" != "true" ]]; then
            echo "::notice::User $COMMENT_USER_LOGIN is not authorized to stop the fix agent (requires write access or PR authorship)"
            exit 0
          fi
          gh label create "fullsend-no-fix" --repo "$REPO" \
            --description "Skip bot-triggered fix agent runs" --color "FBCA04" \
            --force 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --repo "$REPO" \
            --add-label "fullsend-no-fix"
          gh pr comment "$PR_NUMBER" --repo "$REPO" \
            --body "Fix agent disabled for this PR. Remove the \`fullsend-no-fix\` label or use \`/fs-fix\` to re-engage."
