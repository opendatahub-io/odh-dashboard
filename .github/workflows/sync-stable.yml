name: Fast-forward stable to main

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: stable-ff-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fast-forward:
    runs-on: ubuntu-latest

    steps:
      - name: Check stable branch exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${{ github.repository }}/branches/stable" --silent 2>/dev/null; then
            echo "ERROR: Branch 'stable' does not exist. Skipping sync."
            exit 1
          fi
          echo "Branch 'stable' exists."

      - name: Checkout stable
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: stable
          fetch-depth: 0

      - name: Fast-forward stable to main
        run: |
          git fetch origin main

          echo "stable before: $(git rev-parse HEAD)"
          echo "main target:   $(git rev-parse origin/main)"

          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse origin/main)" ]]; then
            echo "No changes — stable is already up to date with main"
            exit 0
          fi

          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "ERROR: Cannot fast-forward. stable has diverged from main."
            echo "Manual intervention required."
            exit 1
          fi

          git merge --ff-only origin/main
          echo "stable after:  $(git rev-parse HEAD)"
          git push origin stable
          echo "Fast-forwarded stable to main"
