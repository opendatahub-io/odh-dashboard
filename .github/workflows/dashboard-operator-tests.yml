name: Test / Dashboard Operator Tests
on:
  push:
    branches: [main, 'odh-release*', 'rhoai-release*', '*-release', 'v*-fixes', 'v*-hotfix']
    paths:
      - 'dashboard-operator/**'
      - 'manifests/**'
      - '!LICENSE*'
      - '!DOCKERFILE*'
      - '!**.gitignore'
      - '!**.md'

  pull_request:
    paths:
      - 'dashboard-operator/**'
      - 'manifests/**'
      - '.github/workflows/dashboard-operator-tests.yml'
      - '!LICENSE*'
      - '!DOCKERFILE*'
      - '!**.gitignore'
      - '!**.md'

jobs:
  test:
    name: Dashboard Operator Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.1

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: dashboard-operator/go.mod

      - name: Install Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4

      - name: Install promtool
        run: |
          archive="$RUNNER_TEMP/prometheus-3.0.1.linux-amd64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/prometheus/prometheus/releases/download/v3.0.1/prometheus-3.0.1.linux-amd64.tar.gz \
            --output "$archive"
          echo "43f6f228ef59e0c2f6994e489c5c76c6671553eaa99ded0aea1cd31366222916  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" prometheus-3.0.1.linux-amd64/promtool
          echo "$RUNNER_TEMP/prometheus-3.0.1.linux-amd64" >> "$GITHUB_PATH"

      - name: Lint
        working-directory: dashboard-operator
        run: make lint

      - name: Build
        working-directory: dashboard-operator
        run: make build

      - name: Test
        working-directory: dashboard-operator
        env:
          REQUIRE_PROMTOOL: "true"
        run: make test

      # Cache the envtest Kubernetes binary assets (kube-apiserver, etcd, kubectl)
      # downloaded by `make setup-envtest` into dashboard-operator/bin/k8s. The download
      # is the slow part of the integration step; the tests themselves run in seconds.
      # Keyed on the Makefile so a change to the pinned envtest/K8s version busts the cache.
      - name: Cache envtest binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: dashboard-operator/bin/k8s
          key: envtest-${{ runner.os }}-${{ hashFiles('dashboard-operator/Makefile') }}
          restore-keys: |
            envtest-${{ runner.os }}-

      - name: Integration tests (envtest)
        working-directory: dashboard-operator
        run: make test-integration

      - name: Validate Helm chart
        working-directory: dashboard-operator
        run: make chart-validate

      - name: Check if there are uncommitted file changes
        working-directory: dashboard-operator
        run: |
          clean=$(git status --porcelain)
          if [[ -z "$clean" ]]; then
              echo "Empty git status --porcelain: $clean"
          else
              echo "Uncommitted file changes detected: $clean"
              git diff
              exit 1
          fi
