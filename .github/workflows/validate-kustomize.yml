name: Validate manifests with Kustomize

on:
  push:
    paths:
      - 'manifests/**'
      - 'distributions/**'
  pull_request:
    paths:
      - 'manifests/**'
      - 'distributions/**'
  workflow_dispatch: {}

concurrency:
  group: kustomize-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kustomize-build:
    name: Build ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pin the kustomize version and expose it to steps and cache key
      KUSTOMIZE_VERSION: v5.4.1
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: RHOAI
            path: manifests/rhoai
          - name: ODH
            path: manifests/odh
          - name: Modules
            path: manifests/modules
          - name: MaaS Consumer Portal
            path: manifests/distributions/maas-consumer-portal
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            manifests
            distributions

      - name: Cache kustomize
        id: cache-kustomize
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/kustomize/${{ env.KUSTOMIZE_VERSION }}
          key: kustomize-${{ runner.os }}-${{ env.KUSTOMIZE_VERSION }}

      - name: Install kustomize
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_DIR="$HOME/.cache/kustomize/${KUSTOMIZE_VERSION}"
          mkdir -p "$INSTALL_DIR"
          if [ ! -x "$INSTALL_DIR/kustomize" ]; then
            echo "Downloading kustomize ${KUSTOMIZE_VERSION}"
            curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused -o /tmp/kustomize.tar.gz \
              "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
            tar -xzf /tmp/kustomize.tar.gz -C "$INSTALL_DIR"
            chmod +x "$INSTALL_DIR/kustomize"
          else
            echo "Using cached kustomize ${KUSTOMIZE_VERSION}"
          fi
          # Add to PATH for subsequent steps
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          kustomize version

      - name: Kustomize build
        run: |
          echo "Building ${{ matrix.target.path }}"
          # Send rendered manifests to stdout sink to keep logs tidy; warnings still show on stderr.
          kustomize build "${{ matrix.target.path }}" > /dev/null
        shell: bash

  check-no-hardcoded-namespace:
    name: Check for hardcoded namespace
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            manifests

      - name: Install yq
        shell: bash
        run: |
          set -euo pipefail
          YQ_VERSION="v4.44.1"
          YQ_SHA256="6dc2d0cd4e0caca5aeffd0d784a48263591080e4a0895abe69f3a76eb50d1ba3"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum -c --strict
          install -m 0755 /tmp/yq /usr/local/bin/yq

      - name: Check for hardcoded metadata.namespace
        run: manifests/scripts/check-no-hardcoded-namespace.sh
        shell: bash
