name: Validate manifests with Kustomize

on:
  push:
    paths:
      - 'manifests/**'
      - 'distributions/**'
  pull_request:
    paths:
      - 'manifests/**'
      - 'distributions/**'
  workflow_dispatch: {}

concurrency:
  group: kustomize-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kustomize-build:
    name: Build ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    env:
      # Pin the kustomize version and expose it to steps and cache key
      KUSTOMIZE_VERSION: v5.4.1
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: RHOAI
            path: manifests/rhoai
          - name: ODH
            path: manifests/odh
          - name: RHOAI Standalone
            path: manifests/rhoai/standalone
          - name: ODH Standalone
            path: manifests/odh/standalone
          - name: Modules
            path: manifests/modules
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            manifests
            distributions

      - name: Cache kustomize
        id: cache-kustomize
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/kustomize/${{ env.KUSTOMIZE_VERSION }}
          key: kustomize-${{ runner.os }}-${{ env.KUSTOMIZE_VERSION }}

      - name: Install kustomize
        shell: bash
        run: |
          set -euo pipefail
          INSTALL_DIR="$HOME/.cache/kustomize/${KUSTOMIZE_VERSION}"
          mkdir -p "$INSTALL_DIR"
          if [ ! -x "$INSTALL_DIR/kustomize" ]; then
            echo "Downloading kustomize ${KUSTOMIZE_VERSION}"
            curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused -o /tmp/kustomize.tar.gz \
              "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/${KUSTOMIZE_VERSION}/kustomize_${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
            tar -xzf /tmp/kustomize.tar.gz -C "$INSTALL_DIR"
            chmod +x "$INSTALL_DIR/kustomize"
          else
            echo "Using cached kustomize ${KUSTOMIZE_VERSION}"
          fi
          # Add to PATH for subsequent steps
          echo "$INSTALL_DIR" >> "$GITHUB_PATH"
          kustomize version

      - name: Kustomize build
        run: |
          echo "Building ${{ matrix.target.path }}"
          # Send rendered manifests to stdout sink to keep logs tidy; warnings still show on stderr.
          kustomize build "${{ matrix.target.path }}" > /dev/null
        shell: bash

  params-env-sync:
    name: Verify params.env sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          sparse-checkout: |
            manifests

      - name: Check per-module params.env against sidecar parent
        shell: bash
        run: |
          set -euo pipefail
          PARENT="manifests/sidecar/params.env"
          if [[ ! -f "$PARENT" ]]; then
            echo "ERROR: Parent params.env not found at $PARENT"
            exit 1
          fi

          FAILED=0
          for module_params in manifests/modules/*/params.env; do
            [[ -f "$module_params" ]] || continue
            MODULE_DIR=$(dirname "$module_params")
            MODULE_NAME=$(basename "$MODULE_DIR")

            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ "$line" =~ ^#.* || -z "$line" ]] && continue
              key="${line%%=*}"
              value="${line#*=}"

              # Skip keys that are module-specific (not in parent)
              parent_line=$(grep "^${key}=" "$PARENT" 2>/dev/null || true)
              [[ -n "$parent_line" ]] || continue

              parent_value="${parent_line#*=}"
              if [[ "$value" != "$parent_value" ]]; then
                echo "DRIFT: ${MODULE_NAME}/params.env key '${key}' differs from sidecar parent"
                echo "  module: ${value}"
                echo "  parent: ${parent_value}"
                FAILED=1
              fi
            done < "$module_params"
          done

          if [[ "$FAILED" -eq 1 ]]; then
            echo ""
            echo "ERROR: params.env drift detected. Run 'hack/validate-manifests.sh' locally to debug."
            exit 1
          fi

          echo "All per-module params.env files are in sync with $PARENT"
