name: Test / MaaS BFF Tests
on:
  push:
    paths:
      - "packages/maas/**"
      - ".github/workflows/maas-bff-tests.yml"
      - ".github/actions/module-caches/**"
      - "!LICENSE*"
      - "!DOCKERFILE*"
      - "!**.gitignore"
      - "!**.md"

  pull_request:
    paths:
      - "packages/maas/**"
      - ".github/workflows/maas-bff-tests.yml"
      - ".github/actions/module-caches/**"
      - "!LICENSE*"
      - "!DOCKERFILE*"
      - "!**.gitignore"
      - "!**.md"

env:
  NODE_VERSION: 22

jobs:
  bff-test:
    name: MaaS BFF Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version: "1.26.x"

      - name: Lint
        working-directory: packages/maas/bff
        run: make lint

      - name: Build (BFF)
        working-directory: packages/maas/bff
        run: make build

      - name: Test (BFF API)
        working-directory: packages/maas
        run: make test

      - name: Check if there are uncommitted file changes
        working-directory: packages/maas
        run: |
          clean=$(git status --porcelain)
          if [[ -z "$clean" ]]; then
              echo "Empty git status --porcelain: $clean"
          else
              echo "Uncommitted file changes detected: $clean"
              git diff
              exit 1
          fi

  frontend-test:
    name: MaaS Frontend Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Module caches
        uses: ./.github/actions/module-caches
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: maas node_modules cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: packages/maas/frontend/node_modules
          key: ${{ runner.os }}-${{ env.NODE_VERSION }}-modules-maas-${{ hashFiles('packages/maas/frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ env.NODE_VERSION }}-modules-maas-

      - name: Install maas dependencies
        working-directory: packages/maas/frontend
        run: npm install

      - name: Unit tests (Jest)
        working-directory: packages/maas/frontend
        run: npm run test:unit

      - name: Check if there are uncommitted file changes
        working-directory: packages/maas/frontend
        run: |
          clean=$(git status --porcelain)
          if [[ -z "$clean" ]]; then
              echo "Empty git status --porcelain: $clean"
          else
              echo "Uncommitted file changes detected: $clean"
              git diff
              exit 1
          fi
