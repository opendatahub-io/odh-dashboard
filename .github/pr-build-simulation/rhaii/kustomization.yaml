apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CI-only image smoke-test harness. It uses the Core BFF base manifest to run
# the PR-built RHAII image in Kind; it does not validate the RHAII/XKS
# production manifest, dashboard-operator reconciliation, or Gateway routing.
namespace: opendatahub
resources:
  - ../../../distributions/core-bff/manifests/base
patches:
  # The production rendering path supplies the ServiceAccount namespace. Direct
  # Kind application does not, so make the binding point to this test namespace.
  - target:
      group: rbac.authorization.k8s.io
      version: v1
      kind: ClusterRoleBinding
      name: rhaii-dashboard
    patch: |-
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: rhaii-dashboard
      subjects:
        - kind: ServiceAccount
          name: rhaii-dashboard
          namespace: opendatahub
  - path: rhaii-kind.patch.yaml
