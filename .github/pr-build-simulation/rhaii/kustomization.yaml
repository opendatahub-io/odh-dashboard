apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# CI-only image smoke-test harness. It renders the production RHAII bundle
# (manifests/distributions/rhaii), with its reduced service-account RBAC, to
# run the PR-built image in Kind. It does not validate dashboard-operator
# reconciliation or Gateway routing: Kind runs no xKS platform Gateway, so the
# HTTPRoute and the Gateway-only NetworkPolicy are dropped and the workflow
# reaches the Service through a port-forward.
namespace: opendatahub
resources:
  - ../../../manifests/distributions/rhaii
patches:
  - path: rhaii-kind.patch.yaml
  # The bundle takes the RoleBinding subject namespace from params.env, which
  # the installer rewrites. Bind to the ServiceAccount in this namespace.
  - target:
      group: rbac.authorization.k8s.io
      kind: RoleBinding
      name: rhaii-dashboard
    patch: |-
      - op: test
        path: /subjects/0/name
        value: rhaii-dashboard
      - op: replace
        path: /subjects/0/namespace
        value: opendatahub
  - target:
      group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: rhaii-dashboard
    patch: |-
      $patch: delete
      apiVersion: gateway.networking.k8s.io/v1
      kind: HTTPRoute
      metadata:
        name: rhaii-dashboard
  - target:
      group: networking.k8s.io
      kind: NetworkPolicy
      name: rhaii-dashboard
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: rhaii-dashboard
  - target:
      group: policy
      kind: PodDisruptionBudget
      name: rhaii-dashboard
    patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: rhaii-dashboard
