name: pnpm setup
description: Install pnpm from packageManager, cache the pnpm store, and install workspace dependencies.
inputs:
  node-version:
    description: Node.js version for setup-node.
    required: true
  frozen-lockfile:
    description: Whether to run pnpm install with --frozen-lockfile.
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4
    - name: Setup Node.js
      uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
    - name: Install dependencies
      shell: bash
      run: |
        if [[ "${{ inputs.frozen-lockfile }}" == 'true' ]]; then
          pnpm install --frozen-lockfile
        else
          pnpm install
        fi
