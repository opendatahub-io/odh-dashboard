# Enqueue via pull_request_rules; @Mergifyio queue/requeue disabled (commands_restrictions).
#
# Two-label handoff (.github/workflows/mergify-clear-queue-eligibility.yml):
#   lgtm          — Prow /lgtm; stripped on handoff so Tide does not merge the PR.
#   mergify-lgtm  — Queue-eligibility token; survives flake dequeue; cleared on author
#                   push (not Mergify update) so /lgtm is required before re-queue.
#
# Pilot: only PRs labeled mergify-testing are managed by Mergify.
commands_restrictions:
  queue:
    conditions:
      - number < 0
  requeue:
    conditions:
      - number < 0

merge_queue:
  max_parallel_checks: 1
  mode: serial
  status_comments: outcomes
  queue_controls_comment: false

# YAML anchors for conditions reused across queue_rules and pull_request_rules.
# https://docs.mergify.com/configuration/sharing/
shared:
  review_ready: &review-ready
    - base = main
    - -draft
    - -conflict
    - label = mergify-testing
    - label = mergify-lgtm
    - label = approved
    - -label ~= ^do-not-merge/
    - label != needs-rebase
    - "#changes-requested-reviews-by = 0"
    - "#approved-reviews-by >= 1"
  ci_checks: &ci-checks
    - check-success = Tests
    - check-success = ci/prow/images
    - -check-failure ~= ^ci/prow
  # Proactive update gate: same checks as ci_checks, failures only (merge still requires green).
  ci_checks_updateable: &ci-checks-updateable
    - -check-failure = Tests
    - -check-failure ~= ^ci/prow

queue_rules:
  - name: default
    max_checks_retries: 0
    merge_method: squash
    batch_size: 1
    update_method: merge
    branch_protection_injection_mode: queue
    # In-place checks (branch_protection_injection_mode: queue): merge_conditions = queue_conditions.
    queue_conditions: &default-queue-conditions
      - and: *review-ready
      - and: *ci-checks
    merge_conditions: *default-queue-conditions

pull_request_rules:
  # Review/conflict gates only — not CI failure (mergify-lgtm survives flake dequeue).
  - name: Remove mergify-lgtm when no longer merge-ready
    conditions:
      - label = mergify-lgtm
      - or:
          - label != mergify-testing
          - label != approved
          - "#approved-reviews-by = 0"
          - "#changes-requested-reviews-by > 0"
          - conflict
          - label ~= ^do-not-merge/
          - label = needs-rebase
    actions:
      label:
        remove:
          - mergify-lgtm
          - lgtm

  # Pilot only — do not strip lgtm on non-pilot PRs (would block Tide).
  - name: Hand off lgtm to mergify-lgtm
    conditions:
      - label = mergify-testing
      - label = lgtm
    actions:
      label:
        add:
          - mergify-lgtm
        remove:
          - lgtm

  # Merge main before queue so CI runs on current code. Bot update preserves mergify-lgtm;
  # not queued (queue-position = -1; in-queue updates use update_method: merge).
  - name: Update when review-ready and behind
    conditions:
      - and: *review-ready
      - queue-position = -1
      - "#commits-behind > 0"
      - and: *ci-checks-updateable
    actions:
      update:

  # Enqueue on approval readiness; queue_conditions require green CI before merge.
  - name: Queue on review approval
    conditions: *review-ready
    actions:
      queue:
        name: default
