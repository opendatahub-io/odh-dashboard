version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    target-branch: "main"
    labels:
      - "build"

  - package-ecosystem: npm
    directories:
      - /
      - /distributions/core-bff/frontend
      - /packages/agent-ops/frontend
      - /packages/automl/frontend
      - /packages/autorag/frontend
      - /packages/eval-hub/frontend
      - /packages/gen-ai/frontend
      - /packages/maas/frontend
      - /packages/mlflow/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"

    versioning-strategy: lockfile-only

    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 14

    ignore:
      - dependency-name: "@patternfly/*"
        update-types:
          - "version-update:semver-patch"
          - "version-update:semver-minor"
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

    groups:
      npm-updates:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - '*'
        update-types:
          - "minor"
          - "patch"
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: gomod
    directories:
      - /dashboard-operator
      - /distributions/core-bff/bff
      - /packages/agent-ops/bff
      - /packages/automl/bff
      - /packages/autorag/bff
      - /packages/eval-hub/bff
      - /packages/gen-ai/bff
      - /packages/maas/bff
      - /packages/mlflow/bff
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"

    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

    groups:
      go-updates:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - '*'
        update-types:
          - "minor"
          - "patch"
      go-security:
        applies-to: security-updates
        patterns:
          - '*'
