version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
    open-pull-requests-limit: 2
    target-branch: "main"
    labels:
      - "build"

  - package-ecosystem: npm
    directories:
      - /
      - /distributions/core-bff/frontend
      - /packages/agent-ops/frontend
      - /packages/automl/frontend
      - /packages/autorag/frontend
      - /packages/eval-hub/frontend
      - /packages/gen-ai/frontend
      - /packages/maas/frontend
      - /packages/mlflow/frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"

    versioning-strategy: increase-if-necessary

    cooldown:
      default-days: 14
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 14

    ignore:
      - dependency-name: "@patternfly/*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

    # Named groups bundle version-coupled families into 1 PR (matched
    # before the catch-all). Catch-all uses group-by: dependency-name
    # for remaining deps (1 PR per dep across dirs). Security catch-all
    # bundles all CVEs. PatternFly version updates are fully ignored but
    # security updates still need grouping.
    groups:
      react:
        applies-to: version-updates
        patterns:
          - "react"
          - "react-dom"
          - "react-router"
          - "react-router-dom"
        update-types:
          - "minor"
          - "patch"
      material-ui:
        applies-to: version-updates
        patterns:
          - "@mui/*"
          - "@emotion/*"
        update-types:
          - "minor"
          - "patch"
      webpack-ecosystem:
        applies-to: version-updates
        patterns:
          - "webpack*"
        update-types:
          - "minor"
          - "patch"
      testing-library:
        applies-to: version-updates
        patterns:
          - "@testing-library/*"
        update-types:
          - "minor"
          - "patch"
      npm-updates:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - '*'
        update-types:
          - "minor"
          - "patch"
      patternfly-security:
        applies-to: security-updates
        patterns:
          - "@patternfly/*"
      npm-security:
        applies-to: security-updates
        patterns:
          - '*'

  - package-ecosystem: gomod
    directories:
      - /dashboard-operator
      - /distributions/core-bff/bff
      - /packages/agent-ops/bff
      - /packages/automl/bff
      - /packages/autorag/bff
      - /packages/eval-hub/bff
      - /packages/gen-ai/bff
      - /packages/maas/bff
      - /packages/mlflow/bff
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    target-branch: "main"
    labels:
      - "dependencies"

    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3

    groups:
      k8s-ecosystem:
        applies-to: version-updates
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      aws-sdk:
        applies-to: version-updates
        patterns:
          - "github.com/aws/*"
          - "github.com/aws/smithy-go"
      go-updates:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - '*'
        update-types:
          - "minor"
          - "patch"
      go-security:
        applies-to: security-updates
        patterns:
          - '*'
