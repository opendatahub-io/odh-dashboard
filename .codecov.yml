codecov:
  require_ci_to_pass: true

coverage:
  precision: 2
  round: down
  range: '50...70'
  status:
    project:
      default:
        informational: true
        target: auto
        threshold: 1%
    # Keep detailed patch and flag coverage in the PR comment without creating
    # a separate status context for each report.
    patch: off

flags:
  unit:
    paths:
      - frontend/src/
      - backend/src/
      - packages/
      - distributions/
    carryforward: true
  cypress-mock:
    paths:
      - frontend/src/
      - packages/
    carryforward: true

ignore:
  - '**/types.ts'
  - '**/*.d.ts'
  - '**/third_party/**'
  - 'packages/eslint-config/**'
  - 'packages/eslint-plugin/**'
  - 'packages/tsconfig/**'
  - 'packages/contract-tests/**'
  - 'packages/cypress/**'

comment:
  layout: 'reach,diff,flags,files,footer'
  behavior: default
  require_changes: false

# Components remain available for Codecov filtering and reporting, but do not
# define per-component statuses. The single project status above is the only
# coverage context published to commits.
component_management:
  individual_components:
    - component_id: frontend-core
      name: 'Frontend Core'
      paths:
        - frontend/src/**
    - component_id: backend
      name: 'Backend'
      paths:
        - backend/src/**
    - component_id: pkg-model-serving
      name: 'Model Serving'
      paths:
        - packages/model-serving/**
    - component_id: pkg-observability
      name: 'Observability'
      paths:
        - packages/observability/**
