apiVersion: chaos.operatorchaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: dashboard-pod-kill
spec:
  tier: 1
  target:
    operator: dashboard
    component: odh-dashboard
    resource: Deployment/dashboard-operator
  steadyState:
    checks:
      - type: conditionTrue
        apiVersion: apps/v1
        kind: Deployment
        name: dashboard-operator
        namespace: opendatahub
        conditionType: Available
    timeout: "30s"
  injection:
    type: PodKill
    parameters:
      labelSelector: app.kubernetes.io/name=dashboard-operator
    count: 1
    ttl: "300s"
  hypothesis:
    description: >-
      When the dashboard-operator controller pod is killed, Kubernetes should
      recreate it within the recovery timeout. The replacement controller must
      resume reconciliation while all Dashboard operands remain healthy.
    recoveryTimeout: 120s
  blastRadius:
    maxPodsAffected: 1
    allowedNamespaces:
      - opendatahub
