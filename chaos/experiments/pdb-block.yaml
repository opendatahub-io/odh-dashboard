apiVersion: chaos.operatorchaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: dashboard-pdb-block
spec:
  tier: 2
  target:
    operator: dashboard
    component: odh-dashboard
    resource: Deployment/dashboard-operator
  steadyState:
    checks:
      - type: conditionTrue
        apiVersion: apps/v1
        kind: Deployment
        name: dashboard-operator
        namespace: opendatahub
        conditionType: Available
    timeout: "30s"
  injection:
    type: PDBBlock
    dangerLevel: high
    parameters:
      labelSelector: app.kubernetes.io/name=dashboard-operator
    ttl: "10s"
  hypothesis:
    description: >-
      Creating a PDB with maxUnavailable=0 must block voluntary eviction of
      the dashboard-operator controller pod without degrading its operands.
      Removing the injected PDB must restore the normal controller state.
    recoveryTimeout: 120s
  blastRadius:
    maxPodsAffected: 1
    allowDangerous: true
    allowedNamespaces:
      - opendatahub
