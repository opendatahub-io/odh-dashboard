apiVersion: chaos.operatorchaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: dashboard-network-partition
spec:
  tier: 2
  target:
    operator: dashboard
    component: odh-dashboard
    resource: Deployment/dashboard-operator
  steadyState:
    checks:
      - type: conditionTrue
        apiVersion: apps/v1
        kind: Deployment
        name: dashboard-operator
        namespace: opendatahub
        conditionType: Available
    timeout: "30s"
  injection:
    type: NetworkPartition
    parameters:
      labelSelector: app.kubernetes.io/name=dashboard-operator
    ttl: "300s"
  hypothesis:
    description: >-
      When dashboard-operator is partitioned from the API server,
      managed-resource drift must stay unhealed. Once the partition is removed,
      informers must reconnect and the controller must restore the drift without
      manual intervention.
    recoveryTimeout: 180s
  blastRadius:
    maxPodsAffected: 1
    allowedNamespaces:
      - opendatahub
